<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>Meyonze Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#10151c;color:#eef3f9;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
h1{font-size:22px;font-weight:700;letter-spacing:.1em;color:#a3b5cb;margin-bottom:8px}

.games{display:flex;flex-direction:column;gap:16px;width:100%;max-width:400px}
a.card{display:flex;align-items:center;justify-content:space-between;background:#1a212c;border:1px solid #2b3545;border-radius:14px;padding:20px 24px;text-decoration:none;color:#eef3f9;transition:border-color .2s,background .2s}
a.card:hover{background:#202a38;border-color:#e8765a}
.card-title{font-size:18px;font-weight:700;letter-spacing:.05em}
.card-arrow{font-size:20px;color:#5a6e87}
footer{margin-top:48px;font-size:12px;color:#3a4860}

</head>
