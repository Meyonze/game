<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>けいさんドリル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Yusei+Magic&family=Mochiy+Pop+One&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height:100%;
    font-family:'Kosugi Maru','Hiragino Sans',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffe1f3 0%, transparent 38%),
      radial-gradient(circle at 88% 92%, #d6f5ff 0%, transparent 42%),
      radial-gradient(circle at 90% 10%, #fff6c9 0%, transparent 35%),
      linear-gradient(160deg, #ffd6ec 0%, #ffe9c9 40%, #d3f3ff 100%);
    background-attachment: fixed;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  body {
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:16px;
  }

  /* floating background decorations */
  .deco {
    position:fixed; pointer-events:none; z-index:0; opacity:.8;
    animation: drift 14s ease-in-out infinite;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.06));
  }
  @keyframes drift {
    0%,100% { transform: translateY(0) translateX(0) rotate(0deg); }
    50% { transform: translateY(-22px) translateX(10px) rotate(6deg); }
  }
  .d1{top:6%;left:6%;font-size:38px;animation-duration:13s}
  .d2{top:14%;right:8%;font-size:28px;animation-duration:16s;animation-delay:1s}
  .d3{bottom:10%;left:9%;font-size:30px;animation-duration:15s;animation-delay:2s}
  .d4{bottom:16%;right:7%;font-size:34px;animation-duration:18s;animation-delay:.5s}
  .d5{top:45%;left:3%;font-size:22px;animation-duration:12s;animation-delay:1.5s}
  .d6{top:50%;right:3%;font-size:24px;animation-duration:17s;animation-delay:2.5s}

  .app {
    position:relative; z-index:1;
    width:100%;
    max-width:420px;
    min-height:min(780px, 94svh);
    background:#fffdf9;
    border-radius:32px;
    box-shadow: 0 20px 44px rgba(150,90,140,.28), 0 0 0 7px #ffffffcc inset, 0 0 0 10px #ffd3ec66 inset;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .screen {
    display:none;
    flex-direction:column;
    flex:1;
    padding:20px 18px 22px;
    position:relative;
  }
  .screen.active { display:flex; }

  /* ---------- common bits ---------- */
  .top-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  .icon-btn {
    width:42px; height:42px; border-radius:50%; flex:0 0 auto;
    border:none; background:#fff0c4; color:#a9770f;
    font-size:19px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 #edcd7f;
    cursor:pointer;
  }
  .icon-btn:active { transform:translateY(2px); box-shadow:0 1px 0 #edcd7f; }

  h1.title {
    text-align:center; font-family:'Mochiy Pop One',sans-serif;
    font-size:32px; color:#ff6fa5; letter-spacing:.03em;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ffc9e2, 5px 5px 10px rgba(255,111,165,.25);
    margin: 8px 0 2px;
  }
  .subtitle { text-align:center; color:#8a7aa8; font-size:13px; margin-bottom:14px; }

  .mascot-badge {
    position:relative; width:132px; height:132px; margin:4px auto 8px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d0 0%, #ffd9ef 55%, #ffc2e6 100%);
    box-shadow: 0 10px 0 #ffb3da, 0 14px 20px rgba(255,140,190,.35), 0 0 0 6px #fff inset;
    animation: bob 2.4s ease-in-out infinite;
  }
  .mascot-badge .face { font-size:70px; filter: drop-shadow(0 4px 3px rgba(0,0,0,.12)); }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-10px) rotate(2deg)} }

  .big-btn {
    display:block; width:100%; padding:16px; margin-top:auto;
    border:none; border-radius:22px; font-family:'Mochiy Pop One',sans-serif;
    font-size:19px; color:#fff; background:linear-gradient(180deg,#ff9fc0,#ff5f9c);
    box-shadow:0 6px 0 #e2417f;
    cursor:pointer;
  }
  .big-btn:active { transform:translateY(4px); box-shadow:0 2px 0 #e2417f; }
  .big-btn.secondary {
    background:linear-gradient(180deg,#9fe4ff,#5cc3f2);
    box-shadow:0 6px 0 #2f96c9; margin-top:10px;
  }
  .big-btn.secondary:active { box-shadow:0 2px 0 #2f96c9; }
  .big-btn.ghost {
    background:#fff; color:#9a8ab0; box-shadow:0 4px 0 #e8e0f0; font-size:14px; padding:10px;
    font-family:'Kosugi Maru';
  }

  /* ---------- title screen ---------- */
  #screen-title { justify-content:center; align-items:center; text-align:center; }
  #screen-title .mascot-badge { width:150px; height:150px; }
  #screen-title .mascot-badge .face { font-size:80px; }
  .best-summary {
    margin-top:16px; background:linear-gradient(180deg,#fff4da,#ffe9bd); border-radius:18px; padding:12px 16px;
    font-size:13px; color:#9a6b1f; width:100%; font-weight:bold;
  }
  .title-row-btns { display:flex; gap:8px; width:100%; margin-top:12px; }
  .title-row-btns .big-btn { margin-top:0; }

  /* ---------- select screen ---------- */
  .section-label { font-size:13px; color:#c26fa0; font-weight:bold; margin:12px 0 6px; }
  .grade-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip {
    flex:0 0 auto; padding:10px 16px; border-radius:16px; border:2px solid #ffcbe4;
    background:#fff; font-family:'Kosugi Maru'; font-size:15px; color:#c26fa0;
    cursor:pointer; white-space:nowrap; font-weight:bold;
  }
  .chip.active { background:linear-gradient(180deg,#ff9fc0,#ff6fa5); color:#fff; border-color:#ff6fa5; }

  .mode-row { display:flex; gap:8px; }
  .mode-btn {
    flex:1; padding:10px 4px; border-radius:16px; border:2px solid #bfe6f5;
    background:#fff; color:#3f9cbd; font-family:'Kosugi Maru'; font-size:13px; font-weight:bold;
    cursor:pointer; text-align:center; line-height:1.3;
  }
  .mode-btn small { display:block; font-size:10px; font-weight:normal; color:#7fb8cc; margin-top:2px; }
  .mode-btn.active { background:linear-gradient(180deg,#9fe4ff,#5cc3f2); color:#fff; border-color:#5cc3f2; }
  .mode-btn.active small { color:#eaf8ff; }

  .op-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:2px; }
  .op-card {
    position:relative; border-radius:18px; border:2px solid #ffe1c8; background:#fff;
    padding:12px 8px 8px; text-align:center; cursor:pointer;
  }
  .op-card .op-sym { font-size:26px; color:#ff8a3d; font-family:'Mochiy Pop One'; }
  .op-card .op-name { font-size:12px; color:#a98a63; margin-top:2px; font-weight:bold; }
  .op-card .stars { font-size:12px; color:#ffb200; margin-top:4px; letter-spacing:1px; min-height:14px; }
  .op-card.active { border-color:#ff6fa5; background:#fff2f8; }
  .op-card.locked { opacity:.4; pointer-events:none; }
  .op-card.locked::after {
    content:'🔒'; position:absolute; top:6px; right:8px; font-size:12px;
  }

  /* ---------- play screen ---------- */
  .play-header { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .stones-wrap { flex:1; overflow-x:auto; }
  .stones-row { display:flex; gap:4px; padding:2px; width:max-content; margin:0 auto; }
  .stone {
    width:22px; height:22px; border-radius:50%; background:#f0eaf5; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:11px;
    border:2px solid #e4dcee; transition: all .2s;
  }
  .stone.current { border-color:#ff9fc0; box-shadow:0 0 0 3px #ffe1ee; animation:pulse 1s ease-in-out infinite; }
  .stone.ok { background:#8fe0b6; border-color:#4fbf95; color:#fff; }
  .stone.ng { background:#ffaba0; border-color:#e14b4b; color:#fff; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
  .meta-row { display:flex; justify-content:center; font-size:12px; color:#b09ac2; margin-top:4px; font-weight:bold; }

  .combo-badge {
    align-self:center; margin-top:4px; font-size:15px; color:#ff5fa0; font-weight:bold;
    opacity:0; transform:scale(.6); transition:opacity .2s, transform .2s;
    font-family:'Mochiy Pop One';
  }
  .combo-badge.show { opacity:1; transform:scale(1); animation:comboPop .3s ease; }
  @keyframes comboPop { 0%{transform:scale(.5) rotate(-8deg)} 60%{transform:scale(1.25) rotate(4deg)} 100%{transform:scale(1) rotate(0)} }

  .question-box {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .mascot-small-wrap {
    width:84px; height:84px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d0 0%, #ffe0f0 60%, #ffcbe6 100%);
    box-shadow:0 5px 0 #ffb3da, 0 0 0 4px #fff inset;
    display:flex; align-items:center; justify-content:center;
  }
  .mascot-small { font-size:48px; transition:transform .15s; }
  .speech {
    background:#fff; border:2px solid #ffcbe4; border-radius:14px; padding:6px 14px;
    font-size:13px; color:#c26fa0; margin-top:8px; min-height:18px; font-weight:bold;
  }
  .equation-plate {
    background:#fff; border-radius:22px; padding:18px 22px; margin:16px 0 12px;
    box-shadow: 0 6px 0 #ffe1c8, 0 8px 18px rgba(255,140,80,.12);
    border:3px solid #ffe9d6;
  }
  .question-text {
    font-family:'Mochiy Pop One'; font-size:clamp(30px,9vw,42px); color:#4a3a63;
    letter-spacing:.02em; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .question-text .blank { color:#ff6fa5; }
  .answer-display {
    font-family:'Mochiy Pop One'; font-size:30px; color:#ff8a3d; min-height:44px;
    background:#fff8ef; border:3px solid #ffd9a0; border-radius:16px;
    min-width:140px; padding:4px 14px; font-variant-numeric:tabular-nums;
  }
  .answer-display.correct { color:#2fae6b; border-color:#4fbf95; background:#f1fff6; }
  .answer-display.wrong { color:#e14b4b; border-color:#e14b4b; background:#fff2f1; font-size:20px; }

  .numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:16px; }
  .num-btn {
    padding:17px 0; font-size:22px; font-weight:bold; border-radius:16px; border:none;
    background:#fff; color:#4a3a63; box-shadow:0 4px 0 #e9e1f0;
    font-family:'Kosugi Maru'; cursor:pointer;
  }
  .num-btn:active { transform:translateY(3px); box-shadow:0 1px 0 #e9e1f0; }
  .num-btn.ok { background:linear-gradient(180deg,#9fe4ff,#5cc3f2); color:#fff; box-shadow:0 4px 0 #2f96c9; }
  .num-btn.del { background:#ffe0e0; color:#c14646; box-shadow:0 4px 0 #e6b3b3; }

  /* ---------- result screen ---------- */
  #screen-result { align-items:center; text-align:center; justify-content:flex-start; }
  .stars-row { font-size:46px; margin:10px 0; letter-spacing:6px; }
  .star { filter: grayscale(1) opacity(.3); transition:transform .3s, filter .3s; display:inline-block; }
  .star.lit { filter:none; animation:pop .4s ease; }
  @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

  .result-stats {
    width:100%; background:#fff3f8; border-radius:18px; padding:14px; margin-top:8px;
    display:flex; justify-content:space-around; font-size:12px; color:#a06b8f;
  }
  .result-stats b { display:block; font-size:19px; color:#ff5fa0; font-family:'Mochiy Pop One'; }
  .result-msg { font-size:17px; color:#ff8a3d; margin-top:12px; font-family:'Mochiy Pop One'; }

  .sticker-reveal {
    width:100%; background:linear-gradient(180deg,#fff8e0,#ffedc0); border-radius:18px; padding:12px; margin-top:12px;
    display:none;
  }
  .sticker-reveal.show { display:block; }
  .sticker-reveal .label { font-size:12px; color:#a9770f; font-weight:bold; margin-bottom:6px; }
  .sticker-reveal .items { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .sticker-reveal .items span { font-size:34px; animation:stickerPop .5s ease backwards; }

  @keyframes stickerPop { 0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.2) rotate(8deg)} 100%{transform:scale(1) rotate(0)} }

  .star-particle {
    position:fixed; top:50%; left:50%; font-size:20px; pointer-events:none; z-index:50;
    animation: burst 900ms ease-out forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  .flash-overlay {
    position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:32px;
  }
  .flash-overlay.go { animation: flash .4s ease; }
  @keyframes flash { 0%{opacity:.5} 100%{opacity:0} }
  .flash-overlay.ok { background:#7fe0ab; }
  .flash-overlay.ng { background:#ff9a9a; }

  /* ---------- sticker album ---------- */
  .album-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; overflow-y:auto; padding:4px 2px; }
  .album-cell {
    aspect-ratio:1; border-radius:14px; background:#fff; border:2px solid #ffe1c8;
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .album-cell.locked { background:#f3eef7; color:#cfc3dd; border-style:dashed; }
  .album-count { text-align:center; font-size:13px; color:#a06b8f; font-weight:bold; margin-bottom:10px; }
</style>
</head>
<body>
<span class="deco d1">☁️</span>
<span class="deco d2">⭐</span>
<span class="deco d3">✨</span>
<span class="deco d4">☁️</span>
<span class="deco d5">💗</span>
<span class="deco d6">🌟</span>

<div class="app">

  <!-- ===== TITLE ===== -->
  <section class="screen active" id="screen-title">
    <div class="mascot-badge"><span class="face" id="title-mascot">🐱</span></div>
    <h1 class="title">けいさんドリル</h1>
    <p class="subtitle">あそんで まなぶ さんすうドリル</p>
    <button class="big-btn" id="btn-goto-select" style="margin-top:16px">あそぶ！</button>
    <div class="title-row-btns">
      <button class="big-btn secondary" id="btn-goto-album">📔 シールちょう</button>
    </div>
    <div class="best-summary" id="best-summary">まだ きろくが ありません</div>
    <button class="big-btn ghost" id="btn-mute" style="margin-top:12px">🔊 おと：オン</button>
  </section>

  <!-- ===== SELECT ===== -->
  <section class="screen" id="screen-select">
    <div class="top-row">
      <button class="icon-btn" id="btn-back-title">←</button>
      <span style="font-family:'Mochiy Pop One';color:#ff6fa5;font-size:16px">もんだいを えらぶ</span>
      <span style="width:42px"></span>
    </div>

    <div class="section-label">がくねん</div>
    <div class="grade-row" id="grade-row"></div>

    <div class="section-label">もんだいの けいしき</div>
    <div class="mode-row" id="mode-row">
      <button class="mode-btn" data-mode="normal">ふつう<small>7 ＋ 5 ＝ ？</small></button>
      <button class="mode-btn" data-mode="missing">むしくい<small>7 ＋ □ ＝ 12</small></button>
    </div>

    <div class="section-label">けいさんの しゅるい</div>
    <div class="op-grid" id="op-grid"></div>

    <button class="big-btn" id="btn-start-play" style="margin-top:18px">スタート！</button>
  </section>

  <!-- ===== PLAY ===== -->
  <section class="screen" id="screen-play">
    <div class="flash-overlay" id="flash-overlay"></div>
    <div class="play-header">
      <button class="icon-btn" id="btn-quit-play">←</button>
      <div class="stones-wrap"><div class="stones-row" id="stones-row"></div></div>
      <button class="icon-btn" id="btn-mute-play">🔊</button>
    </div>
    <div class="meta-row"><span id="timer-label">0:00</span></div>
    <div class="combo-badge" id="combo-badge">🔥 3れんぞく！</div>

    <div class="question-box">
      <div class="mascot-small-wrap"><span class="mascot-small" id="play-mascot">🐱</span></div>
      <div class="speech" id="play-speech">がんばって！</div>
      <div class="equation-plate"><div class="question-text" id="question-text">3 ＋ 4 ＝</div></div>
      <div class="answer-display" id="answer-display">？</div>
    </div>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-d="1">1</button>
      <button class="num-btn" data-d="2">2</button>
      <button class="num-btn" data-d="3">3</button>
      <button class="num-btn" data-d="4">4</button>
      <button class="num-btn" data-d="5">5</button>
      <button class="num-btn" data-d="6">6</button>
      <button class="num-btn" data-d="7">7</button>
      <button class="num-btn" data-d="8">8</button>
      <button class="num-btn" data-d="9">9</button>
      <button class="num-btn del" id="btn-del">⌫</button>
      <button class="num-btn" data-d="0">0</button>
      <button class="num-btn ok" id="btn-ok">OK</button>
    </div>
  </section>

  <!-- ===== RESULT ===== -->
  <section class="screen" id="screen-result">
    <div class="mascot-badge"><span class="face" id="result-mascot">🐱</span></div>
    <div class="stars-row">
      <span class="star" id="star-1">★</span><span class="star" id="star-2">★</span><span class="star" id="star-3">★</span>
    </div>
    <div class="result-msg" id="result-msg">よくできました！</div>
    <div class="result-stats">
      <div><b id="stat-correct">10</b>せいかい</div>
      <div><b id="stat-time">0:00</b>タイム</div>
      <div><b id="stat-combo">0</b>さいだいコンボ</div>
    </div>
    <div class="sticker-reveal" id="sticker-reveal">
      <div class="label">ごほうびシールを ゲット！</div>
      <div class="items" id="sticker-items"></div>
    </div>
    <button class="big-btn" id="btn-retry" style="margin-top:18px">もういちど</button>
    <button class="big-btn secondary" id="btn-back-select">もんだいを えらびなおす</button>
  </section>

  <!-- ===== ALBUM ===== -->
  <section class="screen" id="screen-album">
    <div class="top-row">
      <button class="icon-btn" id="btn-back-title-2">←</button>
      <span style="font-family:'Mochiy Pop One';color:#ff6fa5;font-size:16px">シールちょう</span>
      <span style="width:42px"></span>
    </div>
    <div class="album-count" id="album-count">0 / 30 あつめた</div>
    <div class="album-grid" id="album-grid"></div>
  </section>

</div>

<script>
(function(){
  'use strict';

  /* ---------------- data / config ---------------- */
  const OP_META = {
    add: { sym:'＋', name:'たしざん' },
    sub: { sym:'－', name:'ひきざん' },
    mul: { sym:'×', name:'かけざん' },
    div: { sym:'÷', name:'わりざん' },
    mix: { sym:'★', name:'ミックス' },
  };

  const CONFIG = {
    1: { ops:['add','sub'], add:{aMax:9,bMax:9}, sub:{topMax:18} },
    2: { ops:['add','sub','mul'], add:{aMax:99,bMax:99}, sub:{topMax:99}, mul:{aMax:9,bMax:9} },
    3: { ops:['add','sub','mul','div'], add:{aMax:999,bMax:999}, sub:{topMax:999}, mul:{aMax:99,bMax:9}, div:{divisorMax:9,quotientMax:9} },
    4: { ops:['add','sub','mul','div'], add:{aMax:9999,bMax:9999}, sub:{topMax:9999}, mul:{aMax:99,bMax:99}, div:{divisorMax:12,quotientMax:99} },
    5: { ops:['add','sub','mul','div'], add:{aMax:99999,bMax:99999}, sub:{topMax:99999}, mul:{aMax:999,bMax:99}, div:{divisorMax:99,quotientMax:99} },
    6: { ops:['add','sub','mul','div'], add:{aMax:999999,bMax:999999}, sub:{topMax:999999}, mul:{aMax:9999,bMax:99}, div:{divisorMax:999,quotientMax:99} },
  };

  const QUESTIONS_PER_SESSION = 10;
  const STORAGE_KEY = 'meyonze_mathdrill_v2';
  const MUTE_KEY = 'meyonze_mathdrill_mute';
  const STICKER_KEY = 'meyonze_mathdrill_stickers';

  const PRAISE = ['せいかい！','やったね！','すごい！','ピンポン！','ばっちり！'];
  const CONSOLE_WORDS = ['おしい！','どんまい！','つぎがんばろう！'];

  const STICKERS = [
    '🍓','🍉','🍩','🍭','🧁','🍦','🍎','🍰','🍪','🍬',
    '🐰','🐱','🐶','🐻','🦊','🐼','🐨','🐣','🐤','🐢',
    '🦄','🌈','🌸','🍀','🌻','🎀','👑','💎','🦋','🐬',
  ];

  /* ---------------- state ---------------- */
  const state = {
    grade: Number(localStorage.getItem('mathdrill_last_grade')) || 1,
    op: localStorage.getItem('mathdrill_last_op') || 'add',
    mode: localStorage.getItem('mathdrill_last_mode') || 'normal',
    queue: [], idx: 0, correct: 0, combo: 0, maxCombo: 0,
    startTime: 0, timerHandle: null, input: '', locked: false,
    muted: localStorage.getItem(MUTE_KEY) === '1',
  };

  /* ---------------- helpers ---------------- */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function availableOps(grade) { return CONFIG[grade].ops; }

  // returns the raw triple for an operation: a (sym) b = c
  function genRaw(grade, op) {
    const c = CONFIG[grade];
    if (op === 'add') {
      const a = randInt(1, c.add.aMax), b = randInt(1, c.add.bMax);
      return { a, b, c: a + b, sym: '＋' };
    }
    if (op === 'sub') {
      const top = randInt(1, c.sub.topMax);
      const b = randInt(0, top);
      return { a: top, b, c: top - b, sym: '－' };
    }
    if (op === 'mul') {
      const a = randInt(1, c.mul.aMax), b = randInt(1, c.mul.bMax);
      return { a, b, c: a * b, sym: '×' };
    }
    if (op === 'div') {
      const divisor = randInt(2, c.div.divisorMax);
      const quotient = randInt(1, c.div.quotientMax);
      return { a: divisor * quotient, b: divisor, c: quotient, sym: '÷' };
    }
  }

  function genQuestion(grade, op, mode) {
    const actualOp = op === 'mix' ? availableOps(grade)[randInt(0, availableOps(grade).length - 1)] : op;
    const raw = genRaw(grade, actualOp);
    if (mode === 'missing') {
      const slot = ['a', 'b', 'c'][randInt(0, 2)];
      const parts = {
        a: slot === 'a' ? '□' : raw.a,
        b: slot === 'b' ? '□' : raw.b,
        c: slot === 'c' ? '□' : raw.c,
      };
      return {
        text: `${parts.a} ${raw.sym} ${parts.b} ＝ ${parts.c}`,
        answer: raw[slot],
        blank: true,
      };
    }
    return { text: `${raw.a} ${raw.sym} ${raw.b} ＝`, answer: raw.c, blank: false };
  }

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveRecords(r) { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); }
  function recordKey(grade, op, mode) { return grade + '_' + op + '_' + mode; }

  function loadStickers() {
    try { return JSON.parse(localStorage.getItem(STICKER_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveStickers(arr) { localStorage.setItem(STICKER_KEY, JSON.stringify(arr)); }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  /* ---------------- sound ---------------- */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { /* no audio available */ }
    }
    return audioCtx;
  }
  function beep(freq, dur, type) {
    if (state.muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  }
  function sfxCorrect() { beep(880, 0.15, 'triangle'); setTimeout(() => beep(1320, 0.18, 'triangle'), 90); }
  function sfxWrong() { beep(180, 0.25, 'sawtooth'); }
  function sfxTap() { beep(600, 0.05, 'square'); }
  function sfxClear() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle'), i * 110)); }
  function sfxSticker() { [660, 990].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'square'), i * 90)); }

  function updateMuteUI() {
    const label = state.muted ? '🔇 おと：オフ' : '🔊 おと：オン';
    document.getElementById('btn-mute').textContent = label;
    document.getElementById('btn-mute-play').textContent = state.muted ? '🔇' : '🔊';
  }

  /* ---------------- screen management ---------------- */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ---------------- title screen ---------------- */
  function renderBestSummary() {
    const records = loadRecords();
    const keys = Object.keys(records);
    const el = document.getElementById('best-summary');
    const stickerCount = loadStickers().length;
    if (keys.length === 0) { el.textContent = 'まだ きろくが ありません。あそんでみよう！'; return; }
    let totalStars = 0;
    keys.forEach(k => totalStars += (records[k].stars || 0));
    el.textContent = `⭐ ほし ${totalStars}こ　📔 シール ${stickerCount}/${STICKERS.length}`;
  }

  /* ---------------- select screen ---------------- */
  function renderSelect() {
    const gradeRow = document.getElementById('grade-row');
    gradeRow.innerHTML = '';
    for (let g = 1; g <= 6; g++) {
      const chip = document.createElement('button');
      chip.className = 'chip' + (g === state.grade ? ' active' : '');
      chip.textContent = g + 'ねんせい';
      chip.addEventListener('click', () => { sfxTap(); state.grade = g; syncOpForGrade(); renderSelect(); });
      gradeRow.appendChild(chip);
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === state.mode);
    });

    const ops = availableOps(state.grade).concat(availableOps(state.grade).length > 1 ? ['mix'] : []);
    const opGrid = document.getElementById('op-grid');
    opGrid.innerHTML = '';
    const records = loadRecords();
    ops.forEach(op => {
      const card = document.createElement('div');
      card.className = 'op-card' + (op === state.op ? ' active' : '');
      const rec = records[recordKey(state.grade, op, state.mode)];
      const stars = rec ? rec.stars : 0;
      card.innerHTML = `
        <div class="op-sym">${OP_META[op].sym}</div>
        <div class="op-name">${OP_META[op].name}</div>
        <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>`;
      card.addEventListener('click', () => { sfxTap(); state.op = op; renderSelect(); });
      opGrid.appendChild(card);
    });
  }

  function syncOpForGrade() {
    const ops = availableOps(state.grade);
    if (!ops.includes(state.op) && state.op !== 'mix') state.op = ops[0];
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => { sfxTap(); state.mode = btn.dataset.mode; renderSelect(); });
  });

  /* ---------------- play screen ---------------- */
  function startSession() {
    state.queue = [];
    for (let i = 0; i < QUESTIONS_PER_SESSION; i++) state.queue.push(genQuestion(state.grade, state.op, state.mode));
    state.idx = 0; state.correct = 0; state.combo = 0; state.maxCombo = 0; state.input = ''; state.locked = false;
    state.startTime = Date.now();
    localStorage.setItem('mathdrill_last_grade', state.grade);
    localStorage.setItem('mathdrill_last_op', state.op);
    localStorage.setItem('mathdrill_last_mode', state.mode);

    showScreen('screen-play');
    document.getElementById('play-mascot').textContent = '🐱';
    document.getElementById('play-speech').textContent = 'がんばって！';
    renderStones();
    startTimer();
    renderQuestion();
  }

  function renderStones() {
    const row = document.getElementById('stones-row');
    row.innerHTML = '';
    for (let i = 0; i < QUESTIONS_PER_SESSION; i++) {
      const s = document.createElement('div');
      s.className = 'stone';
      s.id = 'stone-' + i;
      s.textContent = i + 1;
      row.appendChild(s);
    }
  }

  function startTimer() {
    clearInterval(state.timerHandle);
    state.timerHandle = setInterval(() => {
      const elapsed = (Date.now() - state.startTime) / 1000;
      document.getElementById('timer-label').textContent = fmtTime(elapsed);
    }, 250);
  }

  function renderQuestion() {
    state.input = '';
    state.locked = false;
    const q = state.queue[state.idx];
    document.getElementById('question-text').innerHTML = q.text.replace('□', '<span class="blank">□</span>');
    const disp = document.getElementById('answer-display');
    disp.textContent = '？';
    disp.className = 'answer-display';
    document.querySelectorAll('.stone').forEach(s => s.classList.remove('current'));
    const stone = document.getElementById('stone-' + state.idx);
    if (stone) stone.classList.add('current');
  }

  function updateAnswerDisplay() {
    document.getElementById('answer-display').textContent = state.input.length ? state.input : '？';
  }

  function pressDigit(d) {
    if (state.locked) return;
    if (state.input.length >= 7) return;
    if (state.input === '0') state.input = '';
    state.input += d;
    updateAnswerDisplay();
    sfxTap();
  }
  function pressBackspace() {
    if (state.locked) return;
    state.input = state.input.slice(0, -1);
    updateAnswerDisplay();
    sfxTap();
  }

  function flashOverlay(kind) {
    const el = document.getElementById('flash-overlay');
    el.className = 'flash-overlay go ' + kind;
    setTimeout(() => { el.className = 'flash-overlay'; }, 400);
  }

  function showCombo() {
    const badge = document.getElementById('combo-badge');
    if (state.combo >= 3) {
      badge.textContent = `🔥 ${state.combo}れんぞく！`;
      badge.classList.remove('show'); void badge.offsetWidth; badge.classList.add('show');
    } else {
      badge.classList.remove('show');
    }
  }

  function submitAnswer() {
    if (state.locked || state.input === '') return;
    state.locked = true;
    const q = state.queue[state.idx];
    const userVal = Number(state.input);
    const isCorrect = userVal === q.answer;
    const disp = document.getElementById('answer-display');
    const mascot = document.getElementById('play-mascot');
    const speech = document.getElementById('play-speech');
    const stone = document.getElementById('stone-' + state.idx);

    if (isCorrect) {
      state.correct++; state.combo++; state.maxCombo = Math.max(state.maxCombo, state.combo);
      disp.className = 'answer-display correct';
      mascot.textContent = '😻';
      speech.textContent = PRAISE[randInt(0, PRAISE.length - 1)];
      if (stone) { stone.classList.remove('current'); stone.classList.add('ok'); stone.textContent = '◎'; }
      flashOverlay('ok'); sfxCorrect();
    } else {
      state.combo = 0;
      disp.className = 'answer-display wrong';
      disp.textContent = state.input + ' (せいかい: ' + q.answer + ')';
      mascot.textContent = '😿';
      speech.textContent = CONSOLE_WORDS[randInt(0, CONSOLE_WORDS.length - 1)];
      if (stone) { stone.classList.remove('current'); stone.classList.add('ng'); stone.textContent = '✗'; }
      flashOverlay('ng'); sfxWrong();
    }
    showCombo();

    setTimeout(() => {
      mascot.textContent = '🐱';
      state.idx++;
      if (state.idx >= QUESTIONS_PER_SESSION) {
        finishSession();
      } else {
        renderQuestion();
      }
    }, isCorrect ? 700 : 1300);
  }

  function awardStickers(stars) {
    const pulls = stars; // 0,1,2,3 pulls
    if (pulls <= 0) return [];
    const collected = new Set(loadStickers());
    const earned = [];
    for (let i = 0; i < pulls; i++) {
      const uncollected = STICKERS.filter(s => !collected.has(s));
      const pick = uncollected.length > 0
        ? uncollected[randInt(0, uncollected.length - 1)]
        : STICKERS[randInt(0, STICKERS.length - 1)];
      collected.add(pick);
      earned.push(pick);
    }
    saveStickers(Array.from(collected));
    return earned;
  }

  function finishSession() {
    clearInterval(state.timerHandle);
    const totalTime = (Date.now() - state.startTime) / 1000;
    const avgTime = totalTime / QUESTIONS_PER_SESSION;

    let stars = 0;
    if (state.correct === QUESTIONS_PER_SESSION && avgTime <= 6) stars = 3;
    else if (state.correct >= 8) stars = 2;
    else if (state.correct >= 5) stars = 1;

    const records = loadRecords();
    const key = recordKey(state.grade, state.op, state.mode);
    const prev = records[key] || { stars: 0, bestTime: null };
    records[key] = {
      stars: Math.max(prev.stars, stars),
      bestTime: (state.correct === QUESTIONS_PER_SESSION) ? Math.min(prev.bestTime || Infinity, totalTime) : prev.bestTime,
    };
    saveRecords(records);

    const earnedStickers = awardStickers(stars);
    renderResult(stars, totalTime, earnedStickers);
  }

  /* ---------------- result screen ---------------- */
  function renderResult(stars, totalTime, earnedStickers) {
    showScreen('screen-result');
    document.getElementById('stat-correct').textContent = state.correct + '/' + QUESTIONS_PER_SESSION;
    document.getElementById('stat-time').textContent = fmtTime(totalTime);
    document.getElementById('stat-combo').textContent = state.maxCombo;

    const msgs = ['また れんしゅうしよう！', 'よくできました！', 'すばらしい！', 'かんぺき！！'];
    document.getElementById('result-msg').textContent = msgs[stars];
    document.getElementById('result-mascot').textContent = stars >= 2 ? '😻' : '🐱';

    for (let i = 1; i <= 3; i++) document.getElementById('star-' + i).classList.remove('lit');
    [1,2,3].slice(0, stars).forEach((n, i) => {
      setTimeout(() => {
        document.getElementById('star-' + n).classList.add('lit');
      }, i * 250);
    });

    const revealBox = document.getElementById('sticker-reveal');
    const itemsBox = document.getElementById('sticker-items');
    itemsBox.innerHTML = '';
    if (earnedStickers && earnedStickers.length > 0) {
      revealBox.classList.add('show');
      earnedStickers.forEach((s, i) => {
        const span = document.createElement('span');
        span.textContent = s;
        span.style.animationDelay = (stars * 0.25 + 0.3 + i * 0.15) + 's';
        itemsBox.appendChild(span);
      });
      setTimeout(sfxSticker, (stars * 250) + 400);
    } else {
      revealBox.classList.remove('show');
    }

    if (stars === 3) {
      setTimeout(() => { burstStars(); sfxClear(); }, 700);
    }
  }

  function burstStars() {
    const container = document.querySelector('.app');
    const rect = container.getBoundingClientRect();
    for (let i = 0; i < 16; i++) {
      const el = document.createElement('span');
      el.className = 'star-particle';
      el.textContent = ['⭐','✨','🌟'][randInt(0,2)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 120;
      el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      el.style.setProperty('--rot', (Math.random()*360) + 'deg');
      el.style.left = (rect.left + rect.width / 2) + 'px';
      el.style.top = (rect.top + rect.height / 2) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }
  }

  /* ---------------- sticker album ---------------- */
  function renderAlbum() {
    const collected = loadStickers();
    document.getElementById('album-count').textContent = `${collected.length} / ${STICKERS.length} あつめた`;
    const grid = document.getElementById('album-grid');
    grid.innerHTML = '';
    STICKERS.forEach(s => {
      const cell = document.createElement('div');
      const has = collected.includes(s);
      cell.className = 'album-cell' + (has ? '' : ' locked');
      cell.textContent = has ? s : '？';
      grid.appendChild(cell);
    });
  }

  /* ---------------- wiring ---------------- */
  document.getElementById('btn-goto-select').addEventListener('click', () => {
    ensureAudio(); sfxTap(); syncOpForGrade(); renderSelect(); showScreen('screen-select');
  });
  document.getElementById('btn-goto-album').addEventListener('click', () => {
    ensureAudio(); sfxTap(); renderAlbum(); showScreen('screen-album');
  });
  document.getElementById('btn-back-title').addEventListener('click', () => { sfxTap(); renderBestSummary(); showScreen('screen-title'); });
  document.getElementById('btn-back-title-2').addEventListener('click', () => { sfxTap(); renderBestSummary(); showScreen('screen-title'); });
  document.getElementById('btn-start-play').addEventListener('click', () => { sfxTap(); startSession(); });

  document.getElementById('numpad').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.id === 'btn-ok') { submitAnswer(); return; }
    if (btn.id === 'btn-del') { pressBackspace(); return; }
    if (btn.dataset.d !== undefined) pressDigit(btn.dataset.d);
  });

  document.getElementById('btn-quit-play').addEventListener('click', () => {
    clearInterval(state.timerHandle);
    sfxTap();
    renderSelect();
    showScreen('screen-select');
  });

  document.getElementById('btn-retry').addEventListener('click', () => { sfxTap(); startSession(); });
  document.getElementById('btn-back-select').addEventListener('click', () => { sfxTap(); renderSelect(); showScreen('screen-select'); });

  function toggleMute() {
    state.muted = !state.muted;
    localStorage.setItem(MUTE_KEY, state.muted ? '1' : '0');
    updateMuteUI();
    if (!state.muted) { ensureAudio(); sfxTap(); }
  }
  document.getElementById('btn-mute').addEventListener('click', toggleMute);
  document.getElementById('btn-mute-play').addEventListener('click', toggleMute);

  window.addEventListener('keydown', (e) => {
    if (!document.getElementById('screen-play').classList.contains('active')) return;
    if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
    else if (e.key === 'Backspace') pressBackspace();
    else if (e.key === 'Enter') submitAnswer();
  });

  /* ---------------- init ---------------- */
  updateMuteUI();
  renderBestSummary();
})();
</script>
</body>
</html>
