<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>けいさんドリル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height:100%;
    font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
    background:#f2f0ea;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  body {
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:12px;
  }

  .app {
    position:relative; z-index:1;
    width:100%;
    max-width:400px;
    height:min(660px, 94svh);
    background:#fffdf8;
    border-radius:20px;
    border:1.5px solid #2d3561;
    box-shadow: 0 16px 36px rgba(45,53,97,.16);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .screen {
    display:none;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:14px 16px 16px;
    position:relative;
  }
  .screen.active { display:flex; }

  /* ---------- common bits ---------- */
  .top-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:4px;
  }
  .icon-btn {
    width:36px; height:36px; border-radius:50%; flex:0 0 auto;
    border:1.5px solid #2d3561; background:#fff; color:#2d3561;
    font-size:16px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 #2d3561;
    cursor:pointer;
  }
  .icon-btn:active { transform:translateY(2px); box-shadow:0 0 0 #2d3561; }

  .stat-chip {
    background:#fff2da; border:1.5px solid #2d3561; border-radius:10px;
    padding:4px 10px; font-size:12px; font-weight:900; color:#2d3561;
    font-family:'Zen Kaku Gothic New';
  }
  .stat-chip.coin { background:#fff8de; }

  h1.title {
    text-align:center; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900;
    font-size:20px; color:#2d3561; letter-spacing:.01em;
    margin: 2px 0;
  }
  h1.title .accent { color:#ff6b5b; }

  .big-btn {
    display:block; width:100%; padding:12px; margin-top:auto;
    border:1.5px solid #2d3561; border-radius:14px; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900;
    font-size:16px; color:#fff; background:#ff6b5b;
    box-shadow:0 3px 0 #2d3561;
    cursor:pointer;
  }
  .big-btn:active { transform:translateY(3px); box-shadow:0 0 0 #2d3561; }
  .big-btn.secondary {
    background:#4fc2a1;
    box-shadow:0 3px 0 #2d3561; margin-top:8px;
  }
  .big-btn.secondary:active { box-shadow:0 0 0 #2d3561; }
  .big-btn.ghost {
    background:#fff; color:#7d7d94; box-shadow:0 2px 0 #d8d5e8; border:1.5px solid #d8d5e8; font-size:12px; padding:7px;
    font-weight:500;
  }

  /* ---------- title screen ---------- */
  #screen-title { overflow-y:auto; }
  .title-row-btns { display:flex; gap:8px; width:100%; margin-top:8px; }
  .title-row-btns .big-btn { margin-top:0; flex:1; width:auto; }
  .best-summary {
    margin-top:10px; background:#fff2da; border:2px solid #2d3561; border-radius:12px; padding:9px 12px;
    font-size:12px; color:#2d3561; width:100%; font-weight:700; text-align:center;
  }

  .pet-card {
    background:#fff; border:1px solid #ebe6d8; border-radius:16px;
    padding:12px 14px; margin-bottom:8px; text-align:center;
    box-shadow:0 3px 14px rgba(45,53,97,.07);
  }
  .pet-circle-wrap { position:relative; width:76px; height:76px; margin:0 auto; }
  .pet-circle {
    width:76px; height:76px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #fffdf6, #f3ecd8);
    border:1.5px solid #e2dcc6;
    box-shadow:0 4px 12px rgba(45,53,97,.1);
    display:flex; align-items:center; justify-content:center;
    animation: bob 2.4s ease-in-out infinite;
  }
  .face, .creature-face, .zface { display:inline-block; line-height:0; }
  .face svg, .creature-face svg, .zface svg { display:block; width:100%; height:100%; }
  .pet-circle .face { width:54px; height:54px; }
  .acc-badge { position:absolute; top:-6px; right:-6px; font-size:20px; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .pet-name { font-family:'Zen Kaku Gothic New'; font-weight:900; font-size:15px; color:#2d3561; margin-top:8px; }
  .pet-progress-label { font-size:11px; color:#a9770f; font-weight:700; margin-top:3px; }
  .pet-card .xp-bar-bg { margin-top:6px; }
  .graduate-confirm { margin-top:10px; font-size:12px; color:#2d3561; font-weight:700; display:none; }
  .graduate-confirm .confirm-row { display:flex; gap:8px; margin-top:6px; }
  .graduate-confirm .confirm-row .big-btn { flex:1; width:auto; padding:8px; font-size:12px; margin-top:0; }

  .starter-hint { text-align:center; font-size:14px; color:#2d3561; font-weight:900; margin:8px 0 12px; }
  .starter-grid { display:flex; gap:8px; }
  .starter-card {
    flex:1; background:#fff; border:1px solid #ebe6d8; border-radius:14px;
    padding:12px 4px; text-align:center; cursor:pointer;
    box-shadow:0 3px 10px rgba(45,53,97,.06);
  }
  .starter-card:active { transform:translateY(2px); box-shadow:0 1px 4px rgba(45,53,97,.06); }
  .starter-card .face { width:42px; height:42px; margin:0 auto; }
  .starter-card .name { font-size:12px; font-weight:700; color:#2d3561; margin-top:6px; }

  /* ---------- select screen ---------- */
  .section-label { font-size:13px; color:#9a9aae; font-weight:700; margin:8px 0 5px; letter-spacing:.04em; }
  .grade-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:3px; }
  .chip {
    flex:0 0 auto; padding:10px 18px; border-radius:11px; border:1.5px solid #2d3561;
    background:#fff; font-family:'Zen Kaku Gothic New'; font-weight:700; font-size:16px; color:#2d3561;
    cursor:pointer; white-space:nowrap;
  }
  .chip.active { background:#2d3561; color:#fff; }

  .mode-row { display:flex; gap:8px; }
  .mode-btn {
    flex:1; padding:9px 4px; border-radius:11px; border:1.5px solid #2d3561;
    background:#fff; color:#2d3561; font-family:'Zen Kaku Gothic New'; font-size:15px; font-weight:700;
    cursor:pointer; text-align:center; line-height:1.35;
  }
  .mode-btn small { display:block; font-size:11.5px; font-weight:500; color:#9494ab; margin-top:2px; }
  .mode-btn.active { background:#2d3561; color:#fff; }
  .mode-btn.active small { color:#c7cbe8; }

  .op-list { display:flex; flex-direction:column; gap:6px; margin-top:1px; }
  .op-row {
    position:relative; display:flex; align-items:center; gap:12px;
    border-radius:14px; border:1px solid #ebe6d8; background:#fff;
    padding:7px 14px; cursor:pointer;
    box-shadow:0 2px 8px rgba(45,53,97,.05);
  }
  .op-row .op-icon {
    width:36px; height:36px; border-radius:50%; flex:0 0 auto;
    background:#fff2da; display:flex; align-items:center; justify-content:center;
    font-size:18px; color:#ff6b5b; font-family:'Zen Kaku Gothic New'; font-weight:900;
  }
  .op-row .op-info { flex:1; min-width:0; text-align:left; }
  .op-row .op-name { font-size:15px; color:#2d3561; font-weight:700; }
  .op-row .stars { font-size:12px; color:#f5b942; margin-top:2px; letter-spacing:1px; }
  .op-row.active { border-color:#2d3561; background:#f4f2ff; }
  .op-row.locked { opacity:.4; pointer-events:none; }
  .op-row.locked::after {
    content:'🔒'; position:absolute; top:10px; right:12px; font-size:12px;
  }

  /* ---------- play screen ---------- */
  .stones-wrap { flex:1; overflow-x:auto; }
  .stones-row { display:flex; gap:3px; padding:2px; width:max-content; margin:0 auto; }
  .stone {
    width:19px; height:19px; border-radius:50%; background:#fff; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#b8b8c8;
    border:1.5px solid #e5e1d3; transition: all .15s;
  }
  .stone.current { border-color:#ff6b5b; color:#ff6b5b; box-shadow:0 0 0 3px #ffe0da; }
  .stone.ok { background:#4fc2a1; border-color:#2d3561; color:#fff; }
  .stone.ng { background:#ff6b5b; border-color:#2d3561; color:#fff; }
  .meta-row { display:flex; justify-content:center; font-size:10px; color:#8a8aa0; margin-top:2px; font-weight:700; }

  .battle-strip {
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin-top:6px; padding:4px 0;
  }
  .battle-pet, .battle-boss {
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid #e2dcc6; box-shadow:0 3px 8px rgba(45,53,97,.08);
    transition: transform .12s;
  }
  .battle-pet { background:#fff9ec; }
  .battle-boss { background:#fff1ee; border-color:#f0c8c2; }
  .battle-pet .face, .battle-boss .face { width:26px; height:26px; }
  .battle-vs { font-family:'Zen Kaku Gothic New'; font-weight:900; font-size:11px; color:#a9770f; }
  .battle-pet.hit, .battle-boss.hit { animation: battleShake .35s ease; }
  @keyframes battleShake {
    0%,100% { transform:translateX(0) rotate(0); }
    25% { transform:translateX(-5px) rotate(-8deg); }
    75% { transform:translateX(5px) rotate(8deg); }
  }
  .combo-chip {
    flex:0 0 auto; font-size:11px; color:#fff; font-weight:900; background:#ff6b5b;
    border:1.5px solid #2d3561; border-radius:9px; padding:2px 7px;
    opacity:0; transform:scale(.6); transition:opacity .15s, transform .15s;
  }
  .combo-chip.show { opacity:1; transform:scale(1); }

  .question-box {
    flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }

  .speech {
    background:#fff; border:1.5px solid #e2dcc6; border-radius:11px; padding:4px 12px;
    font-size:11px; color:#2d3561; margin-bottom:6px; min-height:15px; font-weight:700;
    box-shadow:0 2px 6px rgba(45,53,97,.05);
  }
  .equation-plate {
    width:100%;
    background:#fff; border-radius:16px; padding:14px 12px;
    border:1px solid #ebe6d8; box-shadow:0 4px 16px rgba(45,53,97,.08);
    overflow-x:auto;
  }
  .question-text {
    font-family:'Space Grotesk','Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:clamp(26px,9.5vw,42px); color:#2d3561;
    letter-spacing:0; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .answer-slot {
    display:inline-block; color:#ff6b5b; border-bottom:4px solid #ff6b5b;
    background:#fff3f1; border-radius:8px 8px 2px 2px;
    padding:0 10px; min-width:.9em; margin:0 2px;
  }
  .answer-slot.empty { animation: slotPulse 1.1s ease-in-out infinite; }
  @keyframes slotPulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .answer-slot.correct { color:#2f9b7a; border-color:#2f9b7a; background:#eafbf3; }
  .answer-slot.wrong { color:#c0392b; border-color:#c0392b; background:#fdeceb; }

  .numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; flex:0 0 auto; }
  .num-btn {
    padding:11px 0; font-size:26px; font-weight:700; border-radius:13px; border:1.5px solid #e5e1d3;
    background:#fff; color:#2d3561; font-family:'Space Grotesk','Zen Kaku Gothic New',sans-serif;
    box-shadow:0 2px 0 #e5e1d3;
    cursor:pointer;
  }
  .num-btn:active { transform:translateY(2px); box-shadow:0 0 0 #e5e1d3; }
  .num-btn.ok { background:#2d3561; color:#fff; border-color:#2d3561; box-shadow:0 2px 0 #14172b; font-family:'Zen Kaku Gothic New'; font-weight:900; font-size:18px; }
  .num-btn.ok:active { box-shadow:0 0 0 #14172b; }
  .num-btn.del { background:#ffe4e0; color:#ff6b5b; border-color:#ffc9c2; box-shadow:0 2px 0 #ffc9c2; font-size:18px; }
  .num-btn.del:active { box-shadow:0 0 0 #ffc9c2; }

  /* ---------- evolution / hatch celebration overlay (app-level, reusable) ---------- */
  .evolve-overlay {
    position:absolute; inset:0; z-index:30;
    background:rgba(24,28,54,.85);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    padding:20px; text-align:center;
  }
  .evolve-overlay.show { opacity:1; }
  .evolve-big-circle {
    width:130px; height:130px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffdf5, #ffe6b0);
    border:2px solid #f5b942;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;
    animation: evolveBigPop .8s cubic-bezier(.34,1.56,.64,1);
  }
  .evolve-big-circle .face { width:100px; height:100px; }
  @keyframes evolveBigPop {
    0% { transform:scale(0) rotate(-25deg); }
    55% { transform:scale(1.28) rotate(8deg); }
    100% { transform:scale(1) rotate(0); }
  }
  .evolve-overlay-label {
    margin-top:16px; font-family:'Zen Kaku Gothic New'; font-weight:900; font-size:23px; color:#fff2da;
    text-shadow:0 2px 8px rgba(0,0,0,.3);
    animation: evolveLabelIn .5s ease .15s backwards;
  }
  @keyframes evolveLabelIn { 0%{opacity:0; transform:translateY(10px) scale(.7)} 100%{opacity:1; transform:translateY(0) scale(1)} }
  .evolve-overlay-sub {
    margin-top:4px; font-family:'Zen Kaku Gothic New'; font-weight:700; font-size:12px; color:#c7cbe8;
  }
  .confetti-particle {
    position:absolute; top:50%; left:50%; font-size:20px; pointer-events:none; z-index:31;
    animation: burst 1000ms ease-out forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  /* ---------- result screen ---------- */
  #screen-result { align-items:center; text-align:center; justify-content:flex-start; overflow-y:auto; }
  .stars-row { font-size:32px; margin:4px 0; letter-spacing:4px; }
  .star { color:#e5e1d3; transition:transform .3s, color .3s; display:inline-block; }
  .star.lit { color:#f5b942; animation:pop .4s ease; }
  @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

  .result-creature {
    width:90px; height:90px; border-radius:50%; margin:2px auto 2px;
    background:radial-gradient(circle at 32% 28%, #fffdf6, #f3ecd8);
    border:1.5px solid #e2dcc6; box-shadow:0 4px 14px rgba(45,53,97,.1);
    display:flex; align-items:center; justify-content:center;
  }
  .result-creature .creature-face { width:60px; height:60px; margin:0 auto; }

  .result-stats {
    width:100%; display:grid; grid-template-columns:1fr 1fr;
    background:#f6f5fb; border:1px solid #e5e1f2; border-radius:13px; padding:10px; margin-top:8px; gap:8px;
    font-size:10px; color:#5b5b72;
  }
  .result-stats b { display:block; font-size:18px; color:#2d3561; font-family:'Space Grotesk'; font-weight:700; }
  .result-msg { font-family:'Zen Kaku Gothic New'; font-size:14px; color:#2d3561; margin-top:8px; font-weight:900; }

  .result-events { width:100%; display:flex; flex-direction:column; gap:5px; margin-top:8px; }
  .result-event {
    background:#fff8e6; border:1px solid #f0dba0; border-radius:11px; padding:6px 10px;
    font-size:11px; color:#a9770f; font-weight:700; text-align:left;
  }

  .flash-overlay {
    position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:17px;
  }
  .flash-overlay.go { animation: flash .35s ease; }
  @keyframes flash { 0%{opacity:.4} 100%{opacity:0} }
  .flash-overlay.ok { background:#4fc2a1; }
  .flash-overlay.ng { background:#ff6b5b; }

  .xp-bar-bg { width:100%; height:7px; background:#f0ead4; border:1px solid #e2dcc6; border-radius:5px; overflow:hidden; }
  .xp-bar-fill { height:100%; width:0%; background:#f5b942; transition:width .3s ease; }

  /* ---------- zukan (creature encyclopedia) ---------- */
  .zukan-count { text-align:center; font-size:12px; color:#5b5b72; font-weight:700; margin-bottom:10px; }
  .zukan-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; overflow-y:auto; }
  .zukan-cell {
    border-radius:14px; background:#fff; border:1px solid #ebe6d8; padding:12px 8px; text-align:center;
    box-shadow:0 2px 8px rgba(45,53,97,.05);
  }
  .zukan-cell.unlocked { border-color:#e2c98a; background:#fff8e6; }
  .zukan-cell.unlocked.rarity-rare { border-color:#8fc9de; background:#eaf8ff; }
  .zukan-cell.unlocked.rarity-epic { border-color:#c9a3ea; background:#f7ecff; }
  .zukan-cell .zface { width:40px; height:40px; margin:0 auto; font-size:32px; }
  .zukan-cell .zname { font-size:11px; color:#5b5b72; font-weight:700; margin-top:5px; }
  .zukan-cell .zcount { font-size:10px; color:#a9770f; font-weight:700; margin-top:2px; }
  .zukan-cell.locked .zface { opacity:.25; }
  .zukan-cell.locked .zname { color:#b8b8c8; }

  /* ---------- shop ---------- */
  .shop-list { overflow-y:auto; }
  .shop-item {
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid #ebe6d8; border-radius:13px; padding:9px 12px; margin-bottom:8px;
    box-shadow:0 2px 8px rgba(45,53,97,.05);
  }
  .shop-item .icon { font-size:24px; flex:0 0 auto; width:32px; text-align:center; }
  .shop-item .info { flex:1; min-width:0; }
  .shop-item .name { font-size:13px; font-weight:700; color:#2d3561; }
  .shop-item .price { font-size:11px; color:#a9770f; font-weight:700; }
  .shop-btn {
    flex:0 0 auto; border:1.5px solid #2d3561; border-radius:10px; padding:7px 10px;
    font-family:'Zen Kaku Gothic New'; font-weight:900; font-size:11px; color:#fff; background:#4fc2a1;
    cursor:pointer;
  }
  .shop-btn:disabled { background:#e5e1d3; border-color:#d3cec0; color:#a9a396; cursor:default; }
  .shop-btn.equipped { background:#2d3561; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== TITLE ===== -->
  <section class="screen active" id="screen-title">
    <div class="top-row">
      <div class="stat-chip" id="streak-chip">🔥 0にち</div>
      <h1 class="title">けいさん<span class="accent">ドリル</span></h1>
      <div class="stat-chip coin" id="coin-chip">💰 0</div>
    </div>

    <div id="title-onboarding" style="display:none">
      <div class="starter-hint">さいしょの あいぼうを えらんでね！</div>
      <div class="starter-grid" id="starter-grid"></div>
    </div>

    <div id="title-dashboard">
      <div class="pet-card">
        <div class="pet-circle-wrap">
          <div class="pet-circle"><span class="face" id="pet-face">🥚</span></div>
          <span class="acc-badge" id="pet-acc"></span>
        </div>
        <div class="pet-name" id="pet-name">たまご</div>
        <div class="pet-progress-label" id="pet-progress-label">つぎまで あと 10もん</div>
        <div class="xp-bar-bg"><div class="xp-bar-fill" id="pet-xp-fill"></div></div>
        <button class="big-btn secondary" id="btn-graduate" style="display:none;margin-top:8px">🎓 そつぎょうさせる</button>
        <div class="graduate-confirm" id="graduate-confirm">
          <p>「<span id="graduate-name"></span>」を ずかんに のせて、あたらしい たまごを むかえる？</p>
          <div class="confirm-row">
            <button class="big-btn secondary" id="btn-graduate-yes">はい！</button>
            <button class="big-btn ghost" id="btn-graduate-no">まだ いっしょにいる</button>
          </div>
        </div>
      </div>

      <button class="big-btn" id="btn-goto-select">あそぶ</button>
      <div class="title-row-btns">
        <button class="big-btn secondary" id="btn-goto-album">📖 ずかん</button>
        <button class="big-btn secondary" id="btn-goto-shop">🛍️ ショップ</button>
      </div>
      <div class="best-summary" id="best-summary">まだ きろくが ありません</div>
      <button class="big-btn ghost" id="btn-mute" style="margin-top:8px">🔊 おと：オン</button>
    </div>
  </section>

  <!-- ===== SELECT ===== -->
  <section class="screen" id="screen-select">
    <div class="top-row">
      <button class="icon-btn" id="btn-back-title">←</button>
      <span style="font-family:'Zen Kaku Gothic New';font-weight:900;color:#2d3561;font-size:15px">もんだいを えらぶ</span>
      <span style="width:36px"></span>
    </div>

    <div class="section-label">がくねん</div>
    <div class="grade-row" id="grade-row"></div>

    <div class="section-label">もんだいの けいしき</div>

<script>
(function(){
  'use strict';

  /* ---------------- data / config ---------------- */
  const OP_META = {
    add: { sym:'＋', name:'たしざん' },
    sub: { sym:'－', name:'ひきざん' },
    mul: { sym:'×', name:'かけざん' },
    div: { sym:'÷', name:'わりざん' },
    mix: { sym:'★', name:'ミックス' },
  };

  const CONFIG = {
    1: { ops:['add','sub'], add:{aMax:9,bMax:9}, sub:{topMax:18} },
    2: { ops:['add','sub','mul'], add:{aMax:99,bMax:99}, sub:{topMax:99}, mul:{aMax:9,bMax:9} },
    3: { ops:['add','sub','mul','div'], add:{aMax:999,bMax:999}, sub:{topMax:999}, mul:{aMax:99,bMax:9}, div:{divisorMax:9,quotientMax:9} },
    4: { ops:['add','sub','mul','div'], add:{aMax:9999,bMax:9999}, sub:{topMax:9999}, mul:{aMax:99,bMax:99}, div:{divisorMax:12,quotientMax:99} },
    5: { ops:['add','sub','mul','div'], add:{aMax:99999,bMax:99999}, sub:{topMax:99999}, mul:{aMax:999,bMax:99}, div:{divisorMax:99,quotientMax:99} },
    6: { ops:['add','sub','mul','div'], add:{aMax:999999,bMax:999999}, sub:{topMax:999999}, mul:{aMax:9999,bMax:99}, div:{divisorMax:999,quotientMax:99} },
  };

  const QUESTIONS_PER_SESSION = 10;
  const RECORDS_KEY = 'meyonze_mathdrill_v2';
  const MUTE_KEY = 'meyonze_mathdrill_mute';
  const PET_KEY = 'mathdrill_pet_v3';
  const COINS_KEY = 'mathdrill_coins_v3';
  const STREAK_KEY = 'mathdrill_streak_v3';
  const ITEMS_KEY = 'mathdrill_items_v3';
  const ZUKAN_KEY = 'mathdrill_zukan_v3';

  const PRAISE = ['せいかい！','やったね！','すごい！','ピンポン！','ばっちり！'];
  const CONSOLE_WORDS = ['おしい！','どんまい！','つぎがんばろう！'];

  const LINES = {
    dino:    { name:'きょうりゅう', rarity:'common', stages:['🥚','🦎','🐊','🦕','🦖'] },
    eagle:   { name:'わし',         rarity:'common', stages:['🥚','🐣','🐥','🦆','🦅'] },
    wolf:    { name:'おおかみ',     rarity:'common', stages:['🥚','🐶','🐕','🦊','🐺'] },
    tiger:   { name:'とら',         rarity:'common', stages:['🥚','🐱','🐈','🐆','🐯'] },
    shark:   { name:'さめ',         rarity:'rare',   stages:['🥚','🐟','🐡','🐬','🦈'] },
    panda:   { name:'ぱんだ',       rarity:'rare',   stages:['🥚','🐹','🐰','🐨','🐼'] },
    owl:     { name:'ふくろう',     rarity:'rare',   stages:['🥚','🐤','🦜','🦢','🦉'] },
    dragon:  { name:'ドラゴン',     rarity:'epic',   stages:['🥚','🦎','🐍','🐲','🐉'] },
    unicorn: { name:'ユニコーン',   rarity:'epic',   stages:['🥚','🐴','🦓','🦄','🦄'] },
  };
  const LINE_KEYS = Object.keys(LINES);
  const RARITY_WEIGHT = { common: 15, rare: 8, epic: 3 };
  const STAGE_THRESHOLDS = [0, 10, 25, 50, 90]; // cumulative correct answers

  /* ---------------- creature / boss art (hand-built SVG, shared template) ---------------- */
  const CREATURE_ART = {
    dino:    { color:'#7fa15c', belly:'#f4eeda', ear:'spike',  pattern:'scales',  accent:'#5f8a48' },
    eagle:   { color:'#9c7a56', belly:'#f4eeda', ear:'wing',   pattern:'none',    accent:'#7a5c3e' },
    wolf:    { color:'#9aa2ab', belly:'#f7f5ef', ear:'pointy', pattern:'none',    accent:'#7c848d' },
    tiger:   { color:'#e0a05e', belly:'#f7f0dd', ear:'round',  pattern:'stripes', accent:'#b9793a' },
    shark:   { color:'#87a8b8', belly:'#eef5f7', ear:'fin',    pattern:'none',    accent:'#5f8494' },
    panda:   { color:'#f5f2e8', belly:'#ffffff', ear:'round',  pattern:'patches', accent:'#33302c' },
    owl:     { color:'#c9a06e', belly:'#f4ecd8', ear:'tuft',   pattern:'spots',   accent:'#9c7146' },
    dragon:  { color:'#6fae82', belly:'#eef0d2', ear:'horn',   pattern:'scales',  accent:'#4f8a63' },
    unicorn: { color:'#e6dcf2', belly:'#ffffff', ear:'horn2',  pattern:'none',    accent:'#c9a0e8' },
  };
  const BOSS_ART = {
    oni:      { color:'#c25c4c', ear:'horn',  pattern:'none',  name:'おに' },
    ghost:    { color:'#cdd3e6', ear:'none',  pattern:'none',  name:'おばけ' },
    scorpion: { color:'#8a5ca0', ear:'spike', pattern:'none',  name:'さそり' },
    spider:   { color:'#3f3a4a', ear:'spike', pattern:'spots', name:'くも' },
    octopus:  { color:'#7a5ca8', ear:'none',  pattern:'spots', name:'たこ' },
    squid:    { color:'#6a7bb0', ear:'fin',   pattern:'none',  name:'いか' },
    boar:     { color:'#8a6a4a', ear:'round', pattern:'none',  name:'いのしし' },
  };
  const BOSSES = Object.keys(BOSS_ART);

  function svgWrap(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }

  function eggSVG(tint) {
    return svgWrap(`
      <ellipse cx="50" cy="58" rx="28" ry="34" fill="#fff5de" stroke="${tint}" stroke-width="3.5"/>
      <path d="M40 38 L46 49 L38 53 L47 66" stroke="${tint}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
      <ellipse cx="41" cy="45" rx="8" ry="5.5" fill="#ffffff" opacity="0.7"/>
    `);
  }

  function earPaths(type, accent, color) {
    switch (type) {
      case 'round': return `<circle cx="27" cy="27" r="12" fill="${color}"/><circle cx="73" cy="27" r="12" fill="${color}"/>`;
      case 'pointy': return `<path d="M19 33 L25 6 L38 29 Z" fill="${color}"/><path d="M81 33 L75 6 L62 29 Z" fill="${color}"/>`;
      case 'wing': return `<path d="M13 50 Q -2 38 9 17 Q 27 28 27 47 Z" fill="${color}"/><path d="M87 50 Q 102 38 91 17 Q 73 28 73 47 Z" fill="${color}"/>`;
      case 'fin': return `<path d="M50 2 L63 26 L37 26 Z" fill="${color}"/>`;
      case 'tuft': return `<path d="M35 21 L40 2 L47 23 Z" fill="${color}"/><path d="M65 21 L60 2 L53 23 Z" fill="${color}"/>`;
      case 'spike': return `<path d="M29 23 L36 0 L45 21 Z" fill="${accent}"/><path d="M71 23 L64 0 L55 21 Z" fill="${accent}"/>`;
      case 'horn': return `<path d="M34 21 Q24 2 15 6 Q22 19 34 26 Z" fill="${accent}"/><path d="M66 21 Q76 2 85 6 Q78 19 66 26 Z" fill="${accent}"/>`;
      case 'horn2': return `<path d="M50 1 Q45 19 50 30 Q55 19 50 1 Z" fill="${accent}"/>`;
      default: return '';
    }
  }

  function patternPaths(type, accent) {
    switch (type) {
      case 'stripes': return `<path d="M28 48 Q39 44 46 51" stroke="${accent}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M54 42 Q65 38 72 45" stroke="${accent}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M31 66 Q42 63 49 68" stroke="${accent}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      case 'spots': return `<circle cx="33" cy="45" r="3.2" fill="${accent}"/><circle cx="67" cy="47" r="3.2" fill="${accent}"/>
        <circle cx="45" cy="70" r="2.6" fill="${accent}"/><circle cx="59" cy="68" r="2.6" fill="${accent}"/>`;
      case 'scales': return `<path d="M37 33 Q41 29 45 33" stroke="${accent}" stroke-width="2.4" fill="none"/>
        <path d="M50 29 Q54 25 58 29" stroke="${accent}" stroke-width="2.4" fill="none"/>
        <path d="M63 33 Q67 29 71 33" stroke="${accent}" stroke-width="2.4" fill="none"/>`;
      case 'patches': return `<ellipse cx="39" cy="52" rx="8.5" ry="9.5" fill="${accent}"/><ellipse cx="61" cy="52" rx="8.5" ry="9.5" fill="${accent}"/>`;
      default: return '';
    }
  }

  function bodySVG({ color, belly, ear, pattern, accent, angry, young }) {
    const eyeR = young && !angry ? 5.6 : 5;
    const eyeY = 55;
    const brows = angry
      ? `<path d="M31 45 L44 50" stroke="#2d2530" stroke-width="3" stroke-linecap="round"/><path d="M69 45 L56 50" stroke="#2d2530" stroke-width="3" stroke-linecap="round"/>`
      : '';
    const mouth = angry
      ? `<path d="M40 69 L46 65 L52 69 L58 65 L64 69" stroke="#2d2530" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<path d="M44 66 Q50 71 56 66" stroke="#5c4632" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    const blush = angry ? '' : `<circle cx="31" cy="63" r="4.2" fill="#ff9d8a" opacity="0.45"/><circle cx="69" cy="63" r="4.2" fill="#ff9d8a" opacity="0.45"/>`;
    const patternBack = pattern === 'patches' ? patternPaths(pattern, accent) : '';
    const patternFront = pattern !== 'patches' ? patternPaths(pattern, accent) : '';
    return svgWrap(`
      ${earPaths(ear, accent, color)}
      <ellipse cx="50" cy="58" rx="34" ry="30" fill="${color}"/>
      ${patternBack}
      <ellipse cx="50" cy="70" rx="19" ry="14" fill="${belly}"/>
      ${patternFront}
      ${brows}
      <circle cx="39" cy="${eyeY}" r="${eyeR}" fill="#2d2530"/><circle cx="37.2" cy="${eyeY - 1.8}" r="1.7" fill="#fff"/>
      <circle cx="61" cy="${eyeY}" r="${eyeR}" fill="#2d2530"/><circle cx="59.2" cy="${eyeY - 1.8}" r="1.7" fill="#fff"/>
      ${blush}
      ${mouth}
    `);
  }

  function creatureSVG(key, stage) {
    const cfg = CREATURE_ART[key];
    if (stage <= 0) return eggSVG(cfg.color);
    return bodySVG({ ...cfg, young: stage < 3 });
  }
  function bossSVG(bossKey) {
    return bodySVG({ ...BOSS_ART[bossKey], angry: true, young: false });
  }

  const SHOP_ITEMS = [
    { id:'hat', icon:'🎩', name:'シルクハット', price:50 },
    { id:'ribbon', icon:'🎀', name:'リボン', price:40 },
    { id:'glasses', icon:'🕶️', name:'サングラス', price:60 },
    { id:'crown', icon:'👑', name:'かんむり', price:120 },
    { id:'scarf', icon:'🧣', name:'マフラー', price:45 },
    { id:'balloon', icon:'🎈', name:'ふうせん', price:30 },
  ];
  const ITEM_MAP = {};
  SHOP_ITEMS.forEach(it => { ITEM_MAP[it.id] = it; });

  /* ---------------- persistent data ---------------- */
  let pet = loadPet();
  let ownedItems = loadOwnedItems();
  let currentPetStage = pet ? stageForTotal(pet.totalCorrect) : 0;

  function loadPet() { try { return JSON.parse(localStorage.getItem(PET_KEY)); } catch (e) { return null; } }
  function savePet(p) { localStorage.setItem(PET_KEY, JSON.stringify(p)); }
  function loadCoins() { return Number(localStorage.getItem(COINS_KEY)) || 0; }
  function saveCoins(n) { localStorage.setItem(COINS_KEY, String(n)); }
  function addCoins(n) { saveCoins(Math.max(0, loadCoins() + n)); }
  function loadStreak() { try { return JSON.parse(localStorage.getItem(STREAK_KEY)) || { count: 0, lastDate: '' }; } catch (e) { return { count: 0, lastDate: '' }; } }
  function saveStreak(s) { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); }
  function loadOwnedItems() { try { return JSON.parse(localStorage.getItem(ITEMS_KEY)) || []; } catch (e) { return []; } }
  function saveOwnedItems(a) { localStorage.setItem(ITEMS_KEY, JSON.stringify(a)); }
  function loadZukan() { try { return JSON.parse(localStorage.getItem(ZUKAN_KEY)) || {}; } catch (e) { return {}; } }
  function saveZukanMap(z) { localStorage.setItem(ZUKAN_KEY, JSON.stringify(z)); }
  function loadRecords() { try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || {}; } catch (e) { return {}; } }
  function saveRecords(r) { localStorage.setItem(RECORDS_KEY, JSON.stringify(r)); }
  function recordKey(grade, op, mode) { return grade + '_' + op + '_' + mode; }

  /* ---------------- state ---------------- */
  const state = {
    grade: Number(localStorage.getItem('mathdrill_last_grade')) || 1,
    op: localStorage.getItem('mathdrill_last_op') || 'add',
    mode: localStorage.getItem('mathdrill_last_mode') || 'normal',
    queue: [], idx: 0, correct: 0, combo: 0, maxCombo: 0,
    startTime: 0, timerHandle: null, input: '', locked: false,
    muted: localStorage.getItem(MUTE_KEY) === '1',
    boss: '👹',
  };

  /* ---------------- helpers ---------------- */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function availableOps(grade) { return CONFIG[grade].ops; }

  function stageForTotal(total) {
    let s = 0;
    for (let i = 0; i < STAGE_THRESHOLDS.length; i++) { if (total >= STAGE_THRESHOLDS[i]) s = i; }
    return s;
  }

  function pickWeightedLine() {
    const pool = [];
    LINE_KEYS.forEach(k => { const w = RARITY_WEIGHT[LINES[k].rarity]; for (let i = 0; i < w; i++) pool.push(k); });
    return pool[randInt(0, pool.length - 1)];
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function yesterdayStr() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function genRaw(grade, op) {
    const c = CONFIG[grade];
    if (op === 'add') {
      const a = randInt(1, c.add.aMax), b = randInt(1, c.add.bMax);
      return { a, b, c: a + b, sym: '＋' };
    }
    if (op === 'sub') {
      const top = randInt(1, c.sub.topMax);
      const b = randInt(0, top);
      return { a: top, b, c: top - b, sym: '－' };
    }
    if (op === 'mul') {
      const a = randInt(1, c.mul.aMax), b = randInt(1, c.mul.bMax);
      return { a, b, c: a * b, sym: '×' };
    }
    if (op === 'div') {
      const divisor = randInt(2, c.div.divisorMax);
      const quotient = randInt(1, c.div.quotientMax);
      return { a: divisor * quotient, b: divisor, c: quotient, sym: '÷' };
    }
  }

  function genQuestion(grade, op, mode) {
    const actualOp = op === 'mix' ? availableOps(grade)[randInt(0, availableOps(grade).length - 1)] : op;
    const raw = genRaw(grade, actualOp);
    if (mode === 'missing') {
      const slot = ['a', 'b', 'c'][randInt(0, 2)];
      const parts = {
        a: slot === 'a' ? '□' : raw.a,
        b: slot === 'b' ? '□' : raw.b,
        c: slot === 'c' ? '□' : raw.c,
      };
      return { text: `${parts.a} ${raw.sym} ${parts.b} ＝ ${parts.c}`, answer: raw[slot] };
    }
    return { text: `${raw.a} ${raw.sym} ${raw.b} ＝ □`, answer: raw.c };
  }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  /* ---------------- sound ---------------- */
  let audioCtx = null;
  let masterFilter = null, masterGain = null, delayNode = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterFilter = audioCtx.createBiquadFilter();
        masterFilter.type = 'lowpass';
        masterFilter.frequency.value = 3800;
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.9;
        masterFilter.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        delayNode = audioCtx.createDelay();
        delayNode.delayTime.value = 0.14;
        const delayFeedback = audioCtx.createGain();
        delayFeedback.gain.value = 0.24;
        const delayWet = audioCtx.createGain();
        delayWet.gain.value = 0.18;
        delayNode.connect(delayFeedback);
        delayFeedback.connect(delayNode);
        delayNode.connect(delayWet);
        delayWet.connect(masterFilter);
      } catch (e) { /* no audio available */ }
    }
    return audioCtx;
  }

  function tone({ freq, dur = 0.15, type = 'sine', gain = 0.14, attack = 0.008, slideTo = null, delaySend = 0 }) {
    if (state.muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + dur);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(g);
    g.connect(masterFilter);
    if (delaySend > 0 && delayNode) {
      const send = ctx.createGain();
      send.gain.value = delaySend;
      g.connect(send);
      send.connect(delayNode);
    }
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.05);
  }

  function noiseBurst({ dur = 0.09, gain = 0.16, filterFreq = 1400 }) {
    if (state.muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = filterFreq;
    const g = ctx.createGain();
    g.gain.value = gain;
    src.connect(filt); filt.connect(g); g.connect(masterFilter);
    src.start();
  }

  function sfxTap() { tone({ freq: 640, dur: 0.05, type: 'square', gain: 0.07, attack: 0.002 }); }
  function sfxCorrect() {
    tone({ freq: 660, dur: 0.13, type: 'triangle', gain: 0.13, attack: 0.004 });
    tone({ freq: 990, dur: 0.16, type: 'sine', gain: 0.06, attack: 0.004 });
    setTimeout(() => {
      tone({ freq: 880, dur: 0.16, type: 'triangle', gain: 0.13, attack: 0.004 });
      tone({ freq: 1320, dur: 0.18, type: 'sine', gain: 0.07, attack: 0.004 });
    }, 85);
  }
  function sfxWrong() {
    tone({ freq: 300, dur: 0.28, type: 'sine', gain: 0.13, attack: 0.01, slideTo: 165 });
    tone({ freq: 190, dur: 0.28, type: 'triangle', gain: 0.06, attack: 0.01, slideTo: 110 });
  }
  function sfxHit() {
    noiseBurst({ dur: 0.07, gain: 0.14, filterFreq: 1600 });
    tone({ freq: 170, dur: 0.07, type: 'square', gain: 0.05, attack: 0.001 });
  }
  function sfxCoin() {
    tone({ freq: 1046, dur: 0.09, type: 'square', gain: 0.09, attack: 0.002, slideTo: 1568 });
    setTimeout(() => tone({ freq: 1568, dur: 0.15, type: 'triangle', gain: 0.11, attack: 0.002, delaySend: 0.2 }), 55);
  }
  function sfxClear() {
    [523, 659, 784].forEach(f => tone({ freq: f, dur: 0.5, type: 'triangle', gain: 0.09, attack: 0.01, delaySend: 0.25 }));
    setTimeout(() => [659, 830, 988].forEach(f => tone({ freq: f, dur: 0.6, type: 'triangle', gain: 0.1, attack: 0.01, delaySend: 0.3 })), 160);
  }
  function sfxEvolve() {
    [392, 523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone({ freq: f, dur: 0.22, type: 'sine', gain: 0.12, attack: 0.005, delaySend: 0.2 }), i * 70));
    setTimeout(() => [523, 659, 784, 1046].forEach(f => tone({ freq: f, dur: 0.6, type: 'triangle', gain: 0.09, attack: 0.01, delaySend: 0.35 })), 420);

  function submitAnswer() {
    if (state.locked || state.input === '') return;
    state.locked = true;
    const q = state.queue[state.idx];
    const userVal = Number(state.input);
    const isCorrect = userVal === q.answer;
    const slot = document.getElementById('answer-slot');
    const speech = document.getElementById('play-speech');
    const stone = document.getElementById('stone-' + state.idx);
    let evolved = false;

    if (isCorrect) {
      state.correct++; state.combo++; state.maxCombo = Math.max(state.maxCombo, state.combo);
      slot.classList.remove('empty'); slot.classList.add('correct');
      speech.textContent = PRAISE[randInt(0, PRAISE.length - 1)];
      if (stone) { stone.classList.remove('current'); stone.classList.add('ok'); stone.textContent = '◯'; }
      flashOverlay('ok'); sfxCorrect(); sfxHit();
      hitEffect('battle-boss', '💥');

      pet.totalCorrect++;
      savePet(pet);
      const newStage = stageForTotal(pet.totalCorrect);
      if (newStage !== currentPetStage) {
        currentPetStage = newStage;
        document.getElementById('battle-pet-face').innerHTML = creatureSVG(pet.line, currentPetStage);
        evolved = true;
      }
    } else {
      state.combo = 0;
      slot.classList.remove('empty'); slot.classList.add('wrong');
      slot.textContent = q.answer;
      fitQuestionText();
      speech.textContent = CONSOLE_WORDS[randInt(0, CONSOLE_WORDS.length - 1)];
      if (stone) { stone.classList.remove('current'); stone.classList.add('ng'); stone.textContent = '✗'; }
      flashOverlay('ng'); sfxWrong();
      hitEffect('battle-pet', '💦');
    }
    showCombo();

    const advance = () => {
      state.idx++;
      if (state.idx >= QUESTIONS_PER_SESSION) {
        finishSession();
      } else {
        renderQuestion();
      }
    };

    if (evolved) {
      setTimeout(() => playEvolveCelebration(advance), 500);
    } else {
      setTimeout(advance, isCorrect ? 650 : 1300);
    }
  }

  function updateStreakIfNewDay() {
    const streak = loadStreak();
    const today = todayStr();
    if (streak.lastDate === today) return { count: streak.count, isNewDay: false, bonus: 0 };
    const newCount = (streak.lastDate === yesterdayStr()) ? streak.count + 1 : 1;
    const bonus = 5 + Math.min(newCount, 10) * 3;
    saveStreak({ count: newCount, lastDate: today });
    return { count: newCount, isNewDay: true, bonus };
  }

  function rollGift() {
    if (Math.random() < 0.7) return { type: 'coins', amount: 10 + randInt(0, 20) };
    const unowned = SHOP_ITEMS.filter(it => !ownedItems.includes(it.id));
    if (unowned.length === 0) return { type: 'coins', amount: 20 };
    const item = unowned[randInt(0, unowned.length - 1)];
    ownedItems.push(item.id);
    saveOwnedItems(ownedItems);
    return { type: 'item', itemId: item.id };
  }

  function finishSession() {
    clearInterval(state.timerHandle);
    const totalTime = (Date.now() - state.startTime) / 1000;
    const avgTime = totalTime / QUESTIONS_PER_SESSION;

    let stars = 0;
    if (state.correct === QUESTIONS_PER_SESSION && avgTime <= 6) stars = 3;
    else if (state.correct >= 8) stars = 2;
    else if (state.correct >= 5) stars = 1;

    const records = loadRecords();
    const key = recordKey(state.grade, state.op, state.mode);
    const prev = records[key] || { stars: 0, bestTime: null };
    records[key] = {
      stars: Math.max(prev.stars, stars),
      bestTime: (state.correct === QUESTIONS_PER_SESSION) ? Math.min(prev.bestTime || Infinity, totalTime) : prev.bestTime,
    };
    saveRecords(records);

    const bossDefeated = state.correct >= 8;
    const starBonus = [0, 10, 20, 35][stars];
    const streakResult = updateStreakIfNewDay();
    let coinsEarned = state.correct * 2 + starBonus + (bossDefeated ? 15 : 0) + (streakResult.isNewDay ? streakResult.bonus : 0);

    const giftEligible = stars === 3 || (streakResult.isNewDay && [3,7,14,30].includes(streakResult.count));
    const gift = giftEligible ? rollGift() : null;
    if (gift && gift.type === 'coins') coinsEarned += gift.amount;

    addCoins(coinsEarned);
    if (coinsEarned > 0) sfxCoin();

    renderResult(stars, totalTime, coinsEarned, bossDefeated, streakResult, gift);
  }

      if (!owned) {
        const afford = loadCoins() >= item.price;
        btnHtml = `<button class="shop-btn" data-id="${item.id}" data-action="buy" ${afford ? '' : 'disabled'}>${item.price}💰</button>`;
      } else {
        btnHtml = `<button class="shop-btn ${equipped ? 'equipped' : ''}" data-id="${item.id}" data-action="equip">${equipped ? 'そうびちゅう' : 'そうびする'}</button>`;
      }
      row.innerHTML = `<div class="icon">${item.icon}</div><div class="info"><div class="name">${item.name}</div>${owned ? '' : `<div class="price">${item.price} コイン</div>`}</div>${btnHtml}`;
      list.appendChild(row);
    });
  }

  document.getElementById('shop-list').addEventListener('click', (e) => {
    const btn = e.target.closest('button.shop-btn');
    if (!btn || btn.disabled) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === 'equip') {
      sfxTap();
      pet.accessory = (pet.accessory === id) ? null : id;
      savePet(pet);
    } else {
      const item = ITEM_MAP[id];
      if (loadCoins() < item.price) return;
      sfxTap();
      addCoins(-item.price);
      ownedItems.push(id);
      saveOwnedItems(ownedItems);
      if (!pet.accessory) { pet.accessory = id; savePet(pet); }
    }
    renderShop();
  });

  /* ---------------- wiring ---------------- */
  document.getElementById('btn-goto-select').addEventListener('click', () => {
    ensureAudio(); sfxTap(); syncOpForGrade(); renderSelect(); showScreen('screen-select');
  });
  document.getElementById('btn-goto-album').addEventListener('click', () => {
    ensureAudio(); sfxTap(); renderAlbum(); showScreen('screen-album');
  });
  document.getElementById('btn-goto-shop').addEventListener('click', () => {
    ensureAudio(); sfxTap(); renderShop(); showScreen('screen-shop');
  });
  document.getElementById('btn-back-title').addEventListener('click', () => { sfxTap(); renderTitleDashboard(); showScreen('screen-title'); });
  document.getElementById('btn-back-title-2').addEventListener('click', () => { sfxTap(); renderTitleDashboard(); showScreen('screen-title'); });
  document.getElementById('btn-back-title-3').addEventListener('click', () => { sfxTap(); renderTitleDashboard(); showScreen('screen-title'); });
  document.getElementById('btn-start-play').addEventListener('click', () => { sfxTap(); startSession(); });

  document.getElementById('numpad').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.id === 'btn-ok') { submitAnswer(); return; }
    if (btn.id === 'btn-del') { pressBackspace(); return; }
    if (btn.dataset.d !== undefined) pressDigit(btn.dataset.d);
  });

  document.getElementById('btn-quit-play').addEventListener('click', () => {
    clearInterval(state.timerHandle);
    sfxTap();
    renderSelect();
    showScreen('screen-select');
  });

  document.getElementById('btn-retry').addEventListener('click', () => { sfxTap(); renderTitleDashboard(); startSession(); });
  document.getElementById('btn-back-select').addEventListener('click', () => { sfxTap(); renderSelect(); showScreen('screen-select'); });

  function toggleMute() {
    state.muted = !state.muted;
    localStorage.setItem(MUTE_KEY, state.muted ? '1' : '0');
    updateMuteUI();
    if (!state.muted) { ensureAudio(); sfxTap(); }
  }
  document.getElementById('btn-mute').addEventListener('click', toggleMute);
  document.getElementById('btn-mute-play').addEventListener('click', toggleMute);

  window.addEventListener('keydown', (e) => {
    if (!document.getElementById('screen-play').classList.contains('active')) return;
    if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
    else if (e.key === 'Backspace') pressBackspace();
    else if (e.key === 'Enter') submitAnswer();
  });

  /* ---------------- init ---------------- */
  updateMuteUI();
  renderTitleDashboard();
})();
</script>
</body>
</html>
