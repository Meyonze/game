<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>けいさんドリル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height:100%;
    font-family:'Zen Maru Gothic','Hiragino Sans',sans-serif;
    background:#f7f2e6;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  body {
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:16px;
  }

  .app {
    position:relative; z-index:1;
    width:100%;
    max-width:420px;
    min-height:min(780px, 94svh);
    background:#fffdf8;
    border-radius:22px;
    border:3px solid #2d3561;
    box-shadow: 0 8px 0 #2d356122, 0 14px 28px rgba(45,53,97,.18);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .screen {
    display:none;
    flex-direction:column;
    flex:1;
    padding:20px 18px 22px;
    position:relative;
  }
  .screen.active { display:flex; }

  /* ---------- common bits ---------- */
  .top-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  .icon-btn {
    width:40px; height:40px; border-radius:50%; flex:0 0 auto;
    border:2px solid #2d3561; background:#fff; color:#2d3561;
    font-size:17px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 #2d3561;
    cursor:pointer;
  }
  .icon-btn:active { transform:translateY(3px); box-shadow:0 0 0 #2d3561; }

  h1.title {
    text-align:center; font-family:'Zen Maru Gothic',sans-serif; font-weight:900;
    font-size:30px; color:#2d3561; letter-spacing:.02em;
    margin: 6px 0 2px;
  }
  h1.title .accent { color:#ff6b5b; }
  .subtitle { text-align:center; color:#8a8aa0; font-size:13px; margin-bottom:14px; font-weight:500; }

  .egg-badge {
    position:relative; width:110px; height:110px; margin:2px auto 10px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:#fff2da;
    border:3px solid #2d3561;
    box-shadow: 0 5px 0 #2d3561;
    animation: bob 2.4s ease-in-out infinite;
  }
  .egg-badge .face { font-size:56px; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  .big-btn {
    display:block; width:100%; padding:15px; margin-top:auto;
    border:3px solid #2d3561; border-radius:18px; font-family:'Zen Maru Gothic',sans-serif; font-weight:900;
    font-size:18px; color:#fff; background:#ff6b5b;
    box-shadow:0 5px 0 #2d3561;
    cursor:pointer;
  }
  .big-btn:active { transform:translateY(5px); box-shadow:0 0 0 #2d3561; }
  .big-btn.secondary {
    background:#4fc2a1;
    box-shadow:0 5px 0 #2d3561; margin-top:10px;
  }
  .big-btn.secondary:active { box-shadow:0 0 0 #2d3561; }
  .big-btn.ghost {
    background:#fff; color:#7d7d94; box-shadow:0 3px 0 #d8d5e8; border:2px solid #d8d5e8; font-size:13px; padding:9px;
    font-weight:500;
  }

  /* ---------- title screen ---------- */
  #screen-title { justify-content:center; align-items:center; text-align:center; }
  .best-summary {
    margin-top:14px; background:#fff2da; border:2px solid #2d3561; border-radius:14px; padding:11px 14px;
    font-size:13px; color:#2d3561; width:100%; font-weight:700;
  }
  .title-row-btns { display:flex; gap:8px; width:100%; margin-top:10px; }
  .title-row-btns .big-btn { margin-top:0; }

  /* ---------- select screen ---------- */
  .section-label { font-size:12px; color:#8a8aa0; font-weight:700; margin:12px 0 6px; letter-spacing:.05em; }
  .grade-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; }
  .chip {
    flex:0 0 auto; padding:9px 15px; border-radius:12px; border:2px solid #2d3561;
    background:#fff; font-family:'Zen Maru Gothic'; font-weight:700; font-size:14px; color:#2d3561;
    cursor:pointer; white-space:nowrap;
  }
  .chip.active { background:#2d3561; color:#fff; }

  .mode-row { display:flex; gap:8px; }
  .mode-btn {
    flex:1; padding:9px 4px; border-radius:12px; border:2px solid #2d3561;
    background:#fff; color:#2d3561; font-family:'Zen Maru Gothic'; font-size:13px; font-weight:700;
    cursor:pointer; text-align:center; line-height:1.35;
  }
  .mode-btn small { display:block; font-size:10px; font-weight:500; color:#9494ab; margin-top:2px; }
  .mode-btn.active { background:#2d3561; color:#fff; }
  .mode-btn.active small { color:#c7cbe8; }

  .op-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:2px; }
  .op-card {
    position:relative; border-radius:14px; border:2px solid #e5e1d3; background:#fff;
    padding:11px 8px 8px; text-align:center; cursor:pointer;
  }
  .op-card .op-sym { font-size:23px; color:#ff6b5b; font-family:'Zen Maru Gothic'; font-weight:900; }
  .op-card .op-name { font-size:12px; color:#5b5b72; margin-top:2px; font-weight:700; }
  .op-card .stars { font-size:11px; color:#f5b942; margin-top:3px; letter-spacing:1px; min-height:13px; }
  .op-card.active { border-color:#2d3561; background:#f4f2ff; }
  .op-card.locked { opacity:.4; pointer-events:none; }
  .op-card.locked::after {
    content:'🔒'; position:absolute; top:6px; right:8px; font-size:11px;
  }

  /* ---------- play screen ---------- */
  .play-header { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .stones-wrap { flex:1; overflow-x:auto; }
  .stones-row { display:flex; gap:4px; padding:2px; width:max-content; margin:0 auto; }
  .stone {
    width:21px; height:21px; border-radius:50%; background:#fff; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#b8b8c8;
    border:2px solid #e5e1d3; transition: all .15s;
  }
  .stone.current { border-color:#ff6b5b; color:#ff6b5b; box-shadow:0 0 0 3px #ffe0da; }
  .stone.ok { background:#4fc2a1; border-color:#2d3561; color:#fff; }
  .stone.ng { background:#ff6b5b; border-color:#2d3561; color:#fff; }
  .meta-row { display:flex; justify-content:center; font-size:12px; color:#8a8aa0; margin-top:4px; font-weight:700; }

  .combo-badge {
    align-self:center; margin-top:2px; font-size:13px; color:#ff6b5b; font-weight:900;
    opacity:0; transform:scale(.7); transition:opacity .15s, transform .15s;
  }
  .combo-badge.show { opacity:1; transform:scale(1); }

  .question-box {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }

  .creature-wrap {
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .creature-circle {
    width:78px; height:78px; border-radius:50%;
    background:#fff2da; border:3px solid #2d3561;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s;
  }
  .creature-circle .creature-face { font-size:42px; display:inline-block; }
  .creature-circle.evolve { animation: evolvePop .5s ease; }
  @keyframes evolvePop { 0%{transform:scale(.6) rotate(-10deg)} 55%{transform:scale(1.25) rotate(6deg)} 100%{transform:scale(1) rotate(0)} }
  .xp-bar-bg { width:120px; height:8px; background:#eee8d6; border:2px solid #2d3561; border-radius:6px; overflow:hidden; }
  .xp-bar-fill { height:100%; width:0%; background:#f5b942; transition:width .3s ease; }

  .speech {
    background:#fff; border:2px solid #2d3561; border-radius:12px; padding:5px 13px;
    font-size:12px; color:#2d3561; margin-top:2px; min-height:16px; font-weight:700;
  }
  .equation-plate {
    background:#fff; border-radius:18px; padding:16px 20px; margin:14px 0 10px;
    border:3px solid #2d3561; box-shadow:0 5px 0 #2d356122;
  }
  .question-text {
    font-family:'Zen Maru Gothic'; font-weight:900; font-size:clamp(28px,8.6vw,40px); color:#2d3561;
    letter-spacing:.01em; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .question-text .blank { color:#ff6b5b; }
  .answer-display {
    font-family:'Zen Maru Gothic'; font-weight:900; font-size:28px; color:#ff6b5b; min-height:42px;
    background:#fffaf0; border:3px solid #2d3561; border-radius:14px;
    min-width:132px; padding:4px 14px; font-variant-numeric:tabular-nums;
  }
  .answer-display.correct { color:#2f9b7a; border-color:#2f9b7a; background:#f0faf6; }
  .answer-display.wrong { color:#ff6b5b; border-color:#ff6b5b; background:#fff3f1; font-size:18px; }

  .numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .num-btn {
    padding:15px 0; font-size:20px; font-weight:700; border-radius:14px; border:2px solid #e5e1d3;
    background:#fff; color:#2d3561;
    box-shadow:0 3px 0 #e5e1d3;
    font-family:'Zen Maru Gothic'; cursor:pointer;
  }
  .num-btn:active { transform:translateY(3px); box-shadow:0 0 0 #e5e1d3; }
  .num-btn.ok { background:#2d3561; color:#fff; border-color:#2d3561; box-shadow:0 3px 0 #14172b; }
  .num-btn.ok:active { box-shadow:0 0 0 #14172b; }
  .num-btn.del { background:#ffe4e0; color:#ff6b5b; border-color:#ffc9c2; box-shadow:0 3px 0 #ffc9c2; }
  .num-btn.del:active { box-shadow:0 0 0 #ffc9c2; }

  /* ---------- result screen ---------- */
  #screen-result { align-items:center; text-align:center; justify-content:flex-start; }
  .stars-row { font-size:38px; margin:8px 0; letter-spacing:5px; }
  .star { color:#e5e1d3; transition:transform .3s, color .3s; display:inline-block; }
  .star.lit { color:#f5b942; animation:pop .4s ease; }
  @keyframes pop { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

  .result-creature {
    width:120px; height:120px; border-radius:50%; margin:6px auto 4px;
    background:#fff2da; border:3px solid #2d3561; box-shadow:0 5px 0 #2d3561;
    display:flex; align-items:center; justify-content:center;
  }
  .result-creature .creature-face { font-size:64px; }

  .result-stats {
    width:100%; background:#f4f2ff; border:2px solid #2d3561; border-radius:14px; padding:12px; margin-top:10px;
    display:flex; justify-content:space-around; font-size:11px; color:#5b5b72;
  }
  .result-stats b { display:block; font-size:18px; color:#2d3561; font-family:'Zen Maru Gothic'; font-weight:900; }
  .result-msg { font-size:15px; color:#2d3561; margin-top:10px; font-weight:900; }

  .evolve-banner {
    width:100%; background:#fff2da; border:2px solid #f5b942; border-radius:14px; padding:10px; margin-top:10px;
    display:none; font-size:12px; color:#a9770f; font-weight:700;
  }
  .evolve-banner.show { display:block; }

  .star-particle {
    position:fixed; top:50%; left:50%; font-size:18px; pointer-events:none; z-index:50;
    animation: burst 900ms ease-out forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  .flash-overlay {
    position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:19px;
  }
  .flash-overlay.go { animation: flash .35s ease; }
  @keyframes flash { 0%{opacity:.4} 100%{opacity:0} }
  .flash-overlay.ok { background:#4fc2a1; }
  .flash-overlay.ng { background:#ff6b5b; }

  /* ---------- zukan (creature encyclopedia) ---------- */
  .zukan-count { text-align:center; font-size:13px; color:#5b5b72; font-weight:700; margin-bottom:12px; }
  .zukan-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .zukan-cell {
    border-radius:16px; background:#fff; border:2px solid #e5e1d3; padding:16px 8px; text-align:center;
  }
  .zukan-cell.unlocked { border-color:#2d3561; background:#fff2da; }
  .zukan-cell .zface { font-size:38px; }
  .zukan-cell .zname { font-size:12px; color:#5b5b72; font-weight:700; margin-top:6px; }
  .zukan-cell.locked .zface { opacity:.25; }
  .zukan-cell.locked .zname { color:#b8b8c8; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== TITLE ===== -->
  <section class="screen active" id="screen-title">
    <div class="egg-badge"><span class="face">🥚</span></div>
    <h1 class="title">けいさん<span class="accent">ドリル</span></h1>
    <p class="subtitle">こたえると たまごが そだつよ</p>
    <button class="big-btn" id="btn-goto-select" style="margin-top:14px">あそぶ</button>
    <div class="title-row-btns">
      <button class="big-btn secondary" id="btn-goto-album">📖 ずかん</button>
    </div>
    <div class="best-summary" id="best-summary">まだ きろくが ありません</div>
    <button class="big-btn ghost" id="btn-mute" style="margin-top:12px">🔊 おと：オン</button>
  </section>

  <!-- ===== SELECT ===== -->
  <section class="screen" id="screen-select">
    <div class="top-row">
      <button class="icon-btn" id="btn-back-title">←</button>
      <span style="font-family:'Zen Maru Gothic';font-weight:900;color:#2d3561;font-size:15px">もんだいを えらぶ</span>
      <span style="width:40px"></span>
    </div>

    <div class="section-label">がくねん</div>
    <div class="grade-row" id="grade-row"></div>

    <div class="section-label">もんだいの けいしき</div>
    <div class="mode-row" id="mode-row">
      <button class="mode-btn" data-mode="normal">ふつう<small>7 ＋ 5 ＝ ？</small></button>
      <button class="mode-btn" data-mode="missing">むしくい<small>7 ＋ □ ＝ 12</small></button>
    </div>

    <div class="section-label">けいさんの しゅるい</div>
    <div class="op-grid" id="op-grid"></div>

    <button class="big-btn" id="btn-start-play" style="margin-top:16px">スタート</button>
  </section>

  <!-- ===== PLAY ===== -->
  <section class="screen" id="screen-play">
    <div class="flash-overlay" id="flash-overlay"></div>
    <div class="play-header">
      <button class="icon-btn" id="btn-quit-play">←</button>
      <div class="stones-wrap"><div class="stones-row" id="stones-row"></div></div>
      <button class="icon-btn" id="btn-mute-play">🔊</button>
    </div>
    <div class="meta-row"><span id="timer-label">0:00</span></div>

    <div class="question-box">
      <div class="creature-wrap">
        <div class="creature-circle" id="creature-circle"><span class="creature-face" id="creature-face">🥚</span></div>
        <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-bar-fill"></div></div>
        <div class="combo-badge" id="combo-badge">🔥 3れんぞく！</div>
        <div class="speech" id="play-speech">がんばって！</div>
      </div>
      <div class="equation-plate"><div class="question-text" id="question-text">3 ＋ 4 ＝</div></div>
      <div class="answer-display" id="answer-display">？</div>
    </div>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-d="1">1</button>
      <button class="num-btn" data-d="2">2</button>
      <button class="num-btn" data-d="3">3</button>
      <button class="num-btn" data-d="4">4</button>
      <button class="num-btn" data-d="5">5</button>
      <button class="num-btn" data-d="6">6</button>
      <button class="num-btn" data-d="7">7</button>
      <button class="num-btn" data-d="8">8</button>
      <button class="num-btn" data-d="9">9</button>
      <button class="num-btn del" id="btn-del">⌫</button>
      <button class="num-btn" data-d="0">0</button>
      <button class="num-btn ok" id="btn-ok">OK</button>
    </div>
  </section>

  <!-- ===== RESULT ===== -->
  <section class="screen" id="screen-result">
    <div class="result-creature"><span class="creature-face" id="result-creature-face">🥚</span></div>
    <div class="stars-row">
      <span class="star" id="star-1">★</span><span class="star" id="star-2">★</span><span class="star" id="star-3">★</span>
    </div>
    <div class="result-msg" id="result-msg">よくできました！</div>
    <div class="result-stats">
      <div><b id="stat-correct">10</b>せいかい</div>
      <div><b id="stat-time">0:00</b>タイム</div>
      <div><b id="stat-combo">0</b>さいだいコンボ</div>
    </div>
    <div class="evolve-banner" id="evolve-banner"></div>
    <button class="big-btn" id="btn-retry" style="margin-top:16px">もういちど</button>
    <button class="big-btn secondary" id="btn-back-select">もんだいを えらびなおす</button>
  </section>

  <!-- ===== ZUKAN ===== -->
  <section class="screen" id="screen-album">
    <div class="top-row">
      <button class="icon-btn" id="btn-back-title-2">←</button>
      <span style="font-family:'Zen Maru Gothic';font-weight:900;color:#2d3561;font-size:15px">ずかん</span>
      <span style="width:40px"></span>
    </div>
    <div class="zukan-count" id="album-count">0 / 4 はっけん</div>
    <div class="zukan-grid" id="album-grid"></div>
  </section>

</div>

<script>
(function(){
  'use strict';

  /* ---------------- data / config ---------------- */
  const OP_META = {
    add: { sym:'＋', name:'たしざん' },
    sub: { sym:'－', name:'ひきざん' },
    mul: { sym:'×', name:'かけざん' },
    div: { sym:'÷', name:'わりざん' },
    mix: { sym:'★', name:'ミックス' },
  };

  const CONFIG = {
    1: { ops:['add','sub'], add:{aMax:9,bMax:9}, sub:{topMax:18} },
    2: { ops:['add','sub','mul'], add:{aMax:99,bMax:99}, sub:{topMax:99}, mul:{aMax:9,bMax:9} },
    3: { ops:['add','sub','mul','div'], add:{aMax:999,bMax:999}, sub:{topMax:999}, mul:{aMax:99,bMax:9}, div:{divisorMax:9,quotientMax:9} },
    4: { ops:['add','sub','mul','div'], add:{aMax:9999,bMax:9999}, sub:{topMax:9999}, mul:{aMax:99,bMax:99}, div:{divisorMax:12,quotientMax:99} },
    5: { ops:['add','sub','mul','div'], add:{aMax:99999,bMax:99999}, sub:{topMax:99999}, mul:{aMax:999,bMax:99}, div:{divisorMax:99,quotientMax:99} },
    6: { ops:['add','sub','mul','div'], add:{aMax:999999,bMax:999999}, sub:{topMax:999999}, mul:{aMax:9999,bMax:99}, div:{divisorMax:999,quotientMax:99} },
  };

  const QUESTIONS_PER_SESSION = 10;
  const STORAGE_KEY = 'meyonze_mathdrill_v2';
  const MUTE_KEY = 'meyonze_mathdrill_mute';
  const ZUKAN_KEY = 'meyonze_mathdrill_zukan';

  const PRAISE = ['せいかい！','やったね！','すごい！','ピンポン！','ばっちり！'];
  const CONSOLE_WORDS = ['おしい！','どんまい！','つぎがんばろう！'];

  const LINES = {
    dino:   { name:'きょうりゅう', stages:['🥚','🦎','🐊','🦕','🦖'] },
    bird:   { name:'とり',         stages:['🥚','🐣','🐥','🦆','🦅'] },
    animal: { name:'どうぶつ',     stages:['🥚','🐭','🐱','🐺','🦁'] },
    dragon: { name:'ドラゴン',     stages:['🥚','🦎','🐍','🐲','🐉'] },
  };
  const LINE_KEYS = Object.keys(LINES);

  /* ---------------- state ---------------- */
  const state = {
    grade: Number(localStorage.getItem('mathdrill_last_grade')) || 1,
    op: localStorage.getItem('mathdrill_last_op') || 'add',
    mode: localStorage.getItem('mathdrill_last_mode') || 'normal',
    queue: [], idx: 0, correct: 0, combo: 0, maxCombo: 0,
    startTime: 0, timerHandle: null, input: '', locked: false,
    muted: localStorage.getItem(MUTE_KEY) === '1',
    line: null, stage: 0,
  };

  /* ---------------- helpers ---------------- */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function availableOps(grade) { return CONFIG[grade].ops; }

  function genRaw(grade, op) {
    const c = CONFIG[grade];
    if (op === 'add') {
      const a = randInt(1, c.add.aMax), b = randInt(1, c.add.bMax);
      return { a, b, c: a + b, sym: '＋' };
    }
    if (op === 'sub') {
      const top = randInt(1, c.sub.topMax);
      const b = randInt(0, top);
      return { a: top, b, c: top - b, sym: '－' };
    }
    if (op === 'mul') {
      const a = randInt(1, c.mul.aMax), b = randInt(1, c.mul.bMax);
      return { a, b, c: a * b, sym: '×' };
    }
    if (op === 'div') {
      const divisor = randInt(2, c.div.divisorMax);
      const quotient = randInt(1, c.div.quotientMax);
      return { a: divisor * quotient, b: divisor, c: quotient, sym: '÷' };
    }
  }

  function genQuestion(grade, op, mode) {
    const actualOp = op === 'mix' ? availableOps(grade)[randInt(0, availableOps(grade).length - 1)] : op;
    const raw = genRaw(grade, actualOp);
    if (mode === 'missing') {
      const slot = ['a', 'b', 'c'][randInt(0, 2)];
      const parts = {
        a: slot === 'a' ? '□' : raw.a,
        b: slot === 'b' ? '□' : raw.b,
        c: slot === 'c' ? '□' : raw.c,
      };
      return {
        text: `${parts.a} ${raw.sym} ${parts.b} ＝ ${parts.c}`,
        answer: raw[slot],
      };
    }
    return { text: `${raw.a} ${raw.sym} ${raw.b} ＝`, answer: raw.c };
  }

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveRecords(r) { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); }
  function recordKey(grade, op, mode) { return grade + '_' + op + '_' + mode; }

  function loadZukan() {
    try { return JSON.parse(localStorage.getItem(ZUKAN_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveZukan(arr) { localStorage.setItem(ZUKAN_KEY, JSON.stringify(arr)); }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function stageForCount(c) {
    if (c <= 0) return 0;
    if (c < 3) return 1;
    if (c < 5) return 2;
    if (c < 8) return 3;
    return 4;
  }

  /* ---------------- sound ---------------- */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { /* no audio available */ }
    }
    return audioCtx;
  }
  function beep(freq, dur, type) {
    if (state.muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  }
  function sfxCorrect() { beep(880, 0.15, 'triangle'); setTimeout(() => beep(1320, 0.18, 'triangle'), 90); }
  function sfxWrong() { beep(180, 0.25, 'sawtooth'); }
  function sfxTap() { beep(600, 0.05, 'square'); }
  function sfxClear() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle'), i * 110)); }
  function sfxEvolve() { [440, 660, 880, 1108].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'sine'), i * 80)); }

  function updateMuteUI() {
    const label = state.muted ? '🔇 おと：オフ' : '🔊 おと：オン';
    document.getElementById('btn-mute').textContent = label;
    document.getElementById('btn-mute-play').textContent = state.muted ? '🔇' : '🔊';
  }

  /* ---------------- screen management ---------------- */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ---------------- title screen ---------------- */
  function renderBestSummary() {
    const records = loadRecords();
    const keys = Object.keys(records);
    const el = document.getElementById('best-summary');
    const zukanCount = loadZukan().length;
    if (keys.length === 0) { el.textContent = 'まだ きろくが ありません。あそんでみよう！'; return; }
    let totalStars = 0;
    keys.forEach(k => totalStars += (records[k].stars || 0));
    el.textContent = `⭐ ほし ${totalStars}こ　📖 ずかん ${zukanCount}/${LINE_KEYS.length}`;
  }

  /* ---------------- select screen ---------------- */
  function renderSelect() {
    const gradeRow = document.getElementById('grade-row');
    gradeRow.innerHTML = '';
    for (let g = 1; g <= 6; g++) {
      const chip = document.createElement('button');
      chip.className = 'chip' + (g === state.grade ? ' active' : '');
      chip.textContent = g + 'ねんせい';
      chip.addEventListener('click', () => { sfxTap(); state.grade = g; syncOpForGrade(); renderSelect(); });
      gradeRow.appendChild(chip);
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === state.mode);
    });

    const ops = availableOps(state.grade).concat(availableOps(state.grade).length > 1 ? ['mix'] : []);
    const opGrid = document.getElementById('op-grid');
    opGrid.innerHTML = '';
    const records = loadRecords();
    ops.forEach(op => {
      const card = document.createElement('div');
      card.className = 'op-card' + (op === state.op ? ' active' : '');
      const rec = records[recordKey(state.grade, op, state.mode)];
      const stars = rec ? rec.stars : 0;
      card.innerHTML = `
        <div class="op-sym">${OP_META[op].sym}</div>
        <div class="op-name">${OP_META[op].name}</div>
        <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>`;
      card.addEventListener('click', () => { sfxTap(); state.op = op; renderSelect(); });
      opGrid.appendChild(card);
    });
  }

  function syncOpForGrade() {
    const ops = availableOps(state.grade);
    if (!ops.includes(state.op) && state.op !== 'mix') state.op = ops[0];
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => { sfxTap(); state.mode = btn.dataset.mode; renderSelect(); });
  });

  /* ---------------- play screen ---------------- */
  function startSession() {
    state.queue = [];
    for (let i = 0; i < QUESTIONS_PER_SESSION; i++) state.queue.push(genQuestion(state.grade, state.op, state.mode));
    state.idx = 0; state.correct = 0; state.combo = 0; state.maxCombo = 0; state.input = ''; state.locked = false;
    state.startTime = Date.now();
    state.line = LINE_KEYS[randInt(0, LINE_KEYS.length - 1)];
    state.stage = 0;
    localStorage.setItem('mathdrill_last_grade', state.grade);
    localStorage.setItem('mathdrill_last_op', state.op);
    localStorage.setItem('mathdrill_last_mode', state.mode);

    showScreen('screen-play');
    document.getElementById('creature-face').textContent = LINES[state.line].stages[0];
    document.getElementById('xp-bar-fill').style.width = '0%';
    document.getElementById('play-speech').textContent = 'がんばって！';
    renderStones();
    startTimer();
    renderQuestion();
  }

  function renderStones() {
    const row = document.getElementById('stones-row');
    row.innerHTML = '';
    for (let i = 0; i < QUESTIONS_PER_SESSION; i++) {
      const s = document.createElement('div');
      s.className = 'stone';
      s.id = 'stone-' + i;
      s.textContent = i + 1;
      row.appendChild(s);
    }
  }

  function startTimer() {
    clearInterval(state.timerHandle);
    state.timerHandle = setInterval(() => {
      const elapsed = (Date.now() - state.startTime) / 1000;
      document.getElementById('timer-label').textContent = fmtTime(elapsed);
    }, 250);
  }

  function renderQuestion() {
    state.input = '';
    state.locked = false;
    const q = state.queue[state.idx];
    document.getElementById('question-text').innerHTML = q.text.replace('□', '<span class="blank">□</span>');
    const disp = document.getElementById('answer-display');
    disp.textContent = '？';
    disp.className = 'answer-display';
    document.querySelectorAll('.stone').forEach(s => s.classList.remove('current'));
    const stone = document.getElementById('stone-' + state.idx);
    if (stone) stone.classList.add('current');
  }

  function updateAnswerDisplay() {
    document.getElementById('answer-display').textContent = state.input.length ? state.input : '？';
  }

  function pressDigit(d) {
    if (state.locked) return;
    if (state.input.length >= 7) return;
    if (state.input === '0') state.input = '';
    state.input += d;
    updateAnswerDisplay();
    sfxTap();
  }
  function pressBackspace() {
    if (state.locked) return;
    state.input = state.input.slice(0, -1);
    updateAnswerDisplay();
    sfxTap();
  }

  function flashOverlay(kind) {
    const el = document.getElementById('flash-overlay');
    el.className = 'flash-overlay go ' + kind;
    setTimeout(() => { el.className = 'flash-overlay'; }, 400);
  }

  function showCombo() {
    const badge = document.getElementById('combo-badge');
    if (state.combo >= 3) {
      badge.textContent = `🔥 ${state.combo}れんぞく！`;
      badge.classList.remove('show'); void badge.offsetWidth; badge.classList.add('show');
    } else {
      badge.classList.remove('show');
    }
  }

  function growCreature() {
    document.getElementById('xp-bar-fill').style.width = (state.correct / QUESTIONS_PER_SESSION * 100) + '%';
    const newStage = stageForCount(state.correct);
    if (newStage !== state.stage) {
      state.stage = newStage;
      const face = document.getElementById('creature-face');
      const circle = document.getElementById('creature-circle');
      face.textContent = LINES[state.line].stages[state.stage];
      circle.classList.remove('evolve'); void circle.offsetWidth; circle.classList.add('evolve');
      sfxEvolve();
    }
  }

  function submitAnswer() {
    if (state.locked || state.input === '') return;
    state.locked = true;
    const q = state.queue[state.idx];
    const userVal = Number(state.input);
    const isCorrect = userVal === q.answer;
    const disp = document.getElementById('answer-display');
    const speech = document.getElementById('play-speech');
    const stone = document.getElementById('stone-' + state.idx);

    if (isCorrect) {
      state.correct++; state.combo++; state.maxCombo = Math.max(state.maxCombo, state.combo);
      disp.className = 'answer-display correct';
      speech.textContent = PRAISE[randInt(0, PRAISE.length - 1)];
      if (stone) { stone.classList.remove('current'); stone.classList.add('ok'); stone.textContent = '◯'; }
      flashOverlay('ok'); sfxCorrect();
      growCreature();
    } else {
      state.combo = 0;
      disp.className = 'answer-display wrong';
      disp.textContent = state.input + ' (せいかい: ' + q.answer + ')';
      speech.textContent = CONSOLE_WORDS[randInt(0, CONSOLE_WORDS.length - 1)];
      if (stone) { stone.classList.remove('current'); stone.classList.add('ng'); stone.textContent = '✗'; }
      flashOverlay('ng'); sfxWrong();
    }
    showCombo();

    setTimeout(() => {
      state.idx++;
      if (state.idx >= QUESTIONS_PER_SESSION) {
        finishSession();
      } else {
        renderQuestion();
      }
    }, isCorrect ? 700 : 1300);
  }

  function finishSession() {
    clearInterval(state.timerHandle);
    const totalTime = (Date.now() - state.startTime) / 1000;
    const avgTime = totalTime / QUESTIONS_PER_SESSION;

    let stars = 0;
    if (state.correct === QUESTIONS_PER_SESSION && avgTime <= 6) stars = 3;
    else if (state.correct >= 8) stars = 2;
    else if (state.correct >= 5) stars = 1;

    const records = loadRecords();
    const key = recordKey(state.grade, state.op, state.mode);
    const prev = records[key] || { stars: 0, bestTime: null };
    records[key] = {
      stars: Math.max(prev.stars, stars),
      bestTime: (state.correct === QUESTIONS_PER_SESSION) ? Math.min(prev.bestTime || Infinity, totalTime) : prev.bestTime,
    };
    saveRecords(records);

    let newlyUnlocked = false;
    if (state.correct >= 8) {
      const zukan = loadZukan();
      if (!zukan.includes(state.line)) { zukan.push(state.line); saveZukan(zukan); newlyUnlocked = true; }
    }

    renderResult(stars, totalTime, newlyUnlocked);
  }

  /* ---------------- result screen ---------------- */
  function renderResult(stars, totalTime, newlyUnlocked) {
    showScreen('screen-result');
    document.getElementById('stat-correct').textContent = state.correct + '/' + QUESTIONS_PER_SESSION;
    document.getElementById('stat-time').textContent = fmtTime(totalTime);
    document.getElementById('stat-combo').textContent = state.maxCombo;
    document.getElementById('result-creature-face').textContent = LINES[state.line].stages[state.stage];

    const reachedFinal = state.stage === 4;
    const msgs = reachedFinal
      ? [`${LINES[state.line].name}が しんかした！`]
      : ['また れんしゅうしよう！', 'よくできました！', 'すばらしい！'];
    document.getElementById('result-msg').textContent = reachedFinal ? msgs[0] : msgs[Math.min(stars, msgs.length - 1)];

    for (let i = 1; i <= 3; i++) document.getElementById('star-' + i).classList.remove('lit');
    [1,2,3].slice(0, stars).forEach((n, i) => {
      setTimeout(() => {
        document.getElementById('star-' + n).classList.add('lit');
      }, i * 250);
    });

    const banner = document.getElementById('evolve-banner');
    if (reachedFinal) {
      banner.textContent = newlyUnlocked
        ? `📖 「${LINES[state.line].name}」を ずかんに とうろくしました！`
        : `${LINES[state.line].name}は もう ずかんに あるよ`;
      banner.classList.add('show');
    } else {
      banner.textContent = 'もっと せいかいすると しんかするよ！';
      banner.classList.add('show');
    }

    if (stars === 3) {
      setTimeout(() => { burstStars(); sfxClear(); }, 500);
    }
  }

  function burstStars() {
    const container = document.querySelector('.app');
    const rect = container.getBoundingClientRect();
    for (let i = 0; i < 14; i++) {
      const el = document.createElement('span');
      el.className = 'star-particle';
      el.textContent = ['⭐','✨','🌟'][randInt(0,2)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 120;
      el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      el.style.setProperty('--rot', (Math.random()*360) + 'deg');
      el.style.left = (rect.left + rect.width / 2) + 'px';
      el.style.top = (rect.top + rect.height / 2) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }
  }

  /* ---------------- zukan screen ---------------- */
  function renderAlbum() {
    const collected = loadZukan();
    document.getElementById('album-count').textContent = `${collected.length} / ${LINE_KEYS.length} はっけん`;
    const grid = document.getElementById('album-grid');
    grid.innerHTML = '';
    LINE_KEYS.forEach(key => {
      const has = collected.includes(key);
      const cell = document.createElement('div');
      cell.className = 'zukan-cell' + (has ? ' unlocked' : ' locked');
      cell.innerHTML = `<div class="zface">${has ? LINES[key].stages[4] : '？'}</div><div class="zname">${has ? LINES[key].name : '？？？'}</div>`;
      grid.appendChild(cell);
    });
  }

  /* ---------------- wiring ---------------- */
  document.getElementById('btn-goto-select').addEventListener('click', () => {
    ensureAudio(); sfxTap(); syncOpForGrade(); renderSelect(); showScreen('screen-select');
  });
  document.getElementById('btn-goto-album').addEventListener('click', () => {
    ensureAudio(); sfxTap(); renderAlbum(); showScreen('screen-album');
  });
  document.getElementById('btn-back-title').addEventListener('click', () => { sfxTap(); renderBestSummary(); showScreen('screen-title'); });
  document.getElementById('btn-back-title-2').addEventListener('click', () => { sfxTap(); renderBestSummary(); showScreen('screen-title'); });
  document.getElementById('btn-start-play').addEventListener('click', () => { sfxTap(); startSession(); });

  document.getElementById('numpad').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.id === 'btn-ok') { submitAnswer(); return; }
    if (btn.id === 'btn-del') { pressBackspace(); return; }
    if (btn.dataset.d !== undefined) pressDigit(btn.dataset.d);
  });

  document.getElementById('btn-quit-play').addEventListener('click', () => {
    clearInterval(state.timerHandle);
    sfxTap();
    renderSelect();
    showScreen('screen-select');
  });

  document.getElementById('btn-retry').addEventListener('click', () => { sfxTap(); startSession(); });
  document.getElementById('btn-back-select').addEventListener('click', () => { sfxTap(); renderSelect(); showScreen('screen-select'); });

  function toggleMute() {
    state.muted = !state.muted;
    localStorage.setItem(MUTE_KEY, state.muted ? '1' : '0');
    updateMuteUI();
    if (!state.muted) { ensureAudio(); sfxTap(); }
  }
  document.getElementById('btn-mute').addEventListener('click', toggleMute);
  document.getElementById('btn-mute-play').addEventListener('click', toggleMute);

  window.addEventListener('keydown', (e) => {
    if (!document.getElementById('screen-play').classList.contains('active')) return;
    if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
    else if (e.key === 'Backspace') pressBackspace();
    else if (e.key === 'Enter') submitAnswer();
  });

  /* ---------------- init ---------------- */
  updateMuteUI();
  renderBestSummary();
})();
</script>
</body>
</html>
