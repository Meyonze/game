<script>
(function(root){
  'use strict';
  const COLS=9,ROWS=12,R=18.6,TOUCH=8,SAME_TOUCH=14,LINK=70;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const position=(col,row)=>({x:29+col*37.75+(row%2?9.4:-9.4),y:86+row*35});
  function distance(b,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((b.x-ax)*dx+(b.y-ay)*dy)/l,0,1):0;return Math.hypot(b.x-ax-t*dx,b.y-ay-t*dy);}
  const chainValue=n=>n<3?n:5*n*(n-1)*(n-2);
  const REWARDS=['row','column','color','cross'];
  class RapidRun{
    constructor({seed=107,duration=15}={}){
      this.seed=seed>>>0||1;this.initialSeed=this.seed;this.width=360;this.height=500;this.count=COLS*ROWS;this.duration=duration;this.time=0;this.remaining=duration;this.phase='ready';this.world=this;
      this.score=0;this.popped=0;this.combo=0;this.maxCombo=0;this.lastPop=-Infinity;this.feverUntil=0;this.feverProgress=0;this.active=false;this.events=[];this.nextId=0;this.bodies=[];this.fast=false;
      this.chainColor=null;this.chainCount=0;this.anchor=null;this.trace=[];this.bridge=LINK;this.visited=new Set();this.blocked=null;this.bombsEarned=0;
      for(let col=0;col<COLS;col++)for(let row=0;row<ROWS;row++)this.bodies.push(this.make(col,row,{spawnAt:-1}));
      // Specials are spread out; ordinary characters keep their independent random colors.
      Object.assign(this.bodies.find(b=>b.col===4&&b.row===5),{bomb:true,power:82});
      for(const [col,row,kind] of [[1,3,'row'],[7,9,'column'],[1,10,'color']])Object.assign(this.bodies.find(b=>b.col===col&&b.row===row),{bomb:true,bombKind:kind});
    }
    random(){let n=this.seed;n^=n<<13;n^=n>>>17;n^=n<<5;this.seed=n>>>0;return this.seed/4294967296;}
    emit(type,data={}){this.events.push({type,...data});}
    drain(){const events=this.events;this.events=[];return events;}
    make(col,row,extra={}){const p=position(col,row);return{id:this.nextId++,col,row,...p,r:R,color:Math.floor(this.random()*3),angle:(this.random()-.5)*.15,bomb:false,power:82,dead:false,spawnAt:this.time,...extra};}
    get fever(){return this.time<this.feverUntil;}
    get nextBombKind(){return REWARDS[this.bombsEarned%REWARDS.length];}
    get nextChainPoints(){return(chainValue(this.chainCount+1)-chainValue(this.chainCount))*(this.fever?2:1);}
    start(x,y){
      if(this.phase==='result'||![x,y].every(Number.isFinite)||x<0||x>360||y<50||y>500)return false;
      if(this.phase==='ready'){this.phase='running';this.emit('begin');}
      this.active=true;this.chainColor=null;this.chainCount=0;this.anchor=null;this.trace=[];this.bridge=LINK;this.visited=new Set();this.blocked=null;this.last={x,y};this.lastMove=this.time;this.fast=false;this.touch(x,y,x,y,true);return true;
    }
    move(x,y){
      if(this.phase!=='running'||!this.active||![x,y].every(Number.isFinite))return false;
      const a=this.last,d=Math.hypot(x-a.x,y-a.y);if(d<1)return false;
      this.fast=d/Math.max(.008,this.time-this.lastMove)>=450;
      this.touch(a.x,a.y,x,y,false);this.last={x,y};this.lastMove=this.time;return true;
    }
    end(){this.active=false;this.fast=false;this.anchor=null;this.trace=[];this.chainColor=null;this.chainCount=0;this.combo=0;this.blocked=null;this.visited.clear();}
    blocker(ax,ay,bx,by){
      if(this.chainColor===null)return null;
      const dx=bx-ax,dy=by-ay,length=dx*dx+dy*dy;if(length<1)return null;
      let found=null,first=Infinity;
      for(const c of this.bodies){
        if(c.dead||c.bomb||c.color===this.chainColor||this.visited.has(c.col+':'+c.row))continue;
        const t=((c.x-ax)*dx+(c.y-ay)*dy)/length;
        if(t<=0||t>=1||t>=first)continue;
        if(distance(c,ax,ay,bx,by)<c.r){found=c;first=t;}
      }
      return found;
    }
    touch(ax,ay,bx,by,initial){
      if(this.phase!=='running')return;
      const brush=this.chainColor===null?TOUCH:SAME_TOUCH;
      const dx=bx-ax,dy=by-ay,length=dx*dx+dy*dy;
      let hits=this.bodies.filter(b=>{
        if(b.dead||!b.bomb&&this.visited.has(b.col+':'+b.row))return false;
        const reach=b.r+(initial?TOUCH:b.bomb||this.chainColor===null||b.color===this.chainColor?4:0);
        return distance(b,ax,ay,bx,by)<=reach&&(initial||Math.hypot(b.x-ax,b.y-ay)>reach);
      });
      // Forgive the intended endpoint without vacuuming up every nearby matching body.

      particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,color,r:1.5+Math.random()*3.5,life,max:life,angle:a,spin:(Math.random()-.5)*12,kind:i%4===0?'star':'shard'});
    }
    if(!motion)for(let i=0;i<2;i++)particles.push({x,y,sx:x,sy:y,color:'#ffdf8c',r:2.2,life:.5+i*.07,max:.5+i*.07,kind:'reward',bend:(Math.random()-.5)*100});
    if(particles.length>420)particles.splice(0,particles.length-420);
  }
  function shout(text,finished=false){
    const el=$('shout');el.textContent=text;el.classList.remove('show','finished');if(finished)el.classList.add('finished');el.classList.add('show');shoutUntil=now+.85;
  }
  function burst(x,y,r,color,strong=false){bursts.push({x,y,r,color,strong,life:motion?.12:.24,max:motion?.12:.24});if(bursts.length>64)bursts.shift();}
  function handleEvents(){
    const events=world.drain();let hits=0;
    for(const e of events){
      if(e.type==='begin'){shout('GO!');$('instruction').textContent='同色を長くつなぐほど、得点が跳ね上がる！';}
      if(e.type==='chain-boost'){
        shout(e.count+' CHAIN ×'+e.multiplier+'！');ring(e.x,e.y,60,'#fff0b5',.3,5);bits(e.x,e.y,'#ffe6a1',12,true);tone(660,.14,.09,'triangle');tone(990,.13,.06,'sine',.035);
      }
      if(e.type==='touch'){
        strokes.push({ax:e.fromX,ay:e.fromY,bx:e.x,by:e.y,r:e.radius,life:.14,max:.14});if(strokes.length>40)strokes.shift();
      }
      if(e.type==='reroute'){ring(e.x,e.y,25,palette[e.color],.14,2);}
      if(e.type==='fever'){shout('F E V E R !');boom(true);}
      if(e.type==='pop'){
        const color=palette[e.color];bits(e.x,e.y,color,e.direct&&e.combo>=7?12:8,e.direct&&e.combo>=7);burst(e.x,e.y,e.r,color,e.direct&&e.combo>=7);ring(e.x,e.y,e.direct&&e.combo>=7?42:31,color,.22,3);popSound(e.combo);hits++;
        if(e.direct&&e.combo>=7){labels.push({x:e.x,y:e.y,text:'+'+e.points.toLocaleString('ja-JP'),life:.5,max:.5});if(labels.length>16)labels.shift();}
        if(!motion)shake=Math.max(shake,e.fast?1.5:.6);
      }
      if(e.type==='finish'){cancelPointer();finishRun();}
    }
    if(hits){$('combo').classList.remove('bump');$('combo').classList.add('bump');}
  }
  function react(){handleEvents();$('tap-hint').hidden=true;renderRun();}
  function startStroke(x,y){
    advanceGame();if(!['ready','running'].includes(run.phase))return false;if(!run.start(x,y))return false;aim={x,y,until:Infinity};react();initAudio();return run.phase==='running';
  }
  function moveStroke(x,y,refresh=true){
    advanceGame();if(run.phase!=='running'||!run.active)return;run.move(x,y);aim={...run.last,until:Infinity};if(refresh)react();if(run.phase!=='running')cancelPointer();
  }
  function point(e){const r=canvas.getBoundingClientRect(),s=Math.min(r.width/360,r.height/500),px=(r.width-360*s)/2,py=(r.height-500*s)/2;return{x:(e.clientX-r.left-px)/s,y:(e.clientY-r.top-py)/s};}
  function cancelPointer(e){
    if(e?.pointerId!==undefined&&pointer&&e.pointerId!==pointer.id)return;
    const id=pointer?.id;pointer=null;keyboardDrawing=false;run?.end(['pointercancel','lostpointercapture','blur'].includes(e?.type)?'cancel':'release');
    if(id!==undefined)try{canvas.releasePointerCapture?.(id);}catch{}
  }
  canvas.addEventListener('pointerdown',e=>{
    if(e.isPrimary===false||pointer||!['ready','running'].includes(run.phase)||(typeof e.button==='number'&&e.button!==0))return;e.preventDefault();
    const p=point(e);keyboardAim=false;if(!startStroke(p.x,p.y))return;pointer={id:e.pointerId,...p,clientX:e.clientX,clientY:e.clientY};try{canvas.setPointerCapture?.(e.pointerId);}catch{}
  });
  canvas.addEventListener('pointermove',e=>{
    const p=point(e);if(!pointer){if(e.pointerType!=='touch'&&['ready','running'].includes(run.phase))aim={...p,until:Infinity};return;}
    if(e.pointerId!==pointer.id)return;e.preventDefault();
    let samples=[];try{samples=e.getCoalescedEvents?.()||[];}catch{}
    if(samples.length){
      samples=samples.slice(-32);const tail=samples.at(-1);if(tail.clientX!==e.clientX||tail.clientY!==e.clientY)samples.push(e);
      for(const sample of samples){if(!pointer||run.phase!=='running')break;const at=point(sample);moveStroke(at.x,at.y,false);}react();
    }else moveStroke(p.x,p.y);
    if(pointer)pointer={...pointer,x:run.last.x,y:run.last.y,clientX:e.clientX,clientY:e.clientY};
  });
  function endPointer(e){
    if(!pointer||e.pointerId!==pointer.id)return;
    if(e.type!=='pointercancel'&&e.type!=='lostpointercapture'&&run.phase==='running'){const p=point(e);moveStroke(p.x,p.y);}

  }
  canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',e=>{cancelPointer(e);react();});canvas.addEventListener('lostpointercapture',e=>{cancelPointer(e);react();});window.addEventListener('blur',()=>{cancelPointer({type:'blur'});react();});
  canvas.addEventListener('keydown',e=>{
    const vectors={ArrowLeft:[-18,0],ArrowRight:[18,0],ArrowUp:[0,-18],ArrowDown:[0,18]};
    if(vectors[e.key]){e.preventDefault();keyboardAim=true;const[dx,dy]=vectors[e.key],x=clamp(aim.x+dx,0,360),y=clamp(aim.y+dy,0,worldHeight);if(keyboardDrawing)moveStroke(x,y);else if(['ready','running'].includes(run.phase))aim={x,y,until:Infinity};}
    if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();if(!keyboardDrawing&&['ready','running'].includes(run.phase)){keyboardDrawing=startStroke(aim.x,aim.y);}else if(keyboardDrawing&&e.key==='Enter'){cancelPointer();renderRun();}}
    if(e.key==='Escape'&&run.phase==='running'){e.preventDefault();cancelPointer({type:'pointercancel'});react();}
  });
  canvas.addEventListener('keyup',e=>{if(e.key===' '&&keyboardDrawing){e.preventDefault();cancelPointer();renderRun();}});
  $('burst').onclick=()=>{if(run.phase==='result')newWave();};
  $('new-board').onclick=async()=>{
    const result=mode==='million'?targetLabel+'まで '+run.time.toFixed(2)+'秒！':modes[mode].label+'で '+run.score.toLocaleString('ja-JP')+'点！';
    const text='一筆で、大連鎖。'+result+' 最大'+run.maxCombo+' CHAIN https://meyonze.github.io/game/chain-forge-rift.html?v=8';
    try{await navigator.clipboard.writeText(text);$('new-board').textContent='記録をコピーしました';}catch{$('announcer').textContent=text;$('instruction').textContent=text;}
  };
  function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
  function jelly(b){
    const color=palette[b.color],r=b.r,age=Math.max(0,run.time-b.spawnAt),birth=motion?1:Math.min(1,.65+age*3),wiggle=motion?0:Math.sin(now*2+b.id)*.025;
    const hot=false;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(motion?0:b.angle+wiggle);ctx.scale(birth,birth);
    // The silhouette squashes under impact; the face stays large enough to read.
    ctx.beginPath();ctx.moveTo(-r,-r*.08);ctx.bezierCurveTo(-r,-r*1.05,r*.5,-r*1.2,r*.92,-r*.15);ctx.bezierCurveTo(r*1.2,r*.8,r*.2,r*1.12,-r*.65,r*.75);ctx.bezierCurveTo(-r*.96,r*.6,-r*1.1,r*.38,-r,-r*.08);
    ctx.fillStyle=color;ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=hot?'#ffeab2':'#ffffff40';ctx.stroke();
    ctx.beginPath();ctx.ellipse(-r*.32,-r*.42,r*.25,r*.12,-.5,0,Math.PI*2);ctx.fillStyle='#ffffff80';ctx.fill();
    const ex=r*.32,ey=-r*.03;
    if(hot){ctx.strokeStyle='#77404a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-ex-2,ey-1);ctx.lineTo(-ex+1,ey+1);ctx.lineTo(-ex-2,ey+3);ctx.moveTo(ex+2,ey-1);ctx.lineTo(ex-1,ey+1);ctx.lineTo(ex+2,ey+3);ctx.stroke();}
    else{ctx.fillStyle='#292b49';ctx.beginPath();ctx.ellipse(-ex,ey,1.65,2.4,0,0,Math.PI*2);ctx.ellipse(ex,ey,1.65,2.4,0,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#33365066';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText(['●','◆','♥'][b.color],0,-r*.48);
    ctx.strokeStyle=hot?'#77404a':'#3b4058';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(0,r*.2,r*.17,0,Math.PI);ctx.stroke();
    ctx.restore();
  }
  function drawEffects(dt){
    for(const b of bursts){
      b.life-=dt;if(b.life<=0)continue;const t=1-b.life/b.max;
      if(motion){ctx.globalAlpha=(1-t)*.3;circle(b.x,b.y,b.r,b.color);continue;}
      const reach=b.r*(1+t*(b.strong?2.1:1.5));ctx.save();ctx.translate(b.x,b.y);
      ctx.globalAlpha=(1-t)*.75;ctx.strokeStyle=b.color;ctx.lineWidth=(b.strong?5:3)*(1-t);ctx.beginPath();ctx.arc(0,0,reach,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=b.color;ctx.globalAlpha=(1-t)*.9;
      for(let i=0;i<6;i++){const a=i*Math.PI/3,dx=Math.cos(a),dy=Math.sin(a),px=-dy,py=dx,w=(b.strong?5:3)*(1-t),inner=b.r*(.25+t),outer=reach*(b.strong?1.45:1.3);ctx.beginPath();ctx.moveTo(dx*inner+px*w,dy*inner+py*w);ctx.lineTo(dx*outer,dy*outer);ctx.lineTo(dx*inner-px*w,dy*inner-py*w);ctx.closePath();ctx.fill();}
      if(t<.45){ctx.globalAlpha=(1-t/.45)*.85;circle(0,0,b.r*(.8+t*.5),'#fff9e5');}
      ctx.restore();
    }bursts=bursts.filter(b=>b.life>0);ctx.globalAlpha=1;
    for(const s of strokes){s.life-=dt;if(s.life<=0)continue;ctx.globalAlpha=s.life/s.max*.12;ctx.beginPath();ctx.moveTo(s.ax,s.ay);ctx.lineTo(s.bx,s.by);ctx.lineWidth=s.r*2;ctx.lineCap='round';ctx.strokeStyle='#ffe4a1';ctx.stroke();}strokes=strokes.filter(s=>s.life>0);ctx.globalAlpha=1;
    for(const p of particles){
      p.life-=dt;if(p.life<=0)continue;const t=1-p.life/p.max;ctx.globalAlpha=Math.min(1,p.life*5);
      if(p.kind==='reward'){
        const endX=180,endY=32,curve=Math.sin(t*Math.PI);p.x=p.sx+(endX-p.sx)*t+p.bend*curve;p.y=p.sy+(endY-p.sy)*t-curve*55;
        ctx.beginPath();ctx.moveTo(p.x-(endX-p.sx)*.035,p.y-(endY-p.sy)*.035);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#ffe5a8';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();circle(p.x,p.y,p.r,'#fff0b7');
      }else{
        if(!motion){p.vy+=140*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*2);p.angle+=p.spin*dt;}
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;const r=p.r*(1-t*.6);
        ctx.beginPath();if(p.kind==='star'){ctx.moveTo(0,-r*2);ctx.lineTo(r*.5,-r*.4);ctx.lineTo(r*1.7,0);ctx.lineTo(r*.4,r*.5);ctx.lineTo(0,r*1.7);ctx.lineTo(-r*.5,r*.4);ctx.lineTo(-r*1.7,0);ctx.lineTo(-r*.4,-r*.5);}else{ctx.moveTo(-r,-r);ctx.lineTo(r*1.3,-r*.2);ctx.lineTo(r*.3,r);}ctx.closePath();ctx.fill();ctx.restore();
      }
    }
    particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;
    for(const r of rings){r.life-=dt;if(r.life<=0)continue;const t=1-r.life/r.max;ctx.globalAlpha=(1-t)*.65;ctx.strokeStyle=r.color;ctx.lineWidth=r.width*(1-t*.75);ctx.beginPath();ctx.arc(r.x,r.y,r.r*(.15+Math.pow(t,.5)),0,Math.PI*2);ctx.stroke();if(t<.2){ctx.globalAlpha=(.2-t)*.45;circle(r.x,r.y,r.r*.8,r.color);}}
    rings=rings.filter(r=>r.life>0).slice(-75);ctx.globalAlpha=1;
    for(const s of sparks){s.life-=dt;if(s.life<=0)continue;const t=1-s.life/s.max,px=s.x+(s.tx-s.x)*t,py=s.y+(s.ty-s.y)*t-Math.sin(t*Math.PI)*16;ctx.globalAlpha=(1-t)*.7;ctx.beginPath();ctx.moveTo(px-(s.tx-s.x)*.1,py-(s.ty-s.y)*.1);ctx.lineTo(px,py);ctx.lineWidth=2;ctx.strokeStyle=s.color;ctx.stroke();circle(px,py,2.3,'#fff1c8');}sparks=sparks.filter(s=>s.life>0);ctx.globalAlpha=1;
  }
  function draw(dt){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,offsetX,offsetY);ctx.save();ctx.beginPath();ctx.rect(0,0,360,500);ctx.clip();
    if(shake>.05&&!motion){if(!run.active)ctx.translate(Math.sin(now*145)*shake,Math.cos(now*119)*shake*.6);shake*=Math.exp(-dt*17);}
    for(const a of ambient){ctx.globalAlpha=.12+Math.sin(now*.8+a.phase)*.08;circle(a.x,a.y,a.r,'#c6caff');}ctx.globalAlpha=1;
    for(const b of world.bodies)if(!b.dead){
      if(run.active&&run.visited.has(b.col+':'+b.row))continue;
      const matching=run.chainColor===null||b.color===run.chainColor;
      ctx.globalAlpha=run.active&&!matching ? .45 : 1;jelly(b);ctx.globalAlpha=1;
      if(run.active&&run.chainColor!==null&&matching&&run.anchor&&Math.hypot(b.x-run.anchor.x,b.y-run.anchor.y)<=run.bridge&&!run.blocker(run.anchor.x,run.anchor.y,b.x,b.y)){
        ctx.strokeStyle=palette[b.color];ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,Math.PI*2);ctx.stroke();
      }
    }
    if(run.blocked&&!run.blocked.dead){ctx.strokeStyle='#f4d7c5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(run.blocked.x,run.blocked.y,run.blocked.r+3,0,Math.PI*2);ctx.stroke();}
    if(run.active&&run.anchor&&run.chainColor!==null){
      ctx.save();ctx.strokeStyle=palette[run.chainColor];ctx.globalAlpha=.7;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(run.anchor.x,run.anchor.y,23,0,Math.PI*2);ctx.stroke();
      circle(run.anchor.x,run.anchor.y,5,palette[run.chainColor]);circle(run.anchor.x,run.anchor.y,2,'#fff6dc');
      if(Math.hypot(aim.x-run.anchor.x,aim.y-run.anchor.y)<=run.bridge&&!run.blocker(run.anchor.x,run.anchor.y,aim.x,aim.y)){ctx.globalAlpha=.4;ctx.beginPath();ctx.moveTo(run.anchor.x,run.anchor.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();}ctx.restore();
    }
    if(run.strokePath.length){
      ctx.save();ctx.strokeStyle=palette[run.chainColor];ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5;ctx.globalAlpha=.4;ctx.beginPath();run.strokePath.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
      ctx.lineWidth=3;ctx.globalAlpha=.9;ctx.beginPath();run.strokePath.slice(-8).forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
    }
    drawEffects(dt);
    for(const label of labels){label.life-=dt;if(label.life<=0)continue;const t=1-label.life/label.max;ctx.globalAlpha=Math.min(1,label.life*4);ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#172039';const x=clamp(label.x,90,270),y=clamp(label.y,105,440)-(motion?0:t*25);ctx.strokeText(label.text,x,y);ctx.fillStyle='#ffe8b5';ctx.fillText(label.text,x,y);}labels=labels.filter(l=>l.life>0);ctx.globalAlpha=1;
    ctx.restore();
    if(keyboardAim&&(run.phase==='ready'||run.phase==='running')){ctx.save();ctx.strokeStyle='#fff0b8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(aim.x,aim.y,23,0,Math.PI*2);ctx.stroke();ctx.restore();}
  }

  function frame(time){
    if(document.hidden){raf=0;return;}
    const dt=last?clamp((time-last)/1000,0,.05):1/60;last=time;now=time/1000;
    advanceGame(time);handleEvents();if(run.phase==='result'&&pointer)cancelPointer();if(run.phase==='result')finishRun();
    const second=Math.ceil(run.remaining);if(run.phase==='running'&&second<=5&&second!==lastSecond){tone(660,.08,.08,'square');lastSecond=second;}
    renderRun();draw(dt);
    if(shoutUntil&&now>=shoutUntil){$('shout').classList.remove('show');shoutUntil=0;}
    raf=requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){advanceGame();cancelPointer({type:'pointercancel'});cancelAnimationFrame(raf);raf=0;last=0;if(audio)audio.suspend().catch(()=>{});}else if(!raf){last=0;raf=requestAnimationFrame(frame);}});
  window.addEventListener('resize',resize);
  window.visualViewport?.addEventListener?.('resize',resize);
  loadBoard();renderSound();resize();newWave();raf=requestAnimationFrame(frame);
})();

</script>
