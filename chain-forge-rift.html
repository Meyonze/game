<main class="game">
  <header class="topline"><div class="brand"><i aria-hidden="true">ϟ</i><div>RIFT<small>CUT & COLLAPSE · 01</small></div></div><div class="top-tools"><a class="old-link" href="chain-forge-feel.html?v=19">前のなぞり版</a><button class="sound" id="sound" aria-label="音を切り替える" aria-pressed="true"></button></div></header>
  <section class="intro"><h1 id="board-name">つないだ跡で、切り崩せ。</h1><span id="wave">15秒</span></section>
  <section class="arena" id="arena" aria-label="指で触れた場所から弾ける遊び場">
    <canvas id="field" tabindex="0" role="button" aria-label="同色をなぞると即座に消えて、亀裂が残ります。他色と金のピンには貫通できません。指を離して色を変え、亀裂を継ぎ足します。金のピンにつながっていない塊は、色を問わず丸ごと崩落します。最初は白く光る4か所を切って右の塊を落としましょう。矢印キーで照準、Spaceを押しながら矢印でなぞる。15秒で得点を競います。"></canvas>
    <div class="combo-hud"><div class="combo-line"><b id="combo">0</b><span>PTS</span></div><p id="combo-caption">BEST 0</p></div>
    <div class="tap-hint" id="tap-hint" aria-hidden="true"><i class="finger"></i><b>亀裂をつないで、崩せ</b><small>同色を切る。亀裂はずっと残る。</small></div>
    <div class="shout" id="shout" aria-hidden="true"></div>
    <div class="arena-hint" id="arena-hint">金のピンにつながる塊は落ちない</div>
  </section>
  <section class="controls"><div class="ink-row"><span>残り時間</span><div class="ink-track" id="ink-track" role="progressbar" aria-label="残り時間の割合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="ink-fill"></i></div><b id="ink-left">15.0秒</b></div><p id="instruction">同色をなぞる → 亀裂が残る → 切り離した塊が落ちる</p><div class="button-slot"><div class="gesture-prompt" id="gesture-prompt">触れた瞬間、15秒スタート</div><button class="burst-button" id="burst" hidden>もう一度、15秒！</button></div><button class="new-board" id="new-board">記録をコピー</button></section>
</main>
<div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
<script>
(function(root){
  'use strict';
  const COLS=9,ROWS=12,R=17.3,LINK=70,TOUCH=8,SAME_TOUCH=14;
  const position=(col,row)=>({x:29+col*37.75,y:86+row*35});
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function distance(b,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((b.x-ax)*dx+(b.y-ay)*dy)/l,0,1):0;return Math.hypot(b.x-ax-t*dx,b.y-ay-t*dy);}
  const slot=(col,row)=>col+':'+row;
  class RiftRun{
    constructor({seed=107,duration=15}={}){
      this.seed=seed>>>0||1;this.width=360;this.height=500;this.duration=duration;this.remaining=duration;this.time=0;this.phase='ready';this.world=this;this.count=COLS*ROWS;
      this.score=0;this.popped=0;this.collapsed=0;this.collapseCount=0;this.biggestCollapse=0;this.maxCombo=0;this.combo=0;this.active=false;this.events=[];this.nextId=0;this.slab=0;this.refreshAt=null;
      this.chainColor=null;this.chainCount=0;this.anchor=null;this.trace=[];this.visited=new Set();this.blocked=null;this.fast=false;this.bridge=LINK;
      this.newSlab();
    }
    random(){let n=this.seed;n^=n<<13;n^=n>>>17;n^=n<<5;this.seed=n>>>0;return this.seed/4294967296;}
    emit(type,data={}){this.events.push({type,...data});}
    drain(){const e=this.events;this.events=[];return e;}
    get nextChainPoints(){return 20+Math.min(80,this.chainCount*5);}
    get guideRemaining(){return this.slab===1?this.bodies.filter(b=>b.guide&&!b.dead).length:0;}
    newSlab(){
      this.slab++;this.refreshAt=null;this.cracks=new Set();this.bodies=[];this.active=false;this.resetChain();
      for(let col=0;col<COLS;col++)for(let row=0;row<ROWS;row++)this.bodies.push({id:this.nextId++,col,row,...position(col,row),r:R,color:Math.floor(this.random()*3),angle:(this.random()-.5)*.1,dead:false,pin:false,spawnAt:this.time});
      // Pins are structural anchors. Any ordinary cell disconnected from every pin falls.
      const layouts=[[[0,2],[0,9],[3,6]],[[0,1],[8,4],[3,11]],[[2,0],[8,8],[0,6]],[[0,3],[8,2],[5,11]]];
      for(const [col,row] of layouts[(this.slab-1)%layouts.length])this.bodies.find(b=>b.col===col&&b.row===row).pin=true;
      if(this.slab===1){
        for(const b of this.bodies)if(b.col===6){
          if(b.row>=2&&b.row<=9){b.dead=true;this.cracks.add(slot(b.col,b.row));}
          else b.guide=true;
        }
      }
      this.updateHints();
      this.emit('slab',{number:this.slab});
    }
    resetChain(){this.chainColor=null;this.chainCount=0;this.combo=0;this.anchor=null;this.trace=[];this.visited.clear();this.blocked=null;this.fast=false;}
    start(x,y){
      if(this.phase==='result'||![x,y].every(Number.isFinite)||x<0||x>360||y<50||y>500)return false;
      if(this.phase==='ready'){this.phase='running';this.emit('begin');}
      this.active=true;this.resetChain();this.last={x,y};this.lastMove=this.time;this.touch(x,y,x,y,true);return true;
    }
    move(x,y){
      if(this.phase!=='running'||!this.active||![x,y].every(Number.isFinite))return false;
      const a=this.last,d=Math.hypot(x-a.x,y-a.y);if(d<1)return false;
      this.fast=d/Math.max(.008,this.time-this.lastMove)>=450;this.touch(a.x,a.y,x,y,false);this.last={x,y};this.lastMove=this.time;return true;
    }
    end(){this.active=false;this.resetChain();}
    blocker(ax,ay,bx,by){
      if(this.chainColor===null)return null;
      const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;if(l<1)return null;
      let found=null,first=Infinity;
      for(const b of this.bodies){
        if(b.dead||!b.pin&&b.color===this.chainColor)continue;
        const t=((b.x-ax)*dx+(b.y-ay)*dy)/l;
        if(t>0&&t<1&&t<first&&distance(b,ax,ay,bx,by)<b.r){found=b;first=t;}
      }
      return found;
    }
    touch(ax,ay,bx,by,initial){
      if(this.phase!=='running')return;
      const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
      let hits=this.bodies.filter(b=>{if(b.dead)return false;const reach=b.r+(initial?TOUCH:b.pin||this.chainColor!==null&&b.color!==this.chainColor?0:4);return distance(b,ax,ay,bx,by)<=reach&&(initial||Math.hypot(b.x-ax,b.y-ay)>reach);});
      let nearest=null,best=Infinity;
      if(!initial&&this.chainColor!==null)for(const b of this.bodies){if(b.dead)continue;const d=Math.hypot(b.x-bx,b.y-by);if(d<best){best=d;nearest=b;}}
      if(nearest&&!nearest.pin&&nearest.color===this.chainColor&&best<=R+SAME_TOUCH&&this.anchor&&Math.hypot(nearest.x-this.anchor.x,nearest.y-this.anchor.y)<=LINK&&!hits.includes(nearest))hits.push(nearest);
      hits.sort((a,b)=>initial?Math.hypot(a.x-bx,a.y-by)-Math.hypot(b.x-bx,b.y-by):((a.x-ax)*dx+(a.y-ay)*dy-((b.x-ax)*dx+(b.y-ay)*dy))/Math.max(1,l));
      if(initial)hits=hits.slice(0,1);
      let changed=false;
      for(const b of hits){
        if(b.dead)continue;
        const obstruction=this.blocker(ax,ay,b.x,b.y)||(this.anchor&&this.blocker(this.anchor.x,this.anchor.y,b.x,b.y));
        if(obstruction){this.blocked=obstruction;break;}
        if(b.pin){this.blocked=b;break;}
        if(this.chainColor!==null&&b.color!==this.chainColor){this.blocked=b;break;}
        if(this.anchor&&Math.hypot(b.x-this.anchor.x,b.y-this.anchor.y)>LINK)continue;
        this.connect(b);changed=true;
      }
      if(changed){this.emit('touch',{fromX:ax,fromY:ay,x:bx,y:by,radius:TOUCH});this.resolveCollapse();}
    }
    connect(b){
      if(b.dead||b.pin)return;
      this.chainColor=b.color;this.chainCount++;this.combo=this.chainCount;this.maxCombo=Math.max(this.maxCombo,this.chainCount);this.anchor={x:b.x,y:b.y};this.trace.push({...this.anchor});this.blocked=null;this.visited.add(slot(b.col,b.row));
      const points=20+Math.min(80,(this.chainCount-1)*5);this.score+=points;this.popped++;b.dead=true;this.cracks.add(slot(b.col,b.row));
      this.emit('pop',{id:b.id,x:b.x,y:b.y,r:b.r,reach:25,color:b.color,combo:this.chainCount,points,score:this.score,fast:this.fast,direct:true});
    }
    resolveCollapse(){
      if(this.phase!=='running')return;
      const live=new Map(this.bodies.filter(b=>!b.dead).map(b=>[slot(b.col,b.row),b]));
      const neighbors=b=>[[b.col-1,b.row],[b.col+1,b.row],[b.col,b.row-1],[b.col,b.row+1]].map(([c,r])=>live.get(slot(c,r))).filter(Boolean);
      const supported=new Set(),queue=[...live.values()].filter(b=>b.pin);
      for(let i=0;i<queue.length;i++){const b=queue[i];if(supported.has(b.id))continue;supported.add(b.id);for(const n of neighbors(b))if(!supported.has(n.id))queue.push(n);}
      const seen=new Set(supported);
      for(const b of live.values()){
        if(seen.has(b.id))continue;
        const group=[b];seen.add(b.id);

        if(!motion){p.vy+=140*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*2);p.angle+=p.spin*dt;}
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;const r=p.r*(1-t*.6);
        ctx.beginPath();if(p.kind==='star'){ctx.moveTo(0,-r*2);ctx.lineTo(r*.5,-r*.4);ctx.lineTo(r*1.7,0);ctx.lineTo(r*.4,r*.5);ctx.lineTo(0,r*1.7);ctx.lineTo(-r*.5,r*.4);ctx.lineTo(-r*1.7,0);ctx.lineTo(-r*.4,-r*.5);}else{ctx.moveTo(-r,-r);ctx.lineTo(r*1.3,-r*.2);ctx.lineTo(r*.3,r);}ctx.closePath();ctx.fill();ctx.restore();
      }
    }
    particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;
    for(const r of rings){r.life-=dt;if(r.life<=0)continue;const t=1-r.life/r.max;ctx.globalAlpha=(1-t)*.65;ctx.strokeStyle=r.color;ctx.lineWidth=r.width*(1-t*.75);ctx.beginPath();ctx.arc(r.x,r.y,r.r*(.15+Math.pow(t,.5)),0,Math.PI*2);ctx.stroke();if(t<.2){ctx.globalAlpha=(.2-t)*.45;circle(r.x,r.y,r.r*.8,r.color);}}
    rings=rings.filter(r=>r.life>0).slice(-75);ctx.globalAlpha=1;
    for(const s of sparks){s.life-=dt;if(s.life<=0)continue;const t=1-s.life/s.max,px=s.x+(s.tx-s.x)*t,py=s.y+(s.ty-s.y)*t-Math.sin(t*Math.PI)*16;ctx.globalAlpha=(1-t)*.7;ctx.beginPath();ctx.moveTo(px-(s.tx-s.x)*.1,py-(s.ty-s.y)*.1);ctx.lineTo(px,py);ctx.lineWidth=2;ctx.strokeStyle=s.color;ctx.stroke();circle(px,py,2.3,'#fff1c8');}sparks=sparks.filter(s=>s.life>0);ctx.globalAlpha=1;
  }
  function drawStructure(){
    const live=new Map(world.bodies.filter(b=>!b.dead).map(b=>[b.col+':'+b.row,b]));
    ctx.lineWidth=7;ctx.strokeStyle='#62718d55';ctx.beginPath();
    for(const b of live.values())for(const [c,r] of [[b.col+1,b.row],[b.col,b.row+1]]){const n=live.get(c+':'+r);if(n){ctx.moveTo(b.x,b.y);ctx.lineTo(n.x,n.y);}}ctx.stroke();
    for(const b of world.bodies)if(b.dead){
      ctx.fillStyle='#080e1ecc';ctx.fillRect(b.x-18,b.y-16.8,36,33.6);
      ctx.strokeStyle='#ffbc8244';ctx.lineWidth=1;ctx.strokeRect(b.x-18,b.y-16.8,36,33.6);
      ctx.strokeStyle='#ffcb9b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x-10,b.y-5);ctx.lineTo(b.x-2,b.y+3);ctx.lineTo(b.x+2,b.y-3);ctx.lineTo(b.x+10,b.y+5);ctx.stroke();
    }
    for(const b of live.values())if(b.pin){
      ctx.strokeStyle='#efbc7466';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);const distances=[b.x-8,352-b.x,b.y-66,493-b.y],side=distances.indexOf(Math.min(...distances));ctx.lineTo(side===0?8:side===1?352:b.x,side===2?66:side===3?493:b.y);ctx.stroke();
    }
  }
  function draw(dt){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,offsetX,offsetY);ctx.save();ctx.beginPath();ctx.rect(0,0,360,500);ctx.clip();
    if(shake>.05&&!motion){ctx.translate(Math.sin(now*145)*shake,Math.cos(now*119)*shake*.6);shake*=Math.exp(-dt*17);}
    for(const a of ambient){ctx.globalAlpha=.12+Math.sin(now*.8+a.phase)*.08;circle(a.x,a.y,a.r,'#c6caff');}ctx.globalAlpha=1;
    drawStructure();
    for(const b of world.bodies)if(!b.dead){
      const matching=run.chainColor===null||b.color===run.chainColor||b.pin;
      ctx.globalAlpha=run.active&&!matching?.45:1;jelly(b);ctx.globalAlpha=1;
      if(b.guide){const pulse=motion?1:1+Math.sin(now*4)*.06;ctx.strokeStyle='#fff5ce';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(b.x,b.y,(b.r+4)*pulse,0,Math.PI*2);ctx.stroke();}
      if(b.dropHint>0){circle(b.x+12,b.y-12,9,'#ffe0a1');ctx.fillStyle='#4b3044';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(String(b.dropHint),b.x+12,b.y-8);}
      if(run.active&&run.chainColor!==null&&!b.pin&&matching&&run.anchor&&Math.hypot(b.x-run.anchor.x,b.y-run.anchor.y)<=run.bridge&&!run.blocker(run.anchor.x,run.anchor.y,b.x,b.y)){
        ctx.strokeStyle=palette[b.color];ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,Math.PI*2);ctx.stroke();
      }
    }
    if(run.blocked&&!run.blocked.dead){ctx.strokeStyle='#f4d7c5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(run.blocked.x,run.blocked.y,run.blocked.r+3,0,Math.PI*2);ctx.stroke();}
    if(run.trace.length){ctx.save();ctx.strokeStyle=palette[run.chainColor];ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=.75;ctx.beginPath();run.trace.slice(-8).forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();}
    for(const group of falling){
      group.life-=dt;if(group.life<=0)continue;const t=1-group.life/group.max;ctx.save();ctx.globalAlpha=(1-t)*(motion?.5:1);
      if(!motion){ctx.translate(group.x,group.y+35*t+500*t*t);ctx.rotate(group.spin*t);ctx.translate(-group.x,-group.y);}
      for(const b of group.cells)jelly(b);ctx.restore();
    }falling=falling.filter(g=>g.life>0);
    drawEffects(dt);
    for(const label of labels){label.life-=dt;if(label.life<=0)continue;const t=1-label.life/label.max;ctx.globalAlpha=Math.min(1,label.life*4);ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#172039';const x=clamp(label.x,90,270),y=clamp(label.y,105,440)-(motion?0:t*35);ctx.strokeText(label.text,x,y);ctx.fillStyle='#ffe8b5';ctx.fillText(label.text,x,y);}labels=labels.filter(l=>l.life>0);ctx.globalAlpha=1;
    ctx.restore();
    if(keyboardAim&&(run.phase==='ready'||run.phase==='running')){ctx.save();ctx.strokeStyle='#fff0b8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(aim.x,aim.y,23,0,Math.PI*2);ctx.stroke();ctx.restore();}
  }

  function frame(time){
    if(document.hidden){raf=0;return;}
    const dt=last?clamp((time-last)/1000,0,.05):1/60;last=time;now=time/1000;
    advanceGame(time);handleEvents();if(run.phase==='result'&&pointer)cancelPointer();if(run.phase==='result')finishRun();
    const second=Math.ceil(run.remaining);if(run.phase==='running'&&second<=5&&second!==lastSecond){tone(660,.08,.08,'square');lastSecond=second;}
    renderRun();draw(dt);
    if(shoutUntil&&now>=shoutUntil){$('shout').classList.remove('show');shoutUntil=0;}
    raf=requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){advanceGame();cancelPointer({type:'pointercancel'});cancelAnimationFrame(raf);raf=0;last=0;if(audio)audio.suspend().catch(()=>{});}else if(!raf){last=0;raf=requestAnimationFrame(frame);}});
  window.addEventListener('resize',resize);
  renderSound();resize();newWave();raf=requestAnimationFrame(frame);
})();

</script>
</body>
