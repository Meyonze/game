/* Fit the whole game to the visible mobile viewport, including browser bars. */
.board-space{min-width:0;display:grid;place-items:center}
.board-wrap{width:100%}
.cell.placed,.weapon-card{touch-action:none;-webkit-touch-callout:none}
.cell.placed,.weapon-card{cursor:grab}
.board.dragging,.board.dragging .cell{cursor:grabbing}
.drag-source .piece-art{opacity:.25}
.weapon-card.drag-source{opacity:.55}
.cell.drop-target{outline:3px solid #5d9465;outline-offset:-1px;background:#d8edc5!important;z-index:2}
.cell.drop-invalid{outline:2px solid #bf765d;outline-offset:-1px;z-index:2}
.drag-ghost{position:fixed;transform:translate(-50%,-60%);pointer-events:none;z-index:60;display:grid;place-items:center;border:2px solid #739568;border-radius:12px;background:#fff5d6e8;box-shadow:0 8px 20px #172b2840;will-change:left,top}
.drag-ghost .piece-art{width:94%;height:94%;max-width:none}
.drag-ghost.invalid{border-color:#b87a63;background:#f7e2dce8;opacity:.8}
.ignition-row{display:flex;align-items:center;gap:7px;min-height:34px;margin:6px 0}
.ignition-label{font-size:11px;font-weight:700;white-space:nowrap}
.ignition-options{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.ignition-empty{color:#7b8978;font-size:10px}
.ignition-option{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-width:0;max-width:91px;height:34px;border:1px solid #d2d9c6;border-radius:8px;background:#fffdf2;padding:3px 5px;touch-action:manipulation}
.ignition-option .piece-art{width:23px;height:23px;flex:0 0 23px}
.ignition-option span{font:700 11px monospace}
.ignition-option.active{background:#ecd18a;border-color:#b68b35;box-shadow:inset 0 0 0 1px #b68b3540}
.ignition-option:disabled{opacity:.55}
.cell.ignition{border-color:#b68b35;background:#fff0bd;box-shadow:inset 0 0 0 1px #b68b3540}
.cell.ignition:before{content:'起爆';width:28px;height:17px;font:700 8px/13px sans-serif;border-radius:6px;color:#fff4cd;background:#9d752d;border-color:#f4efdb;left:-3px;top:-5px}
.board-guide{flex-shrink:0;background:none;border:0;padding:0 4px;color:#486c4c;font-size:10px;line-height:20px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
#board-note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.guide-heading{display:flex;align-items:center;justify-content:center;gap:10px;margin:13px 0}
.guide-heading>svg{width:65px;height:65px;flex-shrink:0}
.guide-heading h2{font-size:22px;margin:0;text-align:left}
.guide-list{display:grid;gap:9px;text-align:left;margin:17px 0}
.guide-entry{display:flex;align-items:center;gap:12px;border:1px solid #d6dfca;background:#edf1df;border-radius:12px;padding:12px}
.guide-entry h3{font-size:13px;margin:0 0 5px}
.guide-entry p{font-size:11px;line-height:1.8;margin:0;color:#65765f}
.guide-entry>svg{width:48px;height:48px;flex:0 0 48px}
.guide-copy{flex:1;min-width:0}
.guide-key{color:#4d6b40;font-weight:700}
.mini-board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;flex-shrink:0;width:78px;height:78px;padding:4px;background:#cfdbc3;border:1px solid #bdceb0;border-radius:9px}
.mini-cell{display:grid;place-items:center;background:#f0f5e7;border-radius:3px;min-width:0;min-height:0;font:700 11px monospace;color:#5b744b}
.mini-cell svg{width:100%;height:100%}
.mini-cell.range-hit{background:#c2dea4;box-shadow:inset 0 0 0 1px #8faf79}

      diagram=rangeDiagram(tile.type);note='図は下から撃った場合。鏡の向きは固定です。弾は曲がった先でも、敵への攻撃や装置の起動を続けます。';
    }
    openModal(`<div class="eyebrow">${tag}</div><div class="guide-heading">${art}<h2 id="modal-title">${title}</h2></div><p>${description}</p><div class="inspect-range">${diagram}<p>${enemy?'緑の4マスに<br><strong>それぞれ1ダメージ</strong><br>＋ 装置を起動':tile.type==='wall'?'弾は岩でストップ。<br>向こう側には届かない。':'鏡で曲がる。<br>下からの弾は<br><strong>'+ (tile.type==='/'?'右':'左') +'へ。</strong>'}</p></div><p class="inspect-note">${note}</p><button class="modal-primary" id="inspect-back">盤面に戻る</button><button class="modal-secondary" id="inspect-guide">敵・ギミックをすべて見る</button>`);
    $('inspect-back').onclick=closeModal;$('inspect-guide').onclick=showGuide;
  }
  function showGuide(){
    if(phase==='playing')return;if(phase==='result')restoreSetup();
    openModal(`<button class="modal-close" aria-label="閉じる" id="guide-close">×</button><div class="eyebrow">KNOW YOUR CHAIN</div><h2 id="modal-title">敵・ギミックの図解</h2><p>盤面の敵・岩・鏡をタップしても、<br>その効果と範囲を確認できます。</p><div class="rule-flow"><b>攻撃</b>→<b>敵を撃破</b>→<b>十字に誘爆</b>→<b>次へ連鎖</b></div><div class="guide-list">
      <article class="guide-entry">${rangeDiagram('pulse')}<div class="guide-copy"><h3>敵は全員、倒すと誘爆</h3><p><span class="guide-key">上下左右1マスに1ダメージ。</span>斜めには届きません。隣の敵を倒せば、その敵も誘爆します。隣の装置も起動できます。</p></div></article>
      <article class="guide-entry">${enemyArt(2)}<div class="guide-copy"><h3>数字は、残りHP</h3><p>HPが0で撃破。鎧の敵も炉心も、<span class="guide-key">複数の攻撃や誘爆のダメージを合算</span>して倒せます。倒した時の誘爆は同じです。</p></div></article>
      <article class="guide-entry">${rangeDiagram('bomb')}<div class="guide-copy"><h3>ボム：周囲8マスに1ダメージ</h3><p>斜めにも届きます。<span class="guide-key">敵の誘爆は十字、ボムは周囲8マス。</span>爆風が別の装置に当たると、その装置も起動します。</p></div></article>
      <article class="guide-entry">${weaponArt('lance')}<div class="guide-copy"><h3>ランス：一直線に2ダメージ</h3><p>盤面の端まで、敵と装置を貫通。途中の装置を起動しつつ、先の敵にも届きます。岩で止まり、鏡で曲がります。</p></div></article>
      <article class="guide-entry">${weaponArt('spark')}<div class="guide-copy"><h3>スパーク：4マス先まで1ダメージ</h3><p><span class="guide-key">最初に当たった敵か装置で止まります。</span>鏡で曲がった後も、移動できるのは合計4マスまでです。</p></div></article>
      <article class="guide-entry">${rangeDiagram('wall')}<div class="guide-copy"><h3>岩：弾を止める</h3><p>貫通弾も止めます。壊せず、装置も置けません。別の射線から狙おう。</p></div></article>
      <article class="guide-entry">${rangeDiagram('/')}<div class="guide-copy"><h3>鏡：弾を90度曲げる</h3><p>スパークとランスの弾を反射。向きは固定で、装置は置けません。<span class="guide-key">図は下から撃った場合。</span>逆向きの鏡では左へ曲がります。</p></div></article>
    </div><p class="inspect-note">起動するのは「起爆」欄で選んだ1台だけ。ほかの装置は、弾・爆風・敵の誘爆が当たると起動します。<strong>各装置は1回の連鎖につき1度だけ起動。</strong></p><button class="modal-primary" id="guide-back">わかった、試してみる</button>`);
    $('guide-close').onclick=closeModal;$('guide-back').onclick=closeModal;
  }
  function showTutorial(first=false){
    openModal(`<button class="modal-close" aria-label="閉じる" id="tutorial-close">×</button><div class="eyebrow">WELCOME TO THE WORKSHOP</div><h2 id="modal-title">置いて、つないで、<br>一気に崩す。</h2><p>装置を配置し、ひとつだけ起動。<br><strong>敵は全員、倒すと上下左右に誘爆します。</strong></p><div class="tutorial-steps"><div class="tutorial-step">${weaponArt('bomb')}<small>01 / PLACE</small>空きマスに置く</div><div class="tutorial-step">${weaponArt('spark')}<small>02 / CONNECT</small>装置をつなぐ</div><div class="tutorial-step">${weaponArt('lance')}<small>03 / IGNITE</small>全撃破を狙う</div></div><div class="rule-flow"><b>敵を撃破</b>→<b>十字に1ダメージ</b>→<b>次へ連鎖</b></div><p>ボムの爆風は斜めも含めた周囲8マス。<br>敵の誘爆は上下左右の4マス。<br>敵・岩・鏡をタップすると、図解を確認できます。</p><button class="modal-primary" id="tutorial-start">${first?'最初の連鎖をつくる':'工房に戻る'}</button><button class="modal-secondary" id="tutorial-guide">敵・ギミックの図解を見る</button>`);
    const done=()=>{saved.seen=true;persist();closeModal();};$('tutorial-start').onclick=()=>{audioFx('place');done();};$('tutorial-close').onclick=done;
    $('tutorial-guide').onclick=()=>{saved.seen=true;persist();showGuide();};
  }
  function showHint(){
    if(phase==='playing')return;if(phase==='result')restoreSetup();hintCount++;
    openModal(`<button class="modal-close" aria-label="閉じる" id="hint-close">×</button><div class="eyebrow">A LITTLE SPARK</div><h2 id="modal-title">工房のヒント</h2><p class="hint-text">${level.hints[Math.min(hintCount-1,level.hints.length-1)]}</p><p>正解はひとつとは限りません。<br>配置を残したまま、何度でも試せます。</p><button class="modal-primary" id="hint-back">自分で試す</button>${hintCount>1?'<button class="modal-secondary" id="hint-solution">攻略例を配置する</button>':'<button class="modal-secondary" id="hint-more">もう少しヒント</button>'}`);
    $('hint-close').onclick=closeModal;$('hint-back').onclick=closeModal;if($('hint-more'))$('hint-more').onclick=showHint;
    if($('hint-solution'))$('hint-solution').onclick=()=>{snapshot();placements=clone(level.solution);startIndex=level.start;focus=startIndex;selected=placements[focus].type;closeModal();render();toast('攻略例を配置しました。「連鎖を起動」で試せます。');};
  }
  function showMap(){
    if(phase==='playing')return;
    if(phase==='result')restoreSetup();
    openModal(`<button class="modal-close" aria-label="閉じる" id="map-close">×</button><div class="eyebrow">THE ${LEVELS.length} EXPERIMENTS</div><h2 id="modal-title">工房の地図</h2><p>全${LEVELS.length}面。小さな火花から、最後の炉心へ。</p><div class="level-map" id="level-map"></div><button class="modal-secondary" id="map-back">工房に戻る</button>`);
    LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.className='map-item';b.disabled=i>0&&!saved.cleared.includes(i-1);b.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><span>${l.name}</span><small>${saved.cleared.includes(i)?'CLEAR':b.disabled?'LOCKED':'PLAY'}</small>`;b.onclick=()=>{closeModal();loadLevel(i);};$('level-map').append(b);});$('map-close').onclick=closeModal;$('map-back').onclick=closeModal;
  }
  $('brand-symbol').innerHTML=ICONS.spark;$('map-button').innerHTML=ICONS.map;$('help-button').innerHTML=ICONS.help;$('launch-icon').innerHTML=ICONS.play;
  const renderSound=()=>{$('sound-button').innerHTML=saved.sound?ICONS.sound:ICONS.mute;$('sound-button').setAttribute('aria-label',saved.sound?'音をオフにする':'音をオンにする');$('sound-button').setAttribute('aria-pressed',String(saved.sound));};
  renderSound();$('sound-button').onclick=()=>{saved.sound=!saved.sound;persist();renderSound();if(saved.sound)audioFx('place');};$('help-button').onclick=()=>{if(phase==='result')restoreSetup();showTutorial();};$('hint-button').onclick=showHint;$('map-button').onclick=showMap;
  $('guide-button').onclick=showGuide;
  document.addEventListener('keydown',e=>{
    if(drag){if(e.key==='Escape'){e.preventDefault();cancelDrag();}return;}
    if(!$('modal-backdrop').hidden){
      if(e.key==='Escape'){e.preventDefault();const wasResult=phase==='result';closeModal();if(wasResult)restoreSetup();return;}
      if(e.key==='Tab'){const items=[...$('modal').querySelectorAll('button:not(:disabled),[href],input,[tabindex="0"]')];if(!items.length){e.preventDefault();return;}const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('modal'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
      return;
    }
    if(phase!=='setup')return;
    if(e.key.toLowerCase()==='r'&&!$('rotate-button').disabled){e.preventDefault();$('rotate-button').click();}
    if((e.key==='Delete'||e.key==='Backspace')&&!$('remove-button').disabled){e.preventDefault();$('remove-button').click();}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo-button').click();}
    const el=document.activeElement;if(el?.classList.contains('cell')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let x=Number(el.dataset.x),y=Number(el.dataset.y);if(e.key==='ArrowLeft')x--;if(e.key==='ArrowRight')x++;if(e.key==='ArrowUp')y--;if(e.key==='ArrowDown')y++;$('board').querySelector(`[data-x="${Math.max(0,Math.min(5,x))}"][data-y="${Math.max(0,Math.min(5,y))}"]`)?.focus();}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelDrag();if(audio)audio.suspend().catch(()=>{});}});
  loadLevel(levelIndex);if(!saved.seen)showTutorial(true);
})();

</script>
</body>
</html>
