function drawSpinBlades(){
  const ws=G.weapons.spin;if(!ws)return;
  const st=WD.spin.stats(ws.lv);
  const m=ws.m||{};
  const effLen=st.len*(m.area||1);
  const fanHalf=Math.PI*0.42;

  // ── 剣本体: スイープ中 or holdフェーズ中のみ表示 ──
  const isVisible=ws.sweeping||(ws.holdPhase!=null);
  if(isVisible){
    const sweepA=ws.sweepA||0;
    // フェードα: startホールドは0→1、endホールドは1→0、スイープ中は1
    let alpha=1;
    if(ws.holdPhase==='start'){
      const HOLD_START=180;
      alpha=1-(ws.holdTimer/HOLD_START); // 0→1に立ち上がる
    }else if(ws.holdPhase==='end'){
      const HOLD_END=220;
      alpha=ws.holdTimer/HOLD_END;       // 1→0に消える
    }
    // スイープ軌跡（扇形トレイル）
    const trailStart=-Math.PI/2-fanHalf;
    const trailEnd=-Math.PI/2+sweepA;
    if(trailEnd>trailStart){
      const grad=ctx.createRadialGradient(G.px,G.py,st.r,G.px,G.py,st.r+effLen);
      grad.addColorStop(0,`rgba(80,255,230,${0.22*alpha})`);
      grad.addColorStop(1,'rgba(80,255,230,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.moveTo(G.px,G.py);
      ctx.arc(G.px,G.py,st.r+effLen,trailStart,trailEnd);
      ctx.closePath();ctx.fill();
    }

    for(let bi=0;bi<st.blades;bi++){
      const bladeOff=st.blades>1?(bi/(st.blades-1)-0.5)*fanHalf*0.45:0;
      const a=-Math.PI/2+sweepA+bladeOff;
      const bx0=G.px+Math.cos(a)*st.r;
      const by0=G.py+Math.sin(a)*st.r;
      const bx1=G.px+Math.cos(a)*(st.r+effLen);
      const by1=G.py+Math.sin(a)*(st.r+effLen);

      ctx.save();
      ctx.globalAlpha=alpha;
      // アウトライン（視認性用）
      ctx.shadowBlur=0;
      ctx.strokeStyle=INK;ctx.lineWidth=18;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(bx0,by0);ctx.lineTo(bx1,by1);ctx.stroke();
      // グロー（1パスに集約）
      ctx.shadowColor='#00ffe6';ctx.shadowBlur=18;
      ctx.strokeStyle='rgba(80,255,235,0.45)';ctx.lineWidth=11;
      ctx.beginPath();ctx.moveTo(bx0,by0);ctx.lineTo(bx1,by1);ctx.stroke();
      // 白芯
      ctx.shadowBlur=0;
      ctx.strokeStyle='#e8fffc';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(bx0,by0);ctx.lineTo(bx1,by1);ctx.stroke();
      ctx.restore();

      // ヒルト（握り）
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.translate(bx0,by0);ctx.rotate(a+Math.PI/2);
      ctx.fillStyle='#c8b88a';ctx.strokeStyle=INK;ctx.lineWidth=1.5;
      rr(ctx,-5,-2,10,4,2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#e8d06a';
      rr(ctx,-7,-1.5,14,3,1.5);ctx.fill();ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur=0;ctx.lineCap='butt';ctx.globalAlpha=1;
  } // end isVisible

  // ── 剣気弾（isBlade=true）: 三日月型ネオン ──
  for(const b of G.bullets){
    if(!b.isBlade)continue;
    const life01=Math.min(1,(b.life||0)/2400);
    const dir=b.arcDir||1;
    const W2=(b.sweepWidth||60)*0.5; // 横幅の半分
    const thick=W2*0.28;             // 三日月の厚み

    // 三日月をpathで描く（上向き弓形、端が尖る）
    // 外弧: 上に凸の大きい弧
    // 内弧: 少し小さく、厚みぶんだけ内側
    const outerR=W2*1.1;
    const innerR=outerR-thick;
    // 弧の中心Y（弾位置より下にずらして弧が上に出る）
    const ocx=b.x, ocy=b.y+outerR*0.82;
    const icx=b.x, icy=b.y+innerR*0.82+thick*0.15;
    const halfA=Math.asin(W2/outerR);     // 外弧の半角
    const iHalfA=Math.asin(Math.min(0.999,W2/innerR)); // 内弧の半角

    const oStartA=-Math.PI/2-halfA;
    const oEndA  =-Math.PI/2+halfA;
    const iStartA=-Math.PI/2-iHalfA;
    const iEndA  =-Math.PI/2+iHalfA;

    ctx.save();
    ctx.globalAlpha=life01*0.95;

    // 三日月パスを作る（外弧→左端→内弧逆順→右端で閉じる）
    const makeCrescent=()=>{
      ctx.beginPath();
      ctx.arc(ocx,ocy,outerR,oStartA,oEndA,false);
      ctx.arc(icx,icy,innerR,iEndA,iStartA,true);
      ctx.closePath();
    };

    // 塗り＋グロー（1パスに集約）
    ctx.shadowColor='#00ffe6';ctx.shadowBlur=14;
    ctx.fillStyle='rgba(60,255,235,0.45)';
    makeCrescent();ctx.fill();

    // アウトライン＋芯（shadowなし）
    ctx.shadowBlur=0;
    ctx.strokeStyle=INK;ctx.lineWidth=2;
    makeCrescent();ctx.stroke();
    ctx.fillStyle='rgba(220,255,252,0.5)';
    makeCrescent();ctx.fill();

    ctx.restore();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}

      const def=WD[id];
      const div=document.createElement('div');div.className='wslot';
      const ic=makeIcon(id,22);
      div.appendChild(ic);
      const lv=document.createElement('span');lv.className='wlv';lv.textContent='Lv.'+ws.lv;
      div.appendChild(lv);
      // タッチで説明ポップアップ
      let tipTimer=null;
      div.addEventListener('touchstart',e=>{
        e.stopPropagation();
        const tip=document.getElementById('wtip');
        tip.textContent=def.name+'：'+def.desc;
        tip.style.opacity='1';
        tip.style.bottom=document.getElementById('wbar').offsetHeight+'px';
        clearTimeout(tipTimer);
        tipTimer=setTimeout(()=>{tip.style.opacity='0';},2200);
      },{passive:true});
      div.addEventListener('touchend',()=>{
        clearTimeout(tipTimer);
        tipTimer=setTimeout(()=>{document.getElementById('wtip').style.opacity='0';},400);
      },{passive:true});
      div.title=def.name;bar.appendChild(div);
    }
    bar._sig=sig;
  }
}
function refreshTop(){
  document.getElementById('ss-score').textContent='SCORE '+G.score;
  document.getElementById('ss-lv').textContent='LV '+G.lv;
  document.getElementById('ss-kill').textContent='KILL '+G.kills;
  const pct=G.totalSegs>0?Math.floor(G.killedSegs/G.totalSegs*100):0;
  document.getElementById('stage-pct').textContent=pct+'%';
  document.getElementById('wave-bar').style.width=pct+'%';
}
function announce(txt){
  const el=document.getElementById('announce');
  el.textContent=txt;el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',2200);
  Audio2.play('wavestart');
}
function drawPauseIcon(paused){
  const c=document.getElementById('pause-icon');if(!c)return;
  const g=c.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=26*dpr;c.height=26*dpr;
  c.style.width='26px';c.style.height='26px';
  g.scale(dpr,dpr);
  g.clearRect(0,0,26,26);
  g.fillStyle='#4a3f35';
  if(paused){
    // 三角（再生）
    g.beginPath();g.moveTo(8,5);g.lineTo(21,13);g.lineTo(8,21);g.closePath();g.fill();
  }else{
    // 2本バー（一時停止）
    g.fillRect(6,5,4,16);g.fillRect(16,5,4,16);
  }
}
function togglePause(){
  if(G.over)return;
  if(G._curChoices)return; // 武器選択画面表示中はポーズ操作を無効化
  G.paused=!G.paused;
  drawPauseIcon(G.paused);
  if(!G.paused){G.lastTime=performance.now();}
}
// PWA/バックグラウンド対策: 最小化・タブ切替でBGMが鳴り続けるのを防ぐ
// Web AudioはvisibilitychangeでAudioContextが自動停止しないため明示的に止める。
// ゲイン0だけでなくAudioContext自体もsuspendして二重に確実化。
// visibilitychangeに加えてblur/focusも監視（端末差でどちらかしか発火しないケースの保険）
function onBackground(){
  Audio2.stopBGM();
  if(Audio2.ctx&&Audio2.ctx.state==='running')Audio2.ctx.suspend();
  if(G&&!G.over&&!G.paused){G._autoPaused=true;G.paused=true;drawPauseIcon(true);}
}
function onForeground(){
  if(!G||G.over)return;
  if(Audio2.ctx&&Audio2.ctx.state==='suspended')Audio2.ctx.resume();
  if(G._autoPaused){G._autoPaused=false;G.paused=false;G.lastTime=performance.now();drawPauseIcon(false);}
  if(!G.paused)Audio2.startBGM();
}
document.addEventListener('visibilitychange',()=>{document.hidden?onBackground():onForeground();});
window.addEventListener('blur',onBackground);
window.addEventListener('focus',onForeground);
window.addEventListener('pagehide',()=>{Audio2.stopBGM();if(Audio2.ctx)Audio2.ctx.suspend();});
function doReroll(){
  if(!G.rerolls||G.rerolls<=0)return;
  if(!G._curChoices)return;
  G.rerolls--;
  G._curChoices=buildChoices();
  renderChoiceCards(G._curChoices);
}
function drawRerollIcon(){
  const el=document.getElementById('reroll-icon');if(!el)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  el.width=18*dpr;el.height=18*dpr;
  el.style.width='18px';el.style.height='18px';
  const g=el.getContext('2d');g.scale(dpr,dpr);
  g.clearRect(0,0,18,18);
  const cx=9,cy=9,r=5.5,lw=2.2;
  g.strokeStyle='#4a3f35';g.lineWidth=lw;g.lineCap='round';
  // 円弧（約270°、右上が開く）
  g.beginPath();
  g.arc(cx,cy,r, Math.PI*0.2, Math.PI*1.95);
  g.stroke();
  // 矢印の先端（円弧の終点=右上あたり）
  const endA=Math.PI*0.2;
  const ex=cx+Math.cos(endA)*r, ey=cy+Math.sin(endA)*r;
  // 接線方向の矢印（時計回り方向）
  const tang=endA+Math.PI/2;
  const aw=3.5;
  g.beginPath();
  g.moveTo(ex,ey);
  g.lineTo(ex+Math.cos(tang-0.5)*aw, ey+Math.sin(tang-0.5)*aw);
  g.moveTo(ex,ey);
  g.lineTo(ex+Math.cos(tang+0.9)*aw, ey+Math.sin(tang+0.9)*aw);
  g.stroke();
}
function updateRerollUI(){
  const btn=document.getElementById('reroll-btn');
  const cnt=document.getElementById('reroll-count');
  if(!btn||!cnt)return;
  cnt.textContent='('+(G.rerolls||0)+')';
  btn.style.opacity=(G.rerolls>0)?'1':'0.4';
  btn.style.cursor=(G.rerolls>0)?'pointer':'default';
  drawRerollIcon();
}
function gameOver(reason){
  G.over=true;
  Audio2.stopBGM();
  Audio2.play('gameover');
  document.getElementById('go-reason').textContent=reason||'';
  document.getElementById('go-stats').innerHTML=
    `WAVE ${G.wave}　SCORE ${G.score}<br>KILL ${G.kills}　SEG ${G.segKills}<br>LV ${G.lv}`;
  show('gameover-screen');
}
function show(id){document.getElementById(id).style.display='flex';}
function hide(id){document.getElementById(id).style.display='none';}

// ══ title mascot ══
(function drawMascot(){
  const tc=document.getElementById('title-mascot');
  if(!tc)return;
  const dpr=Math.min(3,window.devicePixelRatio||1);
  const oc=document.createElement('canvas');
  oc.width=Math.round(140*dpr);oc.height=Math.round(120*dpr);
  const c2=oc.getContext('2d');c2.scale(dpr,dpr);
  const px=70,py=62,R=34;
  // worm behind (peeking)
  c2.fillStyle='#8fbf7f';c2.strokeStyle=INK;c2.lineWidth=2.5;
  for(let i=2;i>=0;i--){
    c2.beginPath();c2.arc(px+44-i*1,py-14+i*16,15-i*1.5,0,Math.PI*2);
    c2.fill();c2.stroke();
  }
  c2.fillStyle=INK;
  c2.beginPath();c2.arc(px+40,py-18,2.6,0,Math.PI*2);c2.fill();
  c2.beginPath();c2.arc(px+50,py-18,2.6,0,Math.PI*2);c2.fill();
  // hero
  c2.fillStyle='#fffdf7';c2.strokeStyle=INK;c2.lineWidth=3;
  c2.beginPath();c2.arc(px-12,py,R,0,Math.PI*2);c2.fill();c2.stroke();
  c2.beginPath();c2.arc(px-12-R*0.62,py-R*0.62,R*0.3,0,Math.PI*2);c2.fill();c2.stroke();
  c2.beginPath();c2.arc(px-12+R*0.62,py-R*0.62,R*0.3,0,Math.PI*2);c2.fill();c2.stroke();
  c2.fillStyle='#e8c0b0';
  c2.beginPath();c2.arc(px-12-R*0.62,py-R*0.62,R*0.13,0,Math.PI*2);c2.fill();
  c2.beginPath();c2.arc(px-12+R*0.62,py-R*0.62,R*0.13,0,Math.PI*2);c2.fill();
  c2.fillStyle=INK;
  c2.beginPath();c2.arc(px-12-R*0.28,py-R*0.08,R*0.1,0,Math.PI*2);c2.fill();
  c2.beginPath();c2.arc(px-12+R*0.28,py-R*0.08,R*0.1,0,Math.PI*2);c2.fill();
  c2.strokeStyle=INK;c2.lineWidth=R*0.08;c2.lineCap='round';
  c2.beginPath();c2.moveTo(px-12-R*0.1,py+R*0.22);c2.lineTo(px-12+R*0.1,py+R*0.22);c2.stroke();
  c2.fillStyle='rgba(217,108,95,0.4)';
  c2.beginPath();c2.arc(px-12-R*0.5,py+R*0.1,R*0.11,0,Math.PI*2);c2.fill();
  c2.beginPath();c2.arc(px-12+R*0.5,py+R*0.1,R*0.11,0,Math.PI*2);c2.fill();
  c2.strokeStyle='#d96c5f';c2.lineWidth=R*0.16;
  c2.beginPath();c2.arc(px-12,py,R*0.98,Math.PI*1.18,Math.PI*1.82);c2.stroke();
  const img=new Image(140,120);
  img.src=oc.toDataURL();
  img.style.cssText='width:140px;height:120px;display:block;';
  tc.replaceWith(img);
})();

// ══ INPUT ══
window.addEventListener('keydown',e=>{keys[e.key]=true;Audio2.resume();});
window.addEventListener('keyup',e=>keys[e.key]=false);
let lastTX=null;
const DRAG_SENS=1.25; // finger px -> player px
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  Audio2.init();Audio2.resume();
  lastTX=e.touches[0].clientX;
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(lastTX===null){lastTX=e.touches[0].clientX;return;}
  const tx=e.touches[0].clientX;
  const dx=(tx-lastTX)*DRAG_SENS;
  lastTX=tx;
  if(G&&!G.paused&&!G.over)G.px=clamp(G.px+dx,G.pr,W-G.pr);
},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();lastTX=null;},{passive:false});

// PWA: Service Worker登録（同一ディレクトリのsw.jsが必要。file://直開き時やsw.js未配置時は自動的に無視される）
// scopeを本ファイル自身に限定: 同じ/game/配下に他のゲーム(HTML)が同居しても影響しない
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{scope:'squirium-buster.html'}).catch(()=>{/* sw.js未配置 or file://直開き時は静かに無視 */});
  });
}
