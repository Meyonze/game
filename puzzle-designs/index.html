<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パズル・デザイン比較</title><style>*{box-sizing:border-box}body{margin:0;padding:28px 18px 45px;background:#171a1c;color:#e8e6df;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}main{max-width:1180px;margin:auto}header small{font-size:10px;color:#9a9d99;letter-spacing:2px}h1{font-size:24px;margin:12px 0}header p{font-size:12px;line-height:1.8;color:#a8ada8;margin:0 0 24px}nav{display:flex;gap:9px;margin:24px 0;position:sticky;top:8px;z-index:1}button{font:inherit;cursor:pointer;border:1px solid #555d5e;background:#23292b;color:#bec4bd;border-radius:30px;padding:10px 17px;font-size:12px}button.on{background:#ded8c7;color:#242e30;border-color:#ded8c7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 16px}.sample{min-width:0}.sample h2{font-size:15px;letter-spacing:.5px;margin:13px 0 8px}.sample p{font-size:11px;line-height:1.8;color:#a8ada8;margin:0}.preview{display:block;width:100%;padding:0;border:1px solid #545956;border-radius:12px;overflow:hidden;background:transparent}.preview canvas{display:block;width:100%;height:auto}footer{margin-top:32px;font-size:11px;line-height:1.8;color:#9ca69f}a{color:#d9c9a6}dialog{max-width:min(95vw,650px);max-height:97dvh;padding:14px;background:#191f20;color:#e9e5d7;border:1px solid #67716a;border-radius:15px}dialog::backdrop{background:#080d10e8}dialog canvas{display:block;width:auto;max-width:100%;max-height:78dvh;margin:auto}dialog .close{display:block;margin:10px auto 0}dialog h2{font-size:17px;margin:4px 0 12px;text-align:center}[hidden]{display:none!important}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){body{padding:22px 12px}.grid{gap:22px 12px}.sample h2{font-size:13px}.sample p{font-size:10px}h1{font-size:21px}button{font-size:11px;padding:9px 12px}}</style><main><header><small>PUZZLE / VISUAL DIRECTIONS</small><h1>落ち着いた方向も、見比べる。</h1><p>同じ配置・同じ5種類のピースで比較しています。画像をタップすると拡大できます。<br>見た目の静止画サンプルです。ゲーム本体のデザインは変更していません。</p></header><nav><button data-group="calm" class="on">落ち着いた4案</button><button data-group="pop">先ほどの4案</button><button data-group="all">全部</button></nav><div class="grid" id="grid"></div><footer><a href="./hidamari.html?v=5">ゲーム本体へ</a> · 比較サンプルの数字は共通です。</footer><dialog id="zoom"><h2 id="zoom-title"></h2><canvas id="zoom-canvas"></canvas><button class="close">閉じる</button></dialog></main><script src="render.js"></script><script>const D=window.PuzzleDesigns,grid=document.getElementById('grid'),zoom=document.getElementById('zoom');D.themes.forEach((t,i)=>{const el=document.createElement('article');el.className='sample';el.dataset.group=t.group;el.hidden=t.group!=='calm';el.innerHTML='<button class="preview" aria-label="'+t.name+'を拡大"><canvas></canvas></button><h2>'+String(i+1).padStart(2,'0')+' '+t.name+'</h2><p>'+t.desc+'</p>';grid.append(el);D.draw(el.querySelector('canvas'),i);el.querySelector('button').onclick=()=>{document.getElementById('zoom-title').textContent=t.name;D.draw(document.getElementById('zoom-canvas'),i);zoom.showModal();};});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.sample').forEach(el=>el.hidden=b.dataset.group!=='all'&&el.dataset.group!==b.dataset.group);});document.querySelector('.close').onclick=()=>zoom.close();</script></html>
