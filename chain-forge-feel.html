<main class="game">
  <header class="topline"><div class="brand"><i aria-hidden="true">ϟ</i><div>CHAIN FORGE<small>15 SECOND FLOW · 11</small></div></div><div class="top-tools"><a class="old-link" href="chain-forge.html">配置モード</a><button class="sound" id="sound" aria-label="音を切り替える" aria-pressed="true"></button></div></header>

  <section class="arena" id="arena" aria-label="指で触れた場所から弾ける遊び場">
    <canvas id="field" tabindex="0" role="button" aria-label="最初の1体から即座に消去。同じ色を7体つなぐと強力ボムが生まれます。別の色を2つ続けてなぞると、指を離さず色が切り替わります。最初のタッチから15秒の得点を競います。長い同色の接続ほど得点が伸びます。金色ボムに触れると大爆発。矢印で照準、Spaceを押しながら矢印でなぞる。離しても15秒の時計は続きます。"></canvas>

<div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
<script>
(function(root){
  'use strict';
  const COLS=9,ROWS=12,R=18.6,TOUCH=4,LINK=56;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const position=(col,row)=>({x:29+col*37.75+(row%2?9.4:-9.4),y:86+row*35});
  function distance(b,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((b.x-ax)*dx+(b.y-ay)*dy)/l,0,1):0;return Math.hypot(b.x-ax-t*dx,b.y-ay-t*dy);}
  const chainValue=n=>n<3?n:5*n*(n-1)*(n-2);
  class RapidRun{
    constructor({seed=107,duration=15}={}){
      this.seed=seed>>>0||1;this.initialSeed=this.seed;this.width=360;this.height=500;this.count=COLS*ROWS;this.duration=duration;this.time=0;this.remaining=duration;this.phase='ready';this.world=this;
      this.score=0;this.popped=0;this.combo=0;this.maxCombo=0;this.lastPop=-Infinity;this.feverUntil=0;this.feverProgress=0;this.active=false;this.events=[];this.nextId=0;this.bodies=[];this.fast=false;
      this.chainColor=null;this.chainCount=0;this.anchor=null;this.trace=[];this.bridge=LINK;this.visited=new Set();this.pivot=null;
      for(let col=0;col<COLS;col++)for(let row=0;row<ROWS;row++)this.bodies.push(this.make(col,row,{spawnAt:-1}));
      // A visible opening bomb teaches the only special target through touch.
      Object.assign(this.bodies.find(b=>b.col===4&&b.row===5),{bomb:true,power:82});
    }
    random(){let n=this.seed;n^=n<<13;n^=n>>>17;n^=n<<5;this.seed=n>>>0;return this.seed/4294967296;}
    emit(type,data={}){this.events.push({type,...data});}
    drain(){const events=this.events;this.events=[];return events;}
    make(col,row,extra={}){const p=position(col,row);return{id:this.nextId++,col,row,...p,r:R,color:Math.floor(this.random()*4),angle:(this.random()-.5)*.15,bomb:false,power:82,dead:false,spawnAt:this.time,...extra};}
    get fever(){return this.time<this.feverUntil;}
    get nextChainPoints(){return(chainValue(this.chainCount+1)-chainValue(this.chainCount))*(this.fever?2:1);}
    start(x,y){
      if(this.phase==='result'||![x,y].every(Number.isFinite)||x<0||x>360||y<65||y>500)return false;
      if(this.phase==='ready'){this.phase='running';this.emit('begin');}
      this.active=true;this.chainColor=null;this.chainCount=0;this.anchor=null;this.trace=[];this.bridge=LINK;this.visited=new Set();this.pivot=null;this.last={x,y};this.lastMove=this.time;this.fast=false;this.touch(x,y,x,y,true);return true;
    }
    move(x,y){
      if(this.phase!=='running'||!this.active||![x,y].every(Number.isFinite))return false;
      const a=this.last,d=Math.hypot(x-a.x,y-a.y);if(d<1)return false;
      this.fast=d/Math.max(.008,this.time-this.lastMove)>=450;
      this.touch(a.x,a.y,x,y,false);this.last={x,y};this.lastMove=this.time;return true;
    }
    end(){this.active=false;this.fast=false;this.anchor=null;this.trace=[];this.chainColor=null;this.chainCount=0;this.combo=0;this.pivot=null;this.visited.clear();}
    touch(ax,ay,bx,by,initial){
      if(this.phase!=='running')return;
      const brush=TOUCH;
      const dx=bx-ax,dy=by-ay,length=dx*dx+dy*dy;
      let hits=this.bodies.filter(b=>!b.dead&&distance(b,ax,ay,bx,by)<=b.r+brush&&(initial||Math.hypot(b.x-ax,b.y-ay)>b.r+brush));
      hits.sort((a,b)=>initial?Math.hypot(a.x-bx,a.y-by)-Math.hypot(b.x-bx,b.y-by):((a.x-ax)*dx+(a.y-ay)*dy-((b.x-ax)*dx+(b.y-ay)*dy))/Math.max(1,length));
      if(initial)hits=hits.slice(0,1);
      if(!hits.length)return;
      this.emit('touch',{fromX:ax,fromY:ay,x:bx,y:by,radius:brush,hits:hits.length,fast:this.fast});
      for(const b of hits){
        if(b.dead)continue;
        if(b.bomb){this.explode([b]);continue;}
        const slot=b.col+':'+b.row;
        if(this.chainColor===null){this.connect(b);continue;}
        if(b.color===this.chainColor&&this.visited.has(slot))continue;
        if(b.color===this.chainColor&&this.anchor&&Math.hypot(b.x-this.anchor.x,b.y-this.anchor.y)<=this.bridge){
          if(!this.visited.has(slot))this.connect(b);
          continue;
        }
        // One foreign color is passed over; two neighboring matches express a new choice.
        if(this.pivot&&!this.pivot.dead&&this.pivot.id!==b.id&&this.pivot.color===b.color&&Math.hypot(b.x-this.pivot.x,b.y-this.pivot.y)<=LINK){
          const first=this.pivot;this.chainColor=null;this.chainCount=0;this.combo=0;this.anchor=null;this.trace=[];this.bridge=LINK;this.visited.clear();this.pivot=null;
          this.emit('switch',{color:b.color});this.connect(first);this.connect(b);
        }else this.pivot=b;
      }
    }
    connect(b){
      if(b.dead)return;
      this.chainColor=b.color;this.anchor={x:b.x,y:b.y};this.bridge=LINK;this.pivot=null;this.visited.add(b.col+':'+b.row);
      this.trace.push({...this.anchor});if(this.trace.length>48)this.trace.shift();this.chainCount++;
      this.emit('connect',{x:b.x,y:b.y,color:b.color,count:this.chainCount});
      if(this.chainCount%7===0){b.rewardPower=Math.min(152,112+(this.chainCount/7-1)*20);this.emit('bomb-earned',{x:b.x,y:b.y,power:b.rewardPower,count:this.chainCount});}
      this.explode([b],b.id);
    }
    explode(hits,directId=null){
      const queue=[...hits],seen=new Set();
      for(let i=0;i<queue.length;i++){
        const b=queue[i];if(b.dead||seen.has(b.id))continue;seen.add(b.id);this.pop(b,b.id===directId);
        if(b.bomb){if(this.chainColor!==null){this.anchor={x:b.x,y:b.y};this.bridge=b.power+63;}this.emit('bomb',{x:b.x,y:b.y,radius:b.power});for(const c of this.bodies)if(!c.dead&&!seen.has(c.id)&&Math.hypot(c.x-b.x,c.y-b.y)<=b.power+c.r*.5)queue.push(c);}
      }
    }
    pop(b,direct=false){
      if(b.dead)return;b.dead=true;b.refillAt=this.time+.12;this.popped++;this.lastPop=this.time;
      let points=5;
      if(direct){
        const n=this.chainCount,total=chainValue(n),previous=chainValue(n-1);
        points=(total-previous)*(this.fever?2:1);this.combo=n;this.maxCombo=Math.max(this.maxCombo,n);
      }
      this.score+=points;
      this.emit('pop',{id:b.id,x:b.x,y:b.y,r:b.r,reach:b.bomb?b.power:25,color:b.color,bomb:b.bomb,combo:this.combo,points,score:this.score,fast:this.fast,direct});
      if(direct){
        this.feverProgress+=this.chainCount===3?3:this.chainCount>3?1:0;
        if(this.feverProgress>=21){this.feverProgress-=21;this.feverUntil=this.time+4;this.emit('fever');}
      }
    }
    update(dt){
      if(this.phase!=='running'||!Number.isFinite(dt)||dt<=0)return;
      this.time=Math.min(this.duration,this.time+dt);this.remaining=Math.max(0,this.duration-this.time);
      if(this.remaining<=1e-9){this.remaining=0;this.phase='result';this.active=false;this.emit('finish',{score:this.score,popped:this.popped,maxCombo:this.maxCombo});return;}
      this.bodies=this.bodies.map(b=>{
        if(!b.dead||this.time<b.refillAt)return b;
        const bomb=!!b.rewardPower,power=b.rewardPower||82;
        const next=this.make(b.col,b.row,{bomb,power});
        if(bomb)this.emit('created',{x:next.x,y:next.y,power});
        return next;
      });
    }
  }
  RapidRun.TOUCH=TOUCH;RapidRun.LINK=LINK;root.RapidRun=RapidRun;
})(typeof globalThis!=='undefined'?globalThis:window);

</script>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');
  const motion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
  const palette=['#83f5cc','#c3a1ff','#ff9bbd','#ffe08e'],colorNames=['ミント','むらさき','ピンク','きいろ'];

  function newWave(){

    $('burst').textContent='もう一度、15秒！';$('gesture-prompt').textContent='触れた瞬間、15秒スタート';$('instruction').textContent='長くつなぐほど高得点。別色2つで自動切替。';$('arena').classList.remove('fever');$('shout').classList.remove('show','finished');$('tap-hint').hidden=true;$('new-board').textContent='記録をコピー';

  function resize(){

  function prepareAudio(force=false){

  $('sound').onclick=()=>{sound=!sound;renderSound();try{const s=JSON.parse(localStorage.getItem('chain-forge-v1'))||{};localStorage.setItem('chain-forge-v1',JSON.stringify({...s,sound}));}catch{}if(sound){prepareAudio(true);initAudio();tone(660,.1);}else if(audio)audio.suspend().catch(()=>{});};
  function ring(x,y,r,color,life=.45,width=3){rings.push({x,y,r,color,life,max:life,width});}
  function bits(x,y,color,count,big=false){

      const a=Math.random()*Math.PI*2,v=(big?140:65)+Math.random()*(big?220:145),life=.3+Math.random()*.3;

  }
  function shout(text,finished=false){
    const el=$('shout');el.textContent=text;el.classList.remove('show','finished');if(finished)el.classList.add('finished');el.classList.add('show');shoutUntil=now+.85;
  }
  function handleEvents(){
    const events=world.drain();let hits=0;
    for(const e of events){
      if(e.type==='begin'){shout('GO!');$('instruction').textContent='指を離さず次の色へ。同色を長くつないで強ボム！';}
      if(e.type==='bomb-earned'){shout(e.count+' CHAIN → POWER!');ring(e.x,e.y,48,'#ffe9a1',.25,3);}
      if(e.type==='created'){ring(e.x,e.y,40,'#ffe9a1',.3,3);}

  function startStroke(x,y){

  }
  function point(e){const r=canvas.getBoundingClientRect(),s=Math.min(r.width/360,r.height/500),px=(r.width-360*s)/2,py=(r.height-500*s)/2;return{x:(e.clientX-r.left-px)/s,y:(e.clientY-r.top-py)/s};}
  function cancelPointer(e){

  $('burst').onclick=()=>{if(run.phase==='result')newWave();};
  $('new-board').onclick=async()=>{
    const text='一筆で、大連鎖。15秒で '+run.score.toLocaleString('ja-JP')+'点！ 最大'+run.maxCombo+' CHAIN https://meyonze.github.io/game/chain-forge-feel.html?v=11';

  };
  function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
  function jelly(b){
    const color=palette[b.color],r=b.r,age=Math.max(0,run.time-b.spawnAt),birth=motion?1:Math.min(1,.65+age*3),wiggle=motion?0:Math.sin(now*2+b.id)*.025;

  function drawEffects(dt){

  }

  function frame(time){

  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){advanceGame();cancelPointer({type:'pointercancel'});cancelAnimationFrame(raf);raf=0;last=0;if(audio)audio.suspend().catch(()=>{});}else if(!raf){last=0;raf=requestAnimationFrame(frame);}});
  window.addEventListener('resize',resize);
  renderSound();resize();newWave();raf=requestAnimationFrame(frame);
})();
