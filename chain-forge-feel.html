<script>
(function(root){
  'use strict';
  const COLS=9,ROWS=12,R=18.6,LINK=46;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function position(col,row){return{x:29+col*37.75+(row%2?9.4:-9.4),y:86+row*35};}
  function along(b,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((b.x-ax)*dx+(b.y-ay)*dy)/l,0,1):0;return{b,t,d:Math.hypot(b.x-ax-t*dx,b.y-ay-t*dy)};}
  class DenseRun{
    constructor({seed=107,moves=8,goal=100}={}){
      this.seed=seed>>>0||1;this.initialSeed=this.seed;this.width=360;this.height=500;this.count=COLS*ROWS;this.world=this;
      this.phase='ready';this.moves=moves;this.maxMoves=moves;this.goal=goal;this.combo=0;this.turn=0;this.time=0;this.bodies=[];this.events=[];this.selected=[];this.nextId=0;this.quiet=0;this.lastChain=0;this.bombAt=null;
      for(let col=0;col<COLS;col++)for(let row=0;row<ROWS;row++)this.bodies.push(this.make(col,row));
      this.ensureMove();
    }
    random(){let n=this.seed;n^=n<<13;n^=n>>>17;n^=n<<5;this.seed=n>>>0;return this.seed/4294967296;}
    emit(type,data={}){this.events.push({type,...data});}
    drain(){const events=this.events;this.events=[];return events;}
    make(col,row,extra={}){const p=position(col,row);return{id:this.nextId++,col,row,...p,r:R,color:Math.floor(this.random()*4),angle:(this.random()-.5)*.15,vx:0,vy:0,fuse:null,dead:false,bomb:false,drawY:p.y,...extra};}
    get path(){return this.selected.map(id=>this.bodies.find(b=>b.id===id)).filter(Boolean);}
    get success(){return this.combo>=this.goal;}
    nearest(x,y){return this.bodies.filter(b=>!b.dead&&Math.hypot(b.x-x,b.y-y)<=b.r+3).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];}
    start(x,y){
      if(this.phase!=='ready'||![x,y].every(Number.isFinite))return false;
      const b=this.nearest(x,y);if(!b)return false;
      this.phase='drawing';this.selected=[b.id];this.color=b.color;this.last={x,y};this.emit('select',{x:b.x,y:b.y,count:1,color:b.color,bomb:b.bomb});return true;
    }
    pick(b){
      const path=this.path,last=path.at(-1);if(!last||last.bomb||b.bomb||b.dead)return;
      if(path.length>1&&b.id===path.at(-2).id){this.selected.pop();this.emit('select',{x:b.x,y:b.y,count:this.selected.length,color:this.color});return;}
      if(this.selected.includes(b.id)||b.color!==this.color||Math.hypot(b.x-last.x,b.y-last.y)>LINK)return;
      this.selected.push(b.id);this.emit('select',{x:b.x,y:b.y,count:this.selected.length,color:this.color});
    }
    move(x,y){
      if(this.phase!=='drawing'||![x,y].every(Number.isFinite))return false;
      const a=this.last;this.last={x,y};
      this.bodies.map(b=>along(b,a.x,a.y,x,y)).filter(h=>!h.b.dead&&h.d<=R*.72).sort((a,b)=>a.t-b.t).forEach(h=>this.pick(h.b));return true;
    }
    end(reason='release'){
      if(this.phase!=='drawing')return false;const path=this.path;
      if(reason==='cancel'||(!path[0].bomb&&path.length<3)){this.selected=[];this.phase='ready';this.emit('invalid',{cancel:reason==='cancel'});return false;}
      this.phase='resolving';this.moves--;this.turn++;this.lastChain=path.length;this.turnScore=0;this.quiet=0;
      if(path[0].bomb){this.queue(path[0],0);this.emit('detonate',{x:path[0].x,y:path[0].y});}
      else{
        path.forEach((b,i)=>this.queue(b,i*.035));
        if(path.length>=7){const b=path.at(-1);this.bombAt={col:b.col,row:b.row,color:b.color,power:Math.min(100,66+path.length*2)};}
        this.emit('chain',{count:path.length,bomb:!!this.bombAt});
      }
      this.selected=[];return true;
    }
    queue(b,delay){if(b.dead)return;if(b.fuse===null||b.fuse>delay)b.fuse=delay;}
    pop(b){
      if(b.dead)return;b.dead=true;b.fuse=null;this.combo++;this.turnScore++;
      const reach=b.bomb?b.power:24;
      this.emit('pop',{id:b.id,x:b.x,y:b.y,r:b.r,reach,color:b.color,combo:this.combo,bomb:b.bomb,final:false});
      if(b.bomb){this.emit('bomb',{x:b.x,y:b.y,radius:reach});for(const c of this.bodies)if(!c.dead&&Math.hypot(c.x-b.x,c.y-b.y)<=reach+c.r*.5)this.queue(c,.05+Math.hypot(c.x-b.x,c.y-b.y)*.001);}
    }
    settle(){
      if(this.bombAt){const b=this.make(this.bombAt.col,this.bombAt.row,{...this.bombAt,bomb:true});this.bodies.push(b);this.emit('created',{x:b.x,y:b.y});this.bombAt=null;}
      const next=[];
      for(let col=0;col<COLS;col++){
        const live=this.bodies.filter(b=>b.col===col&&!b.dead).sort((a,b)=>b.row-a.row);let row=ROWS-1;
        for(const b of live){b.row=row;const p=position(col,row--);b.drawY=b.y;b.x=p.x;b.y=p.y;next.push(b);}
        while(row>=0){const b=this.make(col,row,{drawY:35-(ROWS-row)*36});next.push(b);row--;}
      }
      this.bodies=next;this.ensureMove();this.phase='falling';this.fallTime=.4;
    }
    findChain(min=3){
      const visit=(path)=>{if(path.length>=min)return path;const last=path.at(-1);for(const b of this.bodies){if(!b.dead&&!b.bomb&&b.color===last.color&&!path.includes(b)&&Math.hypot(b.x-last.x,b.y-last.y)<=LINK){const found=visit([...path,b]);if(found)return found;}}return null;};
      for(const b of this.bodies)if(!b.dead&&!b.bomb){const found=visit([b]);if(found)return found;}return null;
    }
    ensureMove(){
      if(this.findChain(3)||this.bodies.some(b=>b.bomb&&!b.dead))return;
      const row=ROWS-1,bodies=this.bodies.filter(b=>b.row===row).sort((a,b)=>a.col-b.col);bodies.slice(0,3).forEach(b=>b.color=bodies[0].color);this.emit('rescue');
    }
    update(dt){
      if(!Number.isFinite(dt)||dt<=0)return;dt=Math.min(dt,.05);this.time+=dt;
      if(this.phase==='falling'){this.fallTime-=dt;if(this.fallTime<=0){this.phase=this.moves>0?'ready':'result';this.emit('settled',{score:this.turnScore,moves:this.moves});}return;}
      if(this.phase!=='resolving')return;
      for(const b of this.bodies)if(!b.dead&&b.fuse!==null){b.fuse-=dt;if(b.fuse<=0)this.pop(b);}
      if(this.bodies.some(b=>!b.dead&&b.fuse!==null))this.quiet=0;else this.quiet+=dt;
      if(this.quiet>=.22)this.settle();
    }
  }
  DenseRun.COLS=COLS;DenseRun.ROWS=ROWS;DenseRun.LINK=LINK;root.DenseRun=DenseRun;
})(typeof globalThis!=='undefined'?globalThis:window);

</script>
<script>

    if(run.phase==='drawing'){
      const n=run.selected.length,b=run.path[0];$('gesture-prompt').textContent=b?.bomb?'離して、ボム起爆！':n+' CHAIN'+(n>=7?' — 離すとボム！':n>=3?' — 離すと弾ける！':' — 同じ色をあと'+(3-n)+'体');
      $('instruction').textContent=b?.bomb?'点線の範囲を、まとめて吹き飛ばす。':'同じ色をつなごう。ひとつ戻ると取り消せる。';
    }
    if(run.phase==='resolving'||run.phase==='falling'){$('gesture-prompt').textContent='POP! POP! POP!';$('instruction').textContent='消えた場所へ、次のキャラが落ちてくる。';}
  }
  function newWave(fresh=true){
    if(fresh)boardSeed++;run=new DenseRun({seed:boardSeed});world=run;scored=false;keyboardDrawing=false;keyboardAim=false;persistBoard();
    particles=[];rings=[];sparks=[];strokes=[];hold=0;shake=0;pointer=null;aim={x:180,y:worldHeight/2,until:Infinity};
    $('announcer').textContent='';$('board-name').textContent='つないで、弾け！';$('combo').textContent='0';$('combo-caption').textContent='8手で100匹 / BEST '+boardBest;
    $('burst').textContent='同じ盤面でもう一度';$('gesture-prompt').textContent='同じ色を3体つないで、離そう';$('instruction').textContent='7体以上でボム誕生。ボムはタップで大爆発。';$('arena').classList.remove('fever');$('shout').classList.remove('show','finished');$('tap-hint').hidden=true;
    ambient=Array.from({length:22},()=>({x:Math.random()*360,y:Math.random()*worldHeight,r:.5+Math.random()*1.3,phase:Math.random()*6.3}));renderRun();
  }
  function finishRun(){
    if(scored)return;scored=true;boardBest=Math.max(boardBest,world.combo);persistBoard();
    $('combo-caption').textContent='8手終了 / BEST '+boardBest;
    $('instruction').textContent=run.success?'100匹達成！ 次はボムを誘爆させよう。':'あと'+(run.goal-world.combo)+'匹。7つつないでボムを作ろう。';
    shout(run.success?'CLEAR!':world.combo+' POP!',!run.success);
    $('announcer').textContent=world.combo+'匹。'+(run.success?'目標達成。':'目標まであと'+(run.goal-world.combo)+'匹。')+'同じ盤面で再挑戦できます。';renderRun();
  }
  function resize(){
    const rect=canvas.getBoundingClientRect();pixelWidth=rect.width||360;pixelHeight=rect.height||500;worldHeight=500;
    const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(pixelWidth*dpr);canvas.height=Math.round(pixelHeight*dpr);scale=Math.min(canvas.width/360,canvas.height/500);offsetX=(canvas.width-360*scale)/2;offsetY=(canvas.height-500*scale)/2;
    if(world)cancelPointer({type:'pointercancel'});
  }
  function initAudio(){
    if(!sound)return;
    try{
      if(!audio){
        audio=new(window.AudioContext||window.webkitAudioContext)();const compressor=audio.createDynamicsCompressor();audioBus=audio.createGain();audioBus.gain.value=.65;audioBus.connect(compressor);compressor.connect(audio.destination);

      }
      if(audio.state==='suspended')audio.resume().catch(()=>{});
    }catch{audio=null;}
  }
  function tone(freq,duration=.12,volume=.07,type='sine',delay=0){

    const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.82,t+duration);
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioBus);o.start(t);o.stop(t+duration+.02);
  }
  function boom(big=false){
    if(!sound||!audio||now-lastBoom<.075)return;lastBoom=now;
    try{const n=audio.createBufferSource(),g=audio.createGain(),t=audio.currentTime;n.buffer=noise;g.gain.setValueAtTime(big?.25:.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);n.connect(g);g.connect(audioBus);n.start(t);n.stop(t+.22);tone(big?90:150,.22,.2,'triangle');}catch{}
  }
  function popSound(combo){

    try{const notes=[0,3,5,7,10,12],i=Math.floor(combo/2),f=220*Math.pow(2,(notes[i%6]+Math.min(2,Math.floor(combo/24))*12)/12);tone(f,.105,.085);tone(f*2,.065,.022,'triangle');}catch{}
  }
  function renderSound(){
    $('sound').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-5 4H3v8h3l5 4z"/>'+ (sound?'<path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>':'<path d="m16 9 6 6m0-6-6 6"/>')+'</svg>';
    $('sound').setAttribute('aria-label',sound?'音をオフにする':'音をオンにする');$('sound').setAttribute('aria-pressed',String(sound));
  }
  $('sound').onclick=()=>{sound=!sound;renderSound();try{const s=JSON.parse(localStorage.getItem('chain-forge-v1'))||{};localStorage.setItem('chain-forge-v1',JSON.stringify({...s,sound}));}catch{}if(sound){initAudio();tone(660,.1);}else if(audio)audio.suspend().catch(()=>{});};
  function ring(x,y,r,color,life=.45,width=3){rings.push({x,y,r,color,life,max:life,width});}
  function bits(x,y,color,count,big=false){
    const n=motion?Math.min(3,count):count;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,v=(big?140:65)+Math.random()*(big?220:145),life=.3+Math.random()*.3;
      particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,color,r:1.5+Math.random()*3.5,life,max:life,angle:a,spin:(Math.random()-.5)*12,kind:i%4===0?'star':'shard'});
    }
    if(!motion)for(let i=0;i<2;i++)particles.push({x,y,sx:x,sy:y,color:'#ffdf8c',r:2.2,life:.5+i*.07,max:.5+i*.07,kind:'reward',bend:(Math.random()-.5)*100});
    if(particles.length>420)particles.splice(0,particles.length-420);
  }
  function shout(text,finished=false){
    const el=$('shout');el.textContent=text;el.classList.remove('show','finished');if(finished)el.classList.add('finished');void el.offsetWidth;el.classList.add('show');shoutUntil=now+.85;
  }
  function handleEvents(){
    for(const e of world.drain()){
      if(e.type==='select'){
        ring(e.x,e.y,24,palette[e.color],.18,2);if(e.count>1)popSound(e.count*2);
        if(e.count===7){shout('BOMB READY!');tone(880,.13,.07,'triangle');}
      }
      if(e.type==='invalid'&&!e.cancel){$('gesture-prompt').textContent='3体から弾けるよ。手数は減らない。';$('instruction').textContent='同じ色を3体以上、隣どうしでつなごう。';}
      if(e.type==='chain'){if(e.count>=7)shout(e.count+' CHAIN!');$('combo-caption').textContent=e.count+'体を連続で弾く！';}
      if(e.type==='created'){ring(e.x,e.y,50,'#ffe7a3',.5,4);$('combo-caption').textContent='ボム誕生！ タップで周りも弾ける';}
      if(e.type==='bomb'){ring(e.x,e.y,e.radius,'#ffe7a3',.6,6);boom(true);shout('B O O M !');if(!motion){hold=.055;shake=5;}}
      if(e.type==='pop'){
        const color=palette[e.color];bits(e.x,e.y,color,e.bomb?24:10,e.bomb);ring(e.x,e.y,e.reach,color,e.bomb?.6:.3,e.bomb?6:2);ring(e.x,e.y,e.r*1.7,'#fff2d8',.16,1);
        $('combo').textContent=String(e.combo);$('combo').classList.remove('bump');void $('combo').offsetWidth;$('combo').classList.add('bump');popSound(e.combo);if(!motion)shake=Math.max(shake,1.1);
        if(e.combo===run.goal){shout('GOAL!');$('arena').classList.add('fever');}
      }
      if(e.type==='settled'&&run.phase!=='result'){
        $('gesture-prompt').textContent='同じ色を3体以上、つなごう';$('instruction').textContent='7体以上でボム。ボム同士は誘爆する。';
        $('combo-caption').textContent='今の一手 +'+e.score+' / 目標まで '+Math.max(0,run.goal-run.combo)+'匹';
        $('announcer').textContent='今の一手で'+e.score+'匹。残り'+run.moves+'手。';
      }
    }
  }
  function react(){handleEvents();$('tap-hint').hidden=true;renderRun();}
  function startStroke(x,y){
    if(run.phase!=='ready')return false;initAudio();if(!run.start(x,y))return false;aim={x,y,until:Infinity};react();return true;
  }
  function moveStroke(x,y){
    if(run.phase!=='drawing')return;run.move(x,y);aim={...run.last,until:Infinity};react();if(run.phase!=='drawing')cancelPointer();
  }
  function point(e){const r=canvas.getBoundingClientRect(),s=Math.min(r.width/360,r.height/500),px=(r.width-360*s)/2,py=(r.height-500*s)/2;return{x:(e.clientX-r.left-px)/s,y:(e.clientY-r.top-py)/s};}
  function cancelPointer(e){
    if(e?.pointerId!==undefined&&pointer&&e.pointerId!==pointer.id)return;
    const id=pointer?.id;pointer=null;keyboardDrawing=false;run?.end(['pointercancel','lostpointercapture','blur'].includes(e?.type)?'cancel':'release');
    if(id!==undefined)try{canvas.releasePointerCapture?.(id);}catch{}
  }
  canvas.addEventListener('pointerdown',e=>{
    if(e.isPrimary===false||pointer||run.phase!=='ready'||(typeof e.button==='number'&&e.button!==0))return;e.preventDefault();
    const p=point(e);keyboardAim=false;if(!startStroke(p.x,p.y))return;pointer={id:e.pointerId,...p};try{canvas.setPointerCapture?.(e.pointerId);}catch{}
  });
  canvas.addEventListener('pointermove',e=>{
    const p=point(e);if(!pointer){if(e.pointerType!=='touch'&&run.phase==='ready')aim={...p,until:Infinity};return;}
    if(e.pointerId!==pointer.id)return;e.preventDefault();moveStroke(p.x,p.y);if(pointer)pointer={...pointer,x:run.last.x,y:run.last.y};
  });
  function endPointer(e){
    if(!pointer||e.pointerId!==pointer.id)return;
    if(e.type!=='pointercancel'&&e.type!=='lostpointercapture'&&run.phase==='drawing'){const p=point(e);moveStroke(p.x,p.y);}
    cancelPointer(e);react();
  }
  canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',e=>{cancelPointer(e);react();});canvas.addEventListener('lostpointercapture',e=>{cancelPointer(e);react();});window.addEventListener('blur',()=>{cancelPointer({type:'blur'});react();});
  canvas.addEventListener('keydown',e=>{
    const vectors={ArrowLeft:[-18,0],ArrowRight:[18,0],ArrowUp:[0,-18],ArrowDown:[0,18]};
    if(vectors[e.key]){e.preventDefault();keyboardAim=true;const[dx,dy]=vectors[e.key],x=clamp(aim.x+dx,0,360),y=clamp(aim.y+dy,0,worldHeight);if(keyboardDrawing)moveStroke(x,y);else if(run.phase==='ready')aim={x,y,until:Infinity};}
    if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();if(run.phase==='ready'){keyboardDrawing=startStroke(aim.x,aim.y);}else if(keyboardDrawing&&e.key==='Enter'){cancelPointer();renderRun();}}

  });
  canvas.addEventListener('keyup',e=>{if(e.key===' '&&keyboardDrawing){e.preventDefault();cancelPointer();renderRun();}});
  $('burst').onclick=()=>{if(run.phase==='result')newWave(false);};$('new-board').onclick=()=>{if(run.phase==='ready'||run.phase==='result')newWave(true);};
  function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
  function jelly(b){
    const hot=b.fuse!==null,speed=Math.hypot(b.vx,b.vy),stretch=motion?0:Math.min(.17,speed/1800),pulse=hot&&!motion?1+Math.sin(now*28+b.id)*.055:1;
    const color=hot?'#ffc879':palette[b.color],r=b.r,wiggle=motion?0:Math.sin(now*2+b.id)*.025;

    if(speed>100&&!motion){ctx.globalAlpha=.13;ctx.beginPath();ctx.moveTo(-b.vx*.025,-b.vy*.025);ctx.lineTo(0,0);ctx.strokeStyle=color;ctx.lineWidth=r*1.2;ctx.lineCap='round';ctx.stroke();ctx.globalAlpha=1;}
    if(b.bomb){
      circle(0,0,r+3,'#f9cb78');circle(0,0,r,'#4c395f');ctx.fillStyle='#fff0ad';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('ϟ',0,8);ctx.restore();return;

    else{ctx.fillStyle='#292b49';ctx.beginPath();ctx.ellipse(-ex,ey,1.65,2.4,0,0,Math.PI*2);ctx.ellipse(ex,ey,1.65,2.4,0,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#33365066';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText(['●','◆','♥','★'][b.color],0,-r*.48);
    ctx.strokeStyle=hot?'#77404a':'#3b4058';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(0,r*.2,r*.17,0,Math.PI);ctx.stroke();

  }
  function drawEffects(dt){
    for(const s of strokes){s.life-=dt;if(s.life<=0)continue;ctx.globalAlpha=s.life/s.max*.12;ctx.beginPath();ctx.moveTo(s.ax,s.ay);ctx.lineTo(s.bx,s.by);ctx.lineWidth=s.r*2;ctx.lineCap='round';ctx.strokeStyle='#ffe4a1';ctx.stroke();}strokes=strokes.filter(s=>s.life>0);ctx.globalAlpha=1;
    for(const p of particles){
      p.life-=dt;if(p.life<=0)continue;const t=1-p.life/p.max;ctx.globalAlpha=Math.min(1,p.life*5);

        const endX=180,endY=32,curve=Math.sin(t*Math.PI);p.x=p.sx+(endX-p.sx)*t+p.bend*curve;p.y=p.sy+(endY-p.sy)*t-curve*55;
        ctx.beginPath();ctx.moveTo(p.x-(endX-p.sx)*.035,p.y-(endY-p.sy)*.035);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#ffe5a8';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();circle(p.x,p.y,p.r,'#fff0b7');

        if(!motion){p.vy+=140*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*2);p.angle+=p.spin*dt;}
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;const r=p.r*(1-t*.6);

  }
  function draw(dt){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,offsetX,offsetY);ctx.save();ctx.beginPath();ctx.rect(0,0,360,500);ctx.clip();
    if(shake>.05&&!motion){ctx.translate(Math.sin(now*145)*shake,Math.cos(now*119)*shake*.6);shake*=Math.exp(-dt*17);}
    for(const a of ambient){ctx.globalAlpha=.12+Math.sin(now*.8+a.phase)*.08;circle(a.x,a.y,a.r,'#c6caff');}ctx.globalAlpha=1;
    const path=run.path,tail=path.at(-1);

      const selected=run.selected.includes(b.id),eligible=tail&&!b.bomb&&b.color===run.color&&Math.hypot(b.x-tail.x,b.y-tail.y)<=DenseRun.LINK&&!selected;
      ctx.globalAlpha=run.phase==='drawing'&&!selected&&!eligible ? .32 : 1;jelly(b);ctx.globalAlpha=1;
      if(selected||eligible){ctx.strokeStyle=selected?'#fff5c4':palette[b.color];ctx.lineWidth=selected?3:2;ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,Math.PI*2);ctx.stroke();}

      ctx.save();ctx.strokeStyle=palette[run.color];ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.strokeStyle='#fff5d8';ctx.lineWidth=2;ctx.stroke();
      if(path[0].bomb){ctx.strokeStyle='#ffe5a1';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(path[0].x,path[0].y,path[0].power,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
      else{ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff5d8';ctx.fillText(String(path.length),tail.x,tail.y-28);}
      ctx.restore();

    if(keyboardAim&&(run.phase==='ready'||run.phase==='drawing')){ctx.save();ctx.strokeStyle='#fff0b8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(aim.x,aim.y,23,0,Math.PI*2);ctx.stroke();ctx.restore();}
  }

  function frame(time){
    if(document.hidden){last=0;raf=0;return;}
    const dt=last?clamp((time-last)/1000,0,.05):1/60;last=time;now=time/1000;
    let step=dt;if(hold>0&&!motion){const part=Math.min(hold,dt);hold-=part;step=dt-part+part*.12;}
    run.update(step);handleEvents();if(run.phase!=='drawing'&&pointer)cancelPointer();if(run.phase==='result')finishRun();renderRun();draw(dt);
    if(shoutUntil&&now>=shoutUntil){$('shout').classList.remove('show');shoutUntil=0;}
    raf=requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelPointer({type:'pointercancel'});cancelAnimationFrame(raf);raf=0;last=0;if(audio)audio.suspend().catch(()=>{});}else if(!raf){last=0;raf=requestAnimationFrame(frame);}});
  window.addEventListener('resize',resize);
  renderSound();resize();newWave(false);raf=requestAnimationFrame(frame);
})();

</script>
