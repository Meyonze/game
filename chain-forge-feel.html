<script>
(function(root){
  'use strict';
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const TOUCH_RADIUS=20;
  function segmentDistance(x,y,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,length=dx*dx+dy*dy,t=length?clamp(((x-ax)*dx+(y-ay)*dy)/length,0,1):0;return Math.hypot(x-ax-t*dx,y-ay-t*dy);}
  class BlastWorld{
    constructor({width=360,height=500,count=80,seed=1}={}){
      this.width=width;this.height=height;this.seed=seed>>>0||1;this.state='ready';this.combo=0;this.time=0;this.events=[];this.accumulator=0;
      this.count=clamp(Math.round(count),12,110);this.bodies=[];
      const cols=9,rows=Math.ceil(this.count/cols),sx=(width-64)/(cols-1),sy=Math.min(37,(height-125)/Math.max(1,rows-1));
      const top=85+(height-110-(rows-1)*sy)/2;
      for(let i=0;i<this.count;i++){
        const row=Math.floor(i/cols),col=i%cols,r=Math.min(13,sy*.39)*( .82+this.random()*.25);
        const x=32+col*sx+(row%2?4:-4)+(this.random()-.5)*8,y=top+row*sy+(this.random()-.5)*8;
        this.bodies.push({id:i,x,y,ax:x,ay:y,r,vx:(this.random()-.5)*12,vy:(this.random()-.5)*12,fuse:null,dead:false,color:Math.floor(this.random()*4),angle:(this.random()-.5)*.22,spin:0,wallAt:-1});
      }
    }
    random(){let x=this.seed;x^=x<<13;x^=x>>>17;x^=x<<5;this.seed=x>>>0;return this.seed/4294967296;}
    emit(type,data){this.events.push({type,...data});}
    drain(){const e=this.events;this.events=[];return e;}
    ignite(b,delay=.16,from=null){
      if(b.dead)return false;
      if(b.fuse!==null){b.fuse=Math.min(b.fuse,delay);return false;}
      b.fuse=delay;this.emit('ignite',{id:b.id,x:b.x,y:b.y,from});return true;
    }
    blast(x,y){
      if(!Number.isFinite(x)||!Number.isFinite(y)||x<0||x>this.width||y<0||y>this.height)return false;
      return this.stroke(x,y,x,y);
    }
    stroke(ax,ay,bx,by){
      if(![ax,ay,bx,by].every(Number.isFinite)||this.state==='clear')return false;
      const hits=this.bodies.filter(b=>!b.dead&&segmentDistance(b.x,b.y,ax,ay,bx,by)<=TOUCH_RADIUS+b.r);
      this.emit('touch',{x:bx,y:by,fromX:ax,fromY:ay,radius:TOUCH_RADIUS,hits:hits.length});
      if(!hits.length)return true;
      this.state='chain';
      // Resolve every directly touched target now, before any neighboring blast moves it.
      for(const b of hits)this.pop(b,true);
      return true;
    }
    pop(b,direct=false){
      if(b.dead)return;b.dead=true;b.fuse=null;this.combo++;
      const reach=b.r+12;
      this.emit('pop',{id:b.id,x:b.x,y:b.y,r:b.r,reach,color:b.color,combo:this.combo,direct,final:this.combo===this.count});
      for(const c of this.bodies){
        if(c.dead)continue;const dx=c.x-b.x,dy=c.y-b.y,d=Math.hypot(dx,dy);
        if(d<=reach+c.r)this.ignite(c,.075+Math.min(.035,d*.001),{x:b.x,y:b.y});
        if(d<65){const a=d>.01?Math.atan2(dy,dx):this.random()*Math.PI*2,force=(1-d/70)*65;c.vx+=Math.cos(a)*force;c.vy+=Math.sin(a)*force;c.spin+=(this.random()-.5)*1.8;}
      }
    }
    resize(height){
      if(!Number.isFinite(height)||height<160)return;
      const ratio=height/this.height;this.height=height;
      for(const b of this.bodies){b.y=clamp(b.y*ratio,b.r,height-b.r);b.ay=clamp(b.ay*ratio,b.r,height-b.r);}
    }
    update(delta){
      if(!Number.isFinite(delta)||delta<=0)return;
      this.accumulator+=Math.min(delta,.05);
      while(this.accumulator>=1/120){this.step(1/120);this.accumulator-=1/120;}
    }
    step(dt){
      this.time+=dt;
      for(const b of this.bodies){
        if(b.dead)continue;
        if(b.fuse!==null){b.fuse-=dt;if(b.fuse<=0){this.pop(b);continue;}}
        const idle=b.fuse===null;
        if(idle){b.vx+=((b.ax-b.x)*1.1+Math.sin(this.time*1.5+b.id)*3)*dt;b.vy+=((b.ay-b.y)*1.1+Math.cos(this.time*1.4+b.id)*3)*dt;}
        const drag=Math.exp(-(idle?1.8:1.35)*dt);b.vx=clamp(b.vx*drag,-620,620);b.vy=clamp(b.vy*drag,-620,620);
        b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.spin*dt;b.spin*=Math.exp(-dt*2);
        let hit=false;
        if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.78;hit=true;}if(b.x>this.width-b.r){b.x=this.width-b.r;b.vx=-Math.abs(b.vx)*.78;hit=true;}
        if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.78;hit=true;}if(b.y>this.height-b.r){b.y=this.height-b.r;b.vy=-Math.abs(b.vy)*.78;hit=true;}
        if(hit&&Math.hypot(b.vx,b.vy)>160&&this.time-b.wallAt>.14){b.wallAt=this.time;this.emit('wall',{x:b.x,y:b.y,color:b.color});}
      }
      for(let i=0;i<this.bodies.length;i++){const a=this.bodies[i];if(a.dead)continue;
        for(let j=i+1;j<this.bodies.length;j++){const b=this.bodies[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=min*min)continue;
          const d=Math.sqrt(d2)||.01,nx=d2>.0001?dx/d:1,ny=d2>.0001?dy/d:0,overlap=(min-d)/2;
          a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;
          const speed=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
          if(speed<0){const impulse=-speed*.82;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;}
          if(a.fuse!==null&&b.fuse===null)this.ignite(b,.17+this.random()*.1,{x:a.x,y:a.y});
          else if(b.fuse!==null&&a.fuse===null)this.ignite(a,.17+this.random()*.1,{x:b.x,y:b.y});
        }
      }
      for(const b of this.bodies)if(!b.dead){b.x=clamp(b.x,b.r,this.width-b.r);b.y=clamp(b.y,b.r,this.height-b.r);}
      if(this.state==='chain'){
        const live=this.bodies.filter(b=>!b.dead);
        if(!live.length){this.state='clear';this.emit('clear',{combo:this.combo,time:this.time});}
        else if(!live.some(b=>b.fuse!==null))this.state='ready';
      }
    }
  }
  BlastWorld.TOUCH_RADIUS=TOUCH_RADIUS;
  root.BlastWorld=BlastWorld;
})(typeof globalThis!=='undefined'?globalThis:window);

</script>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');
  const motion=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
  const palette=['#83f5cc','#c3a1ff','#ff9bbd','#ffe08e'];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let sound=true;try{const s=JSON.parse(localStorage.getItem('chain-forge-v1'));if(s?.sound===false)sound=false;}catch{}
  let wave=0,world,worldHeight=500,pixelWidth=360,pixelHeight=500,scale=1,raf=0,last=0,now=0,clearAt=0,hold=0,shake=0,shoutUntil=0;
  let pointer=null,aim={x:180,y:250,until:Infinity},strokes=[];
  let particles=[],rings=[],sparks=[],ambient=[],audio=null,audioBus=null,noise=null,lastNote=-1000,lastBoom=-1000;
  function seed(){return Math.floor(Math.random()*4294967295)||1;}
  function newWave(){
    wave++;world=new BlastWorld({height:worldHeight,count:Math.min(100,Math.max(45,Math.round((68+wave*6)*Math.min(1,worldHeight/470)))),seed:seed()});
    particles=[];rings=[];sparks=[];strokes=[];clearAt=0;hold=0;shake=0;pointer=null;aim={x:180,y:worldHeight/2,until:Infinity};
    $('announcer').textContent='';$('wave').textContent='SWARM '+String(wave).padStart(2,'0');$('combo').textContent='0';$('combo-caption').textContent='指のところから、はじける。';
    $('burst').textContent='ここを弾く';$('instruction').textContent='指を動かしたところが、はじける。';$('arena').classList.remove('fever');$('shout').classList.remove('show','finished');
    ambient=Array.from({length:22},()=>({x:Math.random()*360,y:Math.random()*worldHeight,r:.5+Math.random()*1.3,phase:Math.random()*6.3}));
  }
  function resize(){
    const rect=canvas.getBoundingClientRect();pixelWidth=rect.width||360;pixelHeight=rect.height||500;worldHeight=Math.max(160,pixelHeight/pixelWidth*360);
    const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(pixelWidth*dpr);canvas.height=Math.round(pixelHeight*dpr);scale=canvas.width/360;
    if(world){world.resize(worldHeight);aim.y=Math.min(aim.y,worldHeight);cancelPointer();}
  }
  function initAudio(){
    if(!sound)return;
    try{
      if(!audio){
        audio=new(window.AudioContext||window.webkitAudioContext)();const compressor=audio.createDynamicsCompressor();audioBus=audio.createGain();audioBus.gain.value=.65;audioBus.connect(compressor);compressor.connect(audio.destination);
        noise=audio.createBuffer(1,Math.floor(audio.sampleRate*.22),audio.sampleRate);const data=noise.getChannelData(0);let value=0;for(let i=0;i<data.length;i++){value=(value+(Math.random()*2-1)*.12)/1.05;data[i]=value*3;}
      }
      if(audio.state==='suspended')audio.resume().catch(()=>{});
    }catch{audio=null;}
  }
  function tone(freq,duration=.12,volume=.07,type='sine',delay=0){
    if(!sound||!audio)return;
    const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.82,t+duration);
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioBus);o.start(t);o.stop(t+duration+.02);
  }
  function boom(big=false){
    if(!sound||!audio||now-lastBoom<.075)return;lastBoom=now;
    try{const n=audio.createBufferSource(),g=audio.createGain(),t=audio.currentTime;n.buffer=noise;g.gain.setValueAtTime(big?.25:.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);n.connect(g);g.connect(audioBus);n.start(t);n.stop(t+.22);tone(big?90:150,.22,.2,'triangle');}catch{}
  }
  function popSound(combo){
    if(!sound||!audio||now-lastNote<.045)return;lastNote=now;
    try{const notes=[0,3,5,7,10,12],i=Math.floor(combo/2),f=220*Math.pow(2,(notes[i%6]+Math.min(2,Math.floor(combo/24))*12)/12);tone(f,.105,.085);tone(f*2,.065,.022,'triangle');}catch{}
  }
  function renderSound(){
    $('sound').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 4-5 4H3v8h3l5 4z"/>'+ (sound?'<path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>':'<path d="m16 9 6 6m0-6-6 6"/>')+'</svg>';
    $('sound').setAttribute('aria-label',sound?'音をオフにする':'音をオンにする');$('sound').setAttribute('aria-pressed',String(sound));
  }
  $('sound').onclick=()=>{sound=!sound;renderSound();try{const s=JSON.parse(localStorage.getItem('chain-forge-v1'))||{};localStorage.setItem('chain-forge-v1',JSON.stringify({...s,sound}));}catch{}if(sound){initAudio();tone(660,.1);}else if(audio)audio.suspend().catch(()=>{});};
  function ring(x,y,r,color,life=.45,width=3){rings.push({x,y,r,color,life,max:life,width});}
  function bits(x,y,color,count,big=false){
    const n=motion?Math.min(3,count):count;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,v=(big?140:65)+Math.random()*(big?220:145),life=.3+Math.random()*.3;
      particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,color,r:1.5+Math.random()*3.5,life,max:life,angle:a,spin:(Math.random()-.5)*12,kind:i%4===0?'star':'shard'});
    }
    if(!motion)for(let i=0;i<2;i++)particles.push({x,y,sx:x,sy:y,color:'#ffdf8c',r:2.2,life:.5+i*.07,max:.5+i*.07,kind:'reward',bend:(Math.random()-.5)*100});
    if(particles.length>420)particles.splice(0,particles.length-420);
  }
  function shout(text,finished=false){
    const el=$('shout');el.textContent=text;el.classList.remove('show','finished');if(finished)el.classList.add('finished');void el.offsetWidth;el.classList.add('show');shoutUntil=now+.85;
  }
  function handleEvents(){
    for(const e of world.drain()){
      if(e.type==='touch'){
        const distance=Math.hypot(e.x-e.fromX,e.y-e.fromY);
        if(distance>2){strokes.push({ax:e.fromX,ay:e.fromY,bx:e.x,by:e.y,r:e.radius,life:.18,max:.18});if(strokes.length>48)strokes.shift();}
        if(e.hits){ring(e.x,e.y,e.radius,'#ffe7a3',.2,2);if(!motion)shake=Math.max(shake,Math.min(1.5,.4+e.hits*.15));if(e.hits>=3)boom();}
      }
      if(e.type==='ignite'&&e.from&&!motion){sparks.push({x:e.from.x,y:e.from.y,tx:e.x,ty:e.y,life:.19,max:.19,color:'#ffdb9b'});if(sparks.length>65)sparks.shift();}
      if(e.type==='pop'){
        const color=palette[e.color];bits(e.x,e.y,color,e.final?26:8,e.final);ring(e.x,e.y,e.final?85:e.reach,color,e.final?.75:.35,e.final?6:2);
        ring(e.x,e.y,e.r*1.7,'#fff2d8',.16,1);
        $('combo').textContent=String(e.combo);$('combo').classList.remove('bump');void $('combo').offsetWidth;$('combo').classList.add('bump');popSound(e.combo);
        if(e.combo===15){$('arena').classList.add('fever');$('combo-caption').textContent='いいね、そのまま！';}
        if(e.combo===30||e.combo===60||e.combo===90){shout(e.combo===30?'NICE CHAIN!':e.combo===60?'FEVER!':'UNSTOPPABLE!');boom();if(!motion){hold=Math.max(hold,.045);shake=Math.max(shake,2.6);}}
        if(!motion)shake=Math.max(shake,e.final?5:1.1);
        if(e.final){boom(true);if(!motion)hold=.12;}
      }
      if(e.type==='wall'&&!motion)bits(e.x,e.y,palette[e.color],2);
      if(e.type==='clear'){
        clearAt=now+1.15;pointer=null;shout('全 壊 ！',true);$('burst').textContent='もう一発！';$('instruction').textContent='もう一発、いこう。';$('combo-caption').textContent='気持ちよく、全部はじけた。';$('announcer').textContent=e.combo+'連鎖。全壊！';
        if(sound&&audio){try{for(const [i,f]of [523.25,659.25,783.99,1046.5].entries())tone(f,.38,.06,'sine',i*.045);}catch{}}
      }
    }
  }
  function react(){
    handleEvents();
    $('tap-hint').hidden=true;
    if(world.state!=='clear')$('instruction').textContent='押しても、なぞっても、指のところから。';
  }
  function fire(x,y){
    initAudio();if(world.state==='clear')newWave();
    aim={x,y,until:Infinity};if(world.blast(x,y))react();
  }
  function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*360,y:(e.clientY-r.top)/r.height*worldHeight};}
  function cancelPointer(e){if(!pointer||(e?.pointerId!==undefined&&e.pointerId!==pointer.id))return;const id=pointer.id;pointer=null;try{canvas.releasePointerCapture?.(id);}catch{}}
  canvas.addEventListener('pointerdown',e=>{
    if(e.isPrimary===false||pointer||(typeof e.button==='number'&&e.button!==0))return;e.preventDefault();
    const p=point(e);fire(p.x,p.y);pointer={id:e.pointerId,...p};try{canvas.setPointerCapture?.(e.pointerId);}catch{}
  });
  canvas.addEventListener('pointermove',e=>{
    const p=point(e);if(!pointer){if(e.pointerType!=='touch')aim={...p,until:Infinity};return;}
    if(e.pointerId!==pointer.id)return;e.preventDefault();aim={...p,until:Infinity};
    if(world.state!=='clear'){world.stroke(pointer.x,pointer.y,p.x,p.y);react();}pointer={...pointer,...p};
  });
  function endPointer(e){
    if(!pointer||e.pointerId!==pointer.id)return;
    if(e.type!=='pointercancel'&&e.type!=='lostpointercapture'&&world.state!=='clear'){
      const p=point(e);world.stroke(pointer.x,pointer.y,p.x,p.y);aim={...p,until:Infinity};react();
    }
    cancelPointer();
  }
  canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',cancelPointer);canvas.addEventListener('lostpointercapture',cancelPointer);window.addEventListener('blur',cancelPointer);
  canvas.addEventListener('keydown',e=>{
    const vectors={ArrowLeft:[-18,0],ArrowRight:[18,0],ArrowUp:[0,-18],ArrowDown:[0,18]};
    if(vectors[e.key]){e.preventDefault();const[dx,dy]=vectors[e.key];aim={x:clamp(aim.x+dx,0,360),y:clamp(aim.y+dy,0,worldHeight),until:Infinity};}
    if(e.key==='Enter'||e.key===' '){e.preventDefault();fire(aim.x,aim.y);}
  });
  $('burst').onclick=()=>fire(aim.x,aim.y);
  function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
  function jelly(b){
    const hot=b.fuse!==null,speed=Math.hypot(b.vx,b.vy),stretch=motion?1:Math.min(.17,speed/1800),pulse=hot&&!motion?1+Math.sin(now*28+b.id)*.055:1;
    const color=hot?'#ffc879':palette[b.color],r=b.r,wiggle=motion?0:Math.sin(now*2+b.id)*.025;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(motion?0:b.angle+wiggle);ctx.scale((1+stretch)*pulse,(1-stretch*.65)*pulse);
    if(hot){ctx.globalAlpha=.12+Math.sin(now*14+b.id)*.04;circle(0,0,r*1.55,'#ffae69');ctx.globalAlpha=1;}
    if(speed>100&&!motion){ctx.globalAlpha=.13;ctx.beginPath();ctx.moveTo(-b.vx*.025,-b.vy*.025);ctx.lineTo(0,0);ctx.strokeStyle=color;ctx.lineWidth=r*1.2;ctx.lineCap='round';ctx.stroke();ctx.globalAlpha=1;}
    // The silhouette squashes under impact; the face stays large enough to read.
    ctx.beginPath();ctx.moveTo(-r,-r*.08);ctx.bezierCurveTo(-r,-r*1.05,r*.5,-r*1.2,r*.92,-r*.15);ctx.bezierCurveTo(r*1.2,r*.8,r*.2,r*1.12,-r*.65,r*.75);ctx.bezierCurveTo(-r*.96,r*.6,-r*1.1,r*.38,-r,-r*.08);
    ctx.fillStyle=color;ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=hot?'#ffeab2':'#ffffff40';ctx.stroke();
    ctx.globalAlpha=.5;ctx.beginPath();ctx.ellipse(-r*.32,-r*.42,r*.25,r*.12,-.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=1;
    const ex=r*.32,ey=-r*.03;
    if(hot){ctx.strokeStyle='#77404a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-ex-2,ey-1);ctx.lineTo(-ex+1,ey+1);ctx.lineTo(-ex-2,ey+3);ctx.moveTo(ex+2,ey-1);ctx.lineTo(ex-1,ey+1);ctx.lineTo(ex+2,ey+3);ctx.stroke();}
    else{ctx.fillStyle='#292b49';ctx.beginPath();ctx.ellipse(-ex,ey,1.65,2.4,0,0,Math.PI*2);ctx.ellipse(ex,ey,1.65,2.4,0,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle=hot?'#77404a':'#3b4058';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(0,r*.2,r*.17,0,Math.PI);ctx.stroke();
    ctx.restore();
  }
  function drawEffects(dt){
    for(const s of strokes){s.life-=dt;if(s.life<=0)continue;ctx.globalAlpha=s.life/s.max*.12;ctx.beginPath();ctx.moveTo(s.ax,s.ay);ctx.lineTo(s.bx,s.by);ctx.lineWidth=s.r*2;ctx.lineCap='round';ctx.strokeStyle='#ffe4a1';ctx.stroke();}strokes=strokes.filter(s=>s.life>0);ctx.globalAlpha=1;
    for(const p of particles){
      p.life-=dt;if(p.life<=0)continue;const t=1-p.life/p.max;ctx.globalAlpha=Math.min(1,p.life*5);
      if(p.kind==='reward'){
        const endX=180,endY=32,curve=Math.sin(t*Math.PI);p.x=p.sx+(endX-p.sx)*t+p.bend*curve;p.y=p.sy+(endY-p.sy)*t-curve*55;
        ctx.beginPath();ctx.moveTo(p.x-(endX-p.sx)*.035,p.y-(endY-p.sy)*.035);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#ffe5a8';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();circle(p.x,p.y,p.r,'#fff0b7');
      }else{
        if(!motion){p.vy+=140*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*2);p.angle+=p.spin*dt;}
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;const r=p.r*(1-t*.6);
        ctx.beginPath();if(p.kind==='star'){ctx.moveTo(0,-r*2);ctx.lineTo(r*.5,-r*.4);ctx.lineTo(r*1.7,0);ctx.lineTo(r*.4,r*.5);ctx.lineTo(0,r*1.7);ctx.lineTo(-r*.5,r*.4);ctx.lineTo(-r*1.7,0);ctx.lineTo(-r*.4,-r*.5);}else{ctx.moveTo(-r,-r);ctx.lineTo(r*1.3,-r*.2);ctx.lineTo(r*.3,r);}ctx.closePath();ctx.fill();ctx.restore();
      }
    }
    particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;
    for(const r of rings){r.life-=dt;if(r.life<=0)continue;const t=1-r.life/r.max;ctx.globalAlpha=(1-t)*.65;ctx.strokeStyle=r.color;ctx.lineWidth=r.width*(1-t*.75);ctx.beginPath();ctx.arc(r.x,r.y,r.r*(.15+Math.pow(t,.5)),0,Math.PI*2);ctx.stroke();if(t<.2){ctx.globalAlpha=(.2-t)*.45;circle(r.x,r.y,r.r*.8,r.color);}}
    rings=rings.filter(r=>r.life>0).slice(-75);ctx.globalAlpha=1;
    for(const s of sparks){s.life-=dt;if(s.life<=0)continue;const t=1-s.life/s.max,px=s.x+(s.tx-s.x)*t,py=s.y+(s.ty-s.y)*t-Math.sin(t*Math.PI)*16;ctx.globalAlpha=(1-t)*.7;ctx.beginPath();ctx.moveTo(px-(s.tx-s.x)*.1,py-(s.ty-s.y)*.1);ctx.lineTo(px,py);ctx.lineWidth=2;ctx.strokeStyle=s.color;ctx.stroke();circle(px,py,2.3,'#fff1c8');}sparks=sparks.filter(s=>s.life>0);ctx.globalAlpha=1;
  }
  function draw(dt){
    ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,360,worldHeight);ctx.save();
    if(shake>.05&&!motion){ctx.translate(Math.sin(now*145)*shake,Math.cos(now*119)*shake*.6);shake*=Math.exp(-dt*17);}
    for(const a of ambient){ctx.globalAlpha=.12+Math.sin(now*.8+a.phase)*.08;circle(a.x,a.y,a.r,'#c6caff');}ctx.globalAlpha=1;
    for(const b of world.bodies)if(!b.dead)jelly(b);
    drawEffects(dt);ctx.restore();
    if(aim.until>now&&world.state!=='clear'){ctx.save();ctx.globalAlpha=pointer?.8:.5;ctx.beginPath();ctx.arc(aim.x,aim.y,BlastWorld.TOUCH_RADIUS,0,Math.PI*2);ctx.strokeStyle='#ffe4a1';ctx.lineWidth=1.5;ctx.stroke();circle(aim.x,aim.y,2,'#fff1c6');ctx.restore();}
  }
  function frame(time){
    if(document.hidden){last=0;raf=0;return;}
    const dt=last?clamp((time-last)/1000,0,.05):1/60;last=time;now=time/1000;
    if(clearAt&&now>=clearAt)newWave();
    let step=dt;if(hold>0&&!motion){const part=Math.min(hold,dt);hold-=part;step=dt-part+part*.12;}
    if(pointer&&world.state!=='clear')world.stroke(pointer.x,pointer.y,pointer.x,pointer.y);
    world.update(step);handleEvents();draw(dt);
    if(shoutUntil&&now>=shoutUntil){$('shout').classList.remove('show');shoutUntil=0;}
    raf=requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelPointer();cancelAnimationFrame(raf);raf=0;last=0;if(audio)audio.suspend().catch(()=>{});}else if(!raf){last=0;raf=requestAnimationFrame(frame);}});
  window.addEventListener('resize',resize);
  renderSound();resize();newWave();raf=requestAnimationFrame(frame);
})();

</script>
