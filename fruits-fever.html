note(midi,t,len,type='triangle',vol=.07,slide=null){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(440*Math.pow(2,(midi-69)/12),t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+len);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(this.master);this.nodes.add(o);o.onended=()=>{o.disconnect();g.disconnect();this.nodes.delete(o);};o.start(t);o.stop(t+len+.03);}
